<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#111;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#fff;
  touch-action:none;
}

button{
  color:white;
  font:inherit;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

/* ================= WORLD ================= */

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#91c8e5;
}

#sky{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      #69acd2 0%,
      #b9dbea 46%,
      #d9ded7 57%,
      #72806f 58%,
      #313733 100%
    );
  transition:.8s;
}

#sun{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  right:18%;
  top:13%;
  background:#fff3a5;
  box-shadow:0 0 45px #fff3a5;
  transition:.8s;
}

#road{
  position:absolute;
  left:50%;
  top:49%;
  width:150%;
  height:60%;
  transform:translateX(-50%);
  background:#444;
  clip-path:polygon(39% 0,61% 0,100% 100%,0 100%);
}

.roadEdge{
  position:absolute;
  top:0;
  width:7px;
  height:100%;
  background:#eee;
}

.roadEdge.left{left:39%}
.roadEdge.right{right:39%}

#roadMarks{
  position:absolute;
  left:50%;
  top:50%;
  width:8px;
  height:50%;
  transform:translateX(-50%);
  overflow:hidden;
}

.mark{
  position:absolute;
  left:50%;
  width:9px;
  height:45px;
  transform:translateX(-50%);
  background:#eee;
  border-radius:4px;
}

.tree{
  position:absolute;
  width:70px;
  height:120px;
}

.tree:before{
  content:"";
  position:absolute;
  bottom:0;
  left:31px;
  width:9px;
  height:62px;
  background:#563727;
}

.tree:after{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:65px;
  height:65px;
  border-radius:50%;
  background:#285b39;
  box-shadow:
    22px 12px 0 #376d43,
    -14px 24px 0 #3b7549;
}

.t1{left:2%;top:54%;transform:scale(.75)}
.t2{right:2%;top:55%;transform:scale(.72)}
.t3{left:15%;top:58%;transform:scale(.45)}
.t4{right:14%;top:58%;transform:scale(.5)}

#windshield{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.25),
      transparent 14%,
      transparent 86%,
      rgba(0,0,0,.25)
    );
}

/* ================= MIRROR ================= */

#mirror{
  position:absolute;
  z-index:20;
  top:max(12px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:210px;
  height:68px;
  border:4px solid rgba(0,0,0,.85);
  border-radius:14px;
  overflow:hidden;
  background:#18252a;
  box-shadow:0 5px 20px rgba(0,0,0,.45);
}

#rearScene{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      #507b91 0 46%,
      #4b554d 47% 100%
    );
}

#rearRoad{
  position:absolute;
  left:50%;
  bottom:-20px;
  width:150%;
  height:75%;
  transform:translateX(-50%);
  background:#3b3b3b;
  clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);
}

#rearCar{
  position:absolute;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:25px;
  height:13px;
  background:#777;
  border-radius:5px;
  opacity:.8;
}

#mirrorText{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  letter-spacing:1px;
  color:rgba(255,255,255,.65);
}

/* ================= TOP INFO ================= */

#vehicleInfo{
  position:absolute;
  z-index:30;
  top:max(14px,env(safe-area-inset-top));
  left:12px;
  padding:9px 12px;
  border-radius:13px;
  background:rgba(10,13,16,.55);
  backdrop-filter:blur(8px);
}

#vehicleName{
  font-weight:900;
  letter-spacing:1px;
  font-size:13px;
}

#condition{
  font-size:10px;
  opacity:.7;
  margin-top:2px;
}

.topButtons{
  position:absolute;
  z-index:30;
  right:12px;
  top:max(14px,env(safe-area-inset-top));
  display:flex;
  gap:7px;
}

.topButton{
  width:45px;
  height:45px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:13px;
  background:rgba(10,13,16,.5);
  backdrop-filter:blur(8px);
  font-size:19px;
}

.topButton:active{
  transform:scale(.9);
}

/* ================= DASHBOARD ================= */

#dashboard{
  position:absolute;
  z-index:25;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(520px,68vw);
  height:105px;
  background:rgba(9,11,12,.78);
  border-radius:28px 28px 0 0;
  border-top:1px solid rgba(255,255,255,.15);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}

.gauge{
  width:82px;
  height:82px;
  border-radius:50%;
  background:radial-gradient(circle,#202426 0 55%,#090a0a 56%);
  border:3px solid #555;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.value{
  font-size:22px;
  font-weight:900;
}

.label{
  font-size:8px;
  letter-spacing:1px;
  opacity:.65;
}

#gear{
  width:48px;
  height:48px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#090a0a;
  border:2px solid #555;
  font-size:22px;
  font-weight:900;
}

#miniInfo{
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:8px;
  opacity:.65;
}

/* ================= STEERING ================= */

#steering{
  position:absolute;
  z-index:100;
  left:18px;
  bottom:125px;
  width:155px;
  height:155px;
  touch-action:none;
}

#wheel{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:13px solid rgba(15,17,18,.72);
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.15),
    0 7px 20px rgba(0,0,0,.4);
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.08) 0 17%,
      transparent 18%
    );
}

#wheel:before,
#wheel:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:11px;
  height:58px;
  transform-origin:50% 100%;
  background:rgba(15,17,18,.8);
  border-radius:5px;
}

#wheel:before{
  transform:translate(-50%,-100%) rotate(0deg);
}

#wheel:after{
  transform:translate(-50%,-100%) rotate(120deg);
}

#hub{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:47px;
  height:47px;
  border-radius:50%;
  background:rgba(30,33,35,.85);
  border:2px solid rgba(255,255,255,.2);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:9px;
  font-weight:900;
}

/* ================= PEDALS ================= */

#pedals{
  position:absolute;
  z-index:100;
  right:18px;
  bottom:120px;
  display:flex;
  gap:10px;
  align-items:flex-end;
}

.pedal{
  width:64px;
  height:145px;
  border-radius:17px;
  background:rgba(15,17,18,.42);
  backdrop-filter:blur(4px);
  border:2px solid rgba(255,255,255,.28);
  position:relative;
  overflow:hidden;
  touch-action:none;
}

.pedalFill{
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  height:0;
  border-radius:12px;
  background:rgba(255,255,255,.17);
  pointer-events:none;
}

.pedalTitle{
  position:absolute;
  top:9px;
  left:0;
  right:0;
  text-align:center;
  font-size:8px;
  letter-spacing:1px;
  opacity:.7;
  pointer-events:none;
}

.pedalPercent{
  position:absolute;
  bottom:12px;
  left:0;
  right:0;
  text-align:center;
  font-size:10px;
  font-weight:900;
  pointer-events:none;
}

#brakePedal{
  border-color:rgba(255,100,100,.45);
}

#accelPedal{
  border-color:rgba(100,210,240,.45);
}

/* ================= GEAR SELECTOR ================= */

#gearSelector{
  position:absolute;
  z-index:110;
  right:95px;
  bottom:125px;
  width:47px;
  display:flex;
  flex-direction:column;
  gap:5px;
}

.gearButton{
  width:47px;
  height:36px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(10,12,13,.48);
  backdrop-filter:blur(5px);
  font-size:12px;
  font-weight:900;
}

.gearButton.active{
  background:rgba(80,125,140,.72);
  border-color:#bcecf6;
}

/* ================= SWITCHES ================= */

#switches{
  position:absolute;
  z-index:110;
  left:50%;
  transform:translateX(-50%);
  bottom:110px;
  display:flex;
  gap:6px;
}

.switch{
  width:42px;
  height:42px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.22);
  background:rgba(10,12,13,.45);
  backdrop-filter:blur(5px);
  font-size:16px;
}

.switch.active{
  background:rgba(65,100,110,.72);
  border-color:#bcecf6;
}

/* ================= EXIT ================= */

#exit{
  position:absolute;
  z-index:110;
  left:15px;
  top:72px;
  width:55px;
  height:42px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:12px;
  background:rgba(10,12,13,.48);
  backdrop-filter:blur(5px);
  font-size:10px;
  font-weight:900;
}

/* ================= MESSAGE ================= */

#message{
  position:absolute;
  z-index:200;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  padding:11px 17px;
  border-radius:13px;
  background:rgba(5,7,8,.72);
  backdrop-filter:blur(8px);
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#message.show{
  opacity:1;
}

/* ================= SETTINGS ================= */

#settings{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
}

#settings.open{
  display:flex;
}

.settingsBox{
  width:min(90vw,400px);
  background:#171a1d;
  border:1px solid rgba(255,255,255,.2);
  border-radius:20px;
  padding:20px;
}

.settingsBox h2{
  margin:0 0 15px;
  font-size:20px;
}

.setting{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:13px;
}

.setting button{
  border:1px solid #555;
  background:#282c2f;
  color:white;
  border-radius:9px;
  padding:7px 11px;
}

#closeSettings{
  width:100%;
  height:44px;
  margin-top:17px;
  border:0;
  border-radius:11px;
  background:#405b64;
  font-weight:900;
}

/* ================= NIGHT ================= */

body.night #sky{
  background:
    linear-gradient(
      to bottom,
      #081326 0%,
      #182b3d 50%,
      #313a36 60%,
      #161a18 100%
    );
}

body.night #sun{
  background:#d9e7ff;
  box-shadow:0 0 25px #a9caff;
}

/* ================= SMALL SCREENS ================= */

@media(max-height:700px){

  #steering{
    transform:scale(.82);
    transform-origin:bottom left;
    bottom:105px;
  }

  #pedals{
    transform:scale(.78);
    transform-origin:bottom right;
    bottom:105px;
  }

  #gearSelector{
    transform:scale(.78);
    transform-origin:bottom right;
    bottom:108px;
    right:78px;
  }

  #switches{
    bottom:94px;
  }

  #dashboard{
    height:88px;
  }

  .gauge{
    width:68px;
    height:68px;
  }

  #gear{
    width:40px;
    height:40px;
  }
}
</style>
</head>

<body>

<div id="world">
  <div id="sky"></div>
  <div id="sun"></div>

  <div class="tree t1"></div>
  <div class="tree t2"></div>
  <div class="tree t3"></div>
  <div class="tree t4"></div>

  <div id="road">
    <div class="roadEdge left"></div>
    <div class="roadEdge right"></div>
  </div>

  <div id="roadMarks"></div>
  <div id="windshield"></div>
</div>

<!-- MIRROR -->
<div id="mirror">
  <div id="rearScene">
    <div id="rearRoad"></div>
    <div id="rearCar"></div>
  </div>
  <div id="mirrorText">REAR VIEW</div>
</div>

<!-- VEHICLE -->
<div id="vehicleInfo">
  <div id="vehicleName">WAYFLO • CAR 01</div>
  <div id="condition">CONDITION 100%</div>
</div>

<div class="topButtons">
  <button class="topButton" id="mirrorButton">🪞</button>
  <button class="topButton" id="settingsButton">⚙️</button>
</div>

<button id="exit">🚪 EXIT</button>

<!-- DASHBOARD -->
<div id="dashboard">

  <div class="gauge">
    <div class="value" id="speed">0</div>
    <div class="label">KM/H</div>
  </div>

  <div id="gear">P</div>

  <div class="gauge">
    <div class="value" id="rpm">800</div>
    <div class="label">RPM</div>
  </div>

  <div id="miniInfo">
    TEMP <span id="temp">90</span>°C
    • FUEL <span id="fuel">100</span>%
    • <span id="statusText">READY</span>
  </div>

</div>

<!-- STEERING -->
<div id="steering">
  <div id="wheel">
    <div id="hub">WAYFLO</div>
  </div>
</div>

<!-- PEDALS -->
<div id="pedals">

  <div class="pedal" id="brakePedal">
    <div class="pedalFill" id="brakeFill"></div>
    <div class="pedalTitle">BRAKE</div>
    <div class="pedalPercent" id="brakePercent">0%</div>
  </div>

  <div class="pedal" id="accelPedal">
    <div class="pedalFill" id="accelFill"></div>
    <div class="pedalTitle">ACCEL</div>
    <div class="pedalPercent" id="accelPercent">0%</div>
  </div>

</div>

<!-- GEARS -->
<div id="gearSelector">

  <button class="gearButton active" data-gear="P">P</button>
  <button class="gearButton" data-gear="R">R</button>
  <button class="gearButton" data-gear="N">N</button>
  <button class="gearButton" data-gear="D">D</button>

</div>

<!-- CONTROLS -->
<div id="switches">

  <button class="switch" id="lights">💡</button>
  <button class="switch" id="left">◀</button>
  <button class="switch" id="hazard">⚠️</button>
  <button class="switch" id="right">▶</button>
  <button class="switch" id="wipers">🌧️</button>

</div>

<div id="message"></div>

<!-- SETTINGS -->
<div id="settings">

  <div class="settingsBox">

    <h2>WAYFLO SETTINGS</h2>

    <div class="setting">
      <span>Automatic headlights</span>
      <button data-setting="autoLights">ON</button>
    </div>

    <div class="setting">
      <span>Automatic wipers</span>
      <button data-setting="autoWipers">ON</button>
    </div>

    <div class="setting">
      <span>Traction control</span>
      <button data-setting="traction">ON</button>
    </div>

    <div class="setting">
      <span>ABS</span>
      <button data-setting="abs">ON</button>
    </div>

    <div class="setting">
      <span>Night mode</span>
      <button data-setting="night">OFF</button>
    </div>

    <button id="closeSettings">DONE</button>

  </div>

</div>

<script>

/* =========================================================
   VEHICLE STATE
========================================================= */

const car = {

  speed:0,
  rpm:800,
  temp:90,
  fuel:100,
  damage:0,

  gear:"P",

  throttle:0,
  brake:0,

  steering:0,
  steeringAngle:0,

  distance:0,

  headlights:false,
  left:false,
  right:false,
  hazard:false,
  wipers:false,

  autoLights:true,
  autoWipers:true,
  traction:true,
  abs:true,
  night:false,

  running:true

};

/* =========================================================
   ELEMENTS
========================================================= */

const $ = id => document.getElementById(id);

const speedEl = $("speed");
const rpmEl = $("rpm");
const tempEl = $("temp");
const fuelEl = $("fuel");
const gearEl = $("gear");
const statusEl = $("statusText");
const conditionEl = $("condition");

const wheel = $("wheel");

const accelPedal = $("accelPedal");
const brakePedal = $("brakePedal");

const accelFill = $("accelFill");
const brakeFill = $("brakeFill");

const accelPercent = $("accelPercent");
const brakePercent = $("brakePercent");

const message = $("message");

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function showMessage(text){

  message.textContent = text;
  message.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(
      () => message.classList.remove("show"),
      1600
    );
}

/* =========================================================
   GEAR SELECTOR
========================================================= */

document
  .querySelectorAll(".gearButton")
  .forEach(button => {

    button.addEventListener("click",() => {

      const requested =
        button.dataset.gear;

      /*
        Don't allow selecting a new gear
        while travelling quickly.
      */

      if(car.speed > 3){

        showMessage(
          "Slow down before changing gear"
        );

        return;
      }

      car.gear = requested;

      document
        .querySelectorAll(".gearButton")
        .forEach(b =>
          b.classList.toggle(
            "active",
            b === button
          )
        );

      gearEl.textContent =
        requested;

      if(requested === "R"){
        showMessage("REVERSE SELECTED");
      }

      if(requested === "D"){
        showMessage("DRIVE SELECTED");
      }

      if(requested === "P"){
        showMessage("PARK");
      }

    });

  });

/* =========================================================
   PROGRESSIVE PEDALS
========================================================= */

function createPedal(
  element,
  callback
){

  let activePointer = null;

  function update(event){

    const rect =
      element.getBoundingClientRect();

    let value =
      (rect.bottom - event.clientY) /
      rect.height;

    value =
      Math.max(
        0,
        Math.min(
          1,
          value
        )
      );

    callback(value);
  }

  element.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      activePointer =
        event.pointerId;

      element.setPointerCapture(
        activePointer
      );

      update(event);
    }
  );

  element.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId ===
        activePointer
      ){

        update(event);

      }
    }
  );

  function release(){

    activePointer = null;
    callback(0);

  }

  element.addEventListener(
    "pointerup",
    release
  );

  element.addEventListener(
    "pointercancel",
    release
  );

}

createPedal(
  accelPedal,
  value => car.throttle = value
);

createPedal(
  brakePedal,
  value => car.brake = value
);

/* =========================================================
   STEERING
========================================================= */

let steeringPointer = null;
let steeringStartX = 0;
let steeringStart = 0;

steeringPointer = null;

wheel.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    steeringPointer =
      event.pointerId;

    wheel.setPointerCapture(
      steeringPointer
    );

    steeringStartX =
      event.clientX;

    steeringStart =
      car.steering;

  }
);

wheel.addEventListener(
  "pointermove",
  event => {

    if(
      event.pointerId !==
      steeringPointer
    ){

      return;

    }

    /*
      Horizontal thumb movement
      controls the wheel.
    */

    const delta =
      (event.clientX -
       steeringStartX) / 90;

    car.steering =
      Math.max(
        -1,
        Math.min(
          1,
          steeringStart + delta
        )
      );

  }
);

function releaseSteering(){

  steeringPointer = null;

}

wheel.addEventListener(
  "pointerup",
  releaseSteering
);

wheel.addEventListener(
  "pointercancel",
  releaseSteering
);

/* =========================================================
   STEERING RETURN TO CENTRE
========================================================= */

function returnSteering(delta){

  if(
    steeringPointer === null
  ){

    /*
      Smooth return instead of
      instantly snapping back.
    */

    car.steering *=
      Math.pow(
        0.035,
        delta
      );

  }

}

/* =========================================================
   LIGHTS / INDICATORS / WIPERS
========================================================= */

function toggleButton(
  id,
  property
){

  $(id).addEventListener(
    "click",
    () => {

      car[property] =
        !car[property];

      $(id).classList.toggle(
        "active",
        car[property]
      );

    }
  );

}

toggleButton(
  "lights",
  "headlights"
);

$("left").addEventListener(
  "click",
  () => {

    car.left =
      !car.left;

    car.right = false;

    $("left").classList.toggle(
      "active",
      car.left
    );

    $("right").classList.remove(
      "active"
    );

  }
);

$("right").addEventListener(
  "click",
  () => {

    car.right =
      !car.right;

    car.left = false;

    $("right").classList.toggle(
      "active",
      car.right
    );

    $("left").classList.remove(
      "active"
    );

  }
);

toggleButton(
  "hazard",
  "hazard"
);

toggleButton(
  "wipers",
  "wipers"
);

/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(delta){

  let acceleration = 0;

  /*
    PARK / NEUTRAL
  */

  if(
    car.gear === "P" ||
    car.gear === "N"
  ){

    acceleration = 0;

  }

  /*
    DRIVE
  */

  if(car.gear === "D"){

    acceleration +=
      car.throttle * 38;

  }

  /*
    REVERSE
  */

  if(car.gear === "R"){

    acceleration -=
      car.throttle * 24;

  }

  /*
    Rolling resistance
  */

  if(car.speed > 0){

    acceleration -=
      4 +
      car.speed * .055;

  }

  /*
    Brake
  */

  acceleration -=
    car.brake * 95;

  /*
    Traction control
  */

  if(
    car.traction &&
    car.throttle > .85
  ){

    acceleration *= .9;

  }

  car.speed +=
    acceleration *
    delta;

  /*
    Clamp speed.
    Negative speed represents reverse.
  */

  car.speed =
    Math.max(
      -35,
      Math.min(
        220,
        car.speed
      )
    );

  /*
    RPM
  */

  const absoluteSpeed =
    Math.abs(car.speed);

  if(
    car.gear === "P" ||
    car.gear === "N"
  ){

    car.rpm = 800;

  }else{

    car.rpm =
      750 +
      car.throttle * 4200 +
      absoluteSpeed * 15;

  }

  car.rpm =
    Math.min(
      7000,
      car.rpm
    );

  /*
    Steering.

    Reverse steering is naturally
    opposite because vehicle motion
    is backwards.
  */

  const steeringEffect =
    Math.min(
      1,
      absoluteSpeed / 18
    );

  const direction =
    car.gear === "R"
      ? -1
      : 1;

  car.steeringAngle +=
    car.steering *
    steeringEffect *
    70 *
    delta *
    direction;

  /*
    Distance.
  */

  car.distance +=
    Math.abs(car.speed) /
    3.6 *
    delta /
    1000;

  /*
    Temperature.
  */

  car.temp +=
    (
      87 +
      car.throttle * 13 -
      car.temp
    ) *
    delta *
    .8;

  /*
    Fuel.
  */

  car.fuel -=
    car.throttle *
    delta *
    .0025;

  car.fuel =
    Math.max(
      0,
      car.fuel
    );

  /*
    Very simple damage model.
  */

  if(
    Math.abs(car.speed) > 100 &&
    Math.abs(car.steering) > .9
  ){

    car.damage +=
      delta * .02;

  }

  car.damage =
    Math.min(
      100,
      car.damage
    );

  returnSteering(delta);

}

/* =========================================================
   ROAD ANIMATION
========================================================= */

let roadOffset = 0;

function updateRoad(delta){

  roadOffset +=
    Math.abs(car.speed) *
    delta *
    .9;

  const marks =
    document.querySelectorAll(
      ".mark"
    );

  marks.forEach(
    (mark,index) => {

      let y =
        (
          index * 105 +
          roadOffset * 2
        ) % 520;

      mark.style.top =
        y + "px";

      const scale =
        .25 + y / 560;

      mark.style.transform =
        `translateX(-50%) scale(${scale})`;

    }
  );

}

/* =========================================================
   CREATE ROAD MARKS
========================================================= */

for(
  let i=0;
  i<7;
  i++
){

  const mark =
    document.createElement("div");

  mark.className =
    "mark";

  mark.style.top =
    (i * 105) + "px";

  $("roadMarks").appendChild(
    mark
  );

}

/* =========================================================
   REAR VIEW
========================================================= */

function updateMirror(){

  const rearCar =
    $("rearCar");

  /*
    Vehicle behind becomes more visible
    when travelling slowly/reversing.
  */

  if(
    car.gear === "R"
  ){

    rearCar.style.opacity = ".15";

  }else{

    rearCar.style.opacity = ".8";

  }

}

/* =========================================================
   REVERSE LIGHTS
========================================================= */

function updateReverseLights(){

  const mirror =
    $("mirror");

  if(
    car.gear === "R"
  ){

    mirror.style.boxShadow =
      "0 0 20px rgba(255,255,255,.35)";

  }else{

    mirror.style.boxShadow =
      "0 5px 20px rgba(0,0,0,.45)";

  }

}

/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard(){

  speedEl.textContent =
    Math.round(
      Math.abs(car.speed)
    );

  rpmEl.textContent =
    Math.round(
      car.rpm
    );

  tempEl.textContent =
    Math.round(
      car.temp
    );

  fuelEl.textContent =
    Math.round(
      car.fuel
    );

  gearEl.textContent =
    car.gear;

  conditionEl.textContent =
    "CONDITION " +
    Math.round(
      100 - car.damage
    ) +
    "%";

  accelFill.style.height =
    (car.throttle * 100) +
    "%";

  brakeFill.style.height =
    (car.brake * 100) +
    "%";

  accelPercent.textContent =
    Math.round(
      car.throttle * 100
    ) + "%";

  brakePercent.textContent =
    Math.round(
      car.brake * 100
    ) + "%";

  /*
    Rotate the actual steering wheel.
  */

  wheel.style.transform =
    `rotate(${car.steering * 135}deg)`;

  if(
    car.gear === "R"
  ){

    statusEl.textContent =
      "REVERSE";

  }else if(
    car.gear === "D"
  ){

    statusEl.textContent =
      "DRIVE";

  }else if(
    car.gear === "P"
  ){

    statusEl.textContent =
      "PARK";

  }else{

    statusEl.textContent =
      "NEUTRAL";

  }

}

/* =========================================================
   SETTINGS
========================================================= */

$("settingsButton")
  .addEventListener(
    "click",
    () => {

      $("settings")
        .classList.add(
          "open"
        );

    }
  );

$("closeSettings")
  .addEventListener(
    "click",
    () => {

      $("settings")
        .classList.remove(
          "open"
        );

    }
  );

document
  .querySelectorAll(
    "[data-setting]"
  )
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const property =
          button.dataset.setting;

        car[property] =
          !car[property];

        button.textContent =
          car[property]
            ? "ON"
            : "OFF";

        if(
          property === "night"
        ){

          document.body.classList.toggle(
            "night",
            car.night
          );

        }

      }
    );

  });

/* =========================================================
   EXIT
========================================================= */

$("exit").addEventListener(
  "click",
  () => {

    car.throttle = 0;
    car.brake = 1;
    car.gear = "P";

    document
      .querySelectorAll(
        ".gearButton"
      )
      .forEach(
        button =>
          button.classList.toggle(
            "active",
            button.dataset.gear === "P"
          )
      );

    showMessage(
      "VEHICLE PARKED"
    );

    setTimeout(
      () => car.brake = 0,
      500
    );

  }
);

/* =========================================================
   MIRROR BUTTON
========================================================= */

$("mirrorButton")
  .addEventListener(
    "click",
    () => {

      $("mirror")
        .scrollIntoView({
          behavior:"smooth"
        });

      showMessage(
        "REAR VIEW"
      );

    }
  );

/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

window.addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();

    if(key === "w")
      car.throttle = 1;

    if(key === "s")
      car.brake = 1;

    if(key === "a")
      car.steering = -1;

    if(key === "d")
      car.steering = 1;

    if(key === "r" && Math.abs(car.speed) < 3)
      car.gear = "R";

    if(key === "n" && Math.abs(car.speed) < 3)
      car.gear = "N";

    if(key === "p" && Math.abs(car.speed) < 3)
      car.gear = "P";

    if(key === "f" && Math.abs(car.speed) < 3)
      car.gear = "D";

  }
);

window.addEventListener(
  "keyup",
  event => {

    const key =
      event.key.toLowerCase();

    if(key === "w")
      car.throttle = 0;

    if(key === "s")
      car.brake = 0;

    if(key === "a" || key === "d")
      car.steering = 0;

  }
);

/* =========================================================
   GAME LOOP
========================================================= */

let previous =
  performance.now();

function loop(time){

  const delta =
    Math.min(
      .05,
      (time - previous) / 1000
    );

  previous = time;

  updatePhysics(delta);
  updateRoad(delta);
  updateDashboard();
  updateMirror();
  updateReverseLights();

  requestAnimationFrame(
    loop
  );

}

requestAnimationFrame(
  loop
);

/* =========================================================
   START
========================================================= */

setTimeout(
  () => {

    showMessage(
      "WAYFLO • COCKPIT READY"
    );

  },
  700
);

</script>

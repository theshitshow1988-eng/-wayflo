<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05090d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

button{
  border:0;
  color:#fff;
  font:inherit;
  padding:0;
  margin:0;
  background:none;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100dvh;
  min-height:100svh;
  overflow:hidden;
  background:#071016;
}

/* =====================================================
   WORLD
===================================================== */

#world{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:55dvh;
  min-height:420px;
  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #62afd9 0%,
      #a8d9e9 56%,
      #8b9d7d 57%,
      #607158 100%
    );
}

#sun{
  position:absolute;
  width:82px;
  height:82px;
  right:10%;
  top:23%;
  border-radius:50%;
  background:#fff1a5;
  box-shadow:0 0 45px rgba(255,240,165,.45);
}

.hill{
  position:absolute;
  left:-20%;
  width:140%;
  height:18%;
  bottom:27%;
  border-radius:50% 50% 0 0;
  background:#758b92;
}

.hill.two{
  bottom:22%;
  background:#819477;
  transform:scaleX(1.15);
}

/* Trees */

.tree{
  position:absolute;
  bottom:13%;
  width:17px;
  height:82px;
  background:#60472f;
}

.tree:before{
  content:"";
  position:absolute;
  width:92px;
  height:92px;
  left:-38px;
  top:-58px;
  border-radius:50%;
  background:#285d39;
  box-shadow:
    34px 17px 0 #326d42,
    -24px 23px 0 #367447;
}

.t1{left:7%;transform:scale(.75)}
.t2{left:24%;transform:scale(.52)}
.t3{right:18%;transform:scale(1)}
.t4{right:5%;transform:scale(.7)}

/* Road */

#road{
  position:absolute;
  left:7%;
  bottom:-2%;
  width:86%;
  height:55%;

  background:#363a3c;

  clip-path:polygon(
    35% 0,
    65% 0,
    100% 100%,
    0 100%
  );

  transition:transform .15s linear;
}

.roadEdge{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:#fff;
}

.roadEdge.left{
  left:31%;
}

.roadEdge.right{
  right:31%;
}

.lane{
  position:absolute;
  left:50%;
  width:5px;
  height:9%;
  border-radius:4px;
  background:#fff;
  transform:translateX(-50%);
}

.l1{top:5%}
.l2{top:30%}
.l3{top:55%}
.l4{top:80%}

/* =====================================================
   TOP AREA
===================================================== */

#statusCard{
  position:absolute;
  z-index:100;

  top:calc(env(safe-area-inset-top) + 14px);
  left:16px;

  width:205px;
  min-height:88px;

  padding:13px 15px;

  border-radius:18px;

  background:rgba(8,28,40,.84);
  border:1px solid rgba(255,255,255,.22);

  box-shadow:0 8px 22px rgba(0,0,0,.25);
}

.vehicleName{
  font-size:16px;
  line-height:1.35;
  font-weight:800;
  letter-spacing:2px;
}

.condition{
  margin-top:7px;
  font-size:12px;
}

.dot{
  color:#43e276;
}

#topButtons{
  position:absolute;
  z-index:100;

  top:calc(env(safe-area-inset-top) + 14px);
  right:14px;

  display:flex;
  gap:8px;
}

.topButton{
  width:72px;
  height:72px;

  border-radius:18px;

  background:rgba(8,28,40,.84);
  border:1px solid rgba(255,255,255,.22);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.topIcon{
  font-size:25px;
}

.topText{
  margin-top:5px;
  font-size:9px;
  letter-spacing:1px;
  font-weight:bold;
}

#exitButton{
  position:absolute;
  z-index:100;

  top:calc(env(safe-area-inset-top) + 105px);
  left:16px;

  width:82px;
  height:70px;

  border-radius:18px;

  background:rgba(8,28,40,.84);
  border:1px solid rgba(255,255,255,.22);

  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

#exitButton span{
  display:block;
  font-size:24px;
  margin-bottom:4px;
}

/* =====================================================
   MIRROR
===================================================== */

#mirror{
  position:absolute;
  z-index:60;

  left:21%;
  right:21%;
  top:28%;

  height:15%;
  min-height:70px;

  border:5px solid #101417;
  border-radius:25px;

  overflow:hidden;

  background:
    linear-gradient(
      to bottom,
      #78badd 0%,
      #a1d0d0 54%,
      #72866e 55%,
      #52624f 100%
    );

  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

#mirrorRoad{
  position:absolute;
  left:40%;
  bottom:0;
  width:20%;
  height:65%;

  background:#3b3d3e;

  clip-path:polygon(
    40% 0,
    60% 0,
    100% 100%,
    0 100%
  );
}

#mirrorCar{
  position:absolute;
  left:48%;
  bottom:20%;

  width:5%;
  height:11%;

  background:#171a1c;
  border-radius:3px;
}

/* =====================================================
   COCKPIT
===================================================== */

#cockpit{
  position:absolute;
  z-index:20;

  left:0;
  right:0;
  bottom:0;

  height:45dvh;
  min-height:340px;

  background:
    linear-gradient(
      to bottom,
      rgba(4,8,11,.90),
      rgba(2,5,7,.98)
    );

  border-top:1px solid rgba(255,255,255,.15);
}

/* =====================================================
   DASHBOARD
===================================================== */

#dashboard{
  position:absolute;

  top:12px;
  left:0;
  right:0;

  height:78px;

  display:flex;
  justify-content:center;
  align-items:center;
  gap:9px;
}

.gauge{
  width:76px;
  height:76px;

  border-radius:50%;

  background:#080c0f;
  border:5px solid #30383d;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;

  box-shadow:
    inset 0 0 18px #000,
    0 2px 8px rgba(0,0,0,.45);
}

.gaugeValue{
  font-size:25px;
  font-weight:800;
}

.gaugeUnit{
  font-size:8px;
  letter-spacing:1px;
  opacity:.7;
}

#gearDisplay{
  width:55px;
  height:55px;

  border-radius:10px;

  background:#080c0f;
  border:4px solid #363e43;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:26px;
  font-weight:800;
}

#dashInfo{
  position:absolute;

  top:91px;
  left:0;
  right:0;

  text-align:center;

  font-size:10px;
  letter-spacing:1px;

  white-space:nowrap;
  opacity:.9;
}

.ready{
  color:#43e276;
}

/* =====================================================
   LOWER COCKPIT
===================================================== */

#drivingArea{
  position:absolute;

  left:0;
  right:0;

  top:125px;
  bottom:78px;
}

/* Steering */

#steering{
  position:absolute;

  left:22px;
  bottom:12px;

  width:138px;
  height:138px;

  border-radius:50%;

  background:rgba(8,12,15,.48);

  border:8px solid rgba(255,255,255,.16);

  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.05),
    0 8px 25px rgba(0,0,0,.45);

  transition:transform .08s linear;
}

#steering:before,
#steering:after{
  content:"";
  position:absolute;

  background:rgba(255,255,255,.14);
  border-radius:6px;
}

#steering:before{
  width:12px;
  height:65%;

  left:50%;
  top:18%;

  transform:translateX(-50%);
}

#steering:after{
  width:65%;
  height:12px;

  left:18%;
  top:50%;

  transform:translateY(-50%);
}

#steerCenter{
  position:absolute;
  z-index:2;

  left:25%;
  top:25%;

  width:50%;
  height:50%;

  border-radius:50%;

  background:rgba(8,13,16,.88);
  border:4px solid rgba(255,255,255,.12);

  display:flex;
  align-items:center;
  justify-content:center;
}

#steerLogo{
  font-size:9px;
  font-weight:bold;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  z-index:5;

  top:41%;

  font-size:22px;
  opacity:.75;
}

.steerLeft{left:5%}
.steerRight{right:5%}

/* =====================================================
   GEAR SELECTOR
===================================================== */

#gearSelector{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:translateX(-50%);

  display:flex;
  flex-direction:column;

  gap:4px;
}

.gear{
  width:52px;
  height:31px;

  border-radius:8px;

  background:rgba(9,14,17,.82);

  border:1px solid rgba(255,255,255,.18);

  font-size:13px;
  font-weight:800;
}

.gear.active{
  background:#396b7d;
  border-color:#82d8ee;
}

/* =====================================================
   PEDALS
===================================================== */

#pedals{
  position:absolute;

  right:18px;
  bottom:12px;

  height:150px;

  display:flex;
  gap:8px;
}

.pedal{
  position:relative;

  width:62px;
  height:150px;

  border-radius:16px;

  overflow:hidden;

  background:rgba(8,12,15,.40);

  border:2px solid rgba(255,255,255,.18);
}

.pedal.brake{
  border-color:rgba(225,85,85,.8);
}

.pedal.accel{
  border-color:rgba(50,190,220,.85);
}

.pedalTitle{
  position:absolute;

  top:9px;
  width:100%;

  text-align:center;

  font-size:8px;
  letter-spacing:1px;
  font-weight:bold;
}

.pedalTrack{
  position:absolute;

  left:12px;
  right:12px;

  top:34px;
  bottom:10px;

  border-radius:10px;

  background:rgba(255,255,255,.035);

  border:1px solid rgba(255,255,255,.08);
}

.pedalFill{
  position:absolute;

  left:4px;
  right:4px;
  bottom:4px;

  height:0%;

  border-radius:8px;

  background:rgba(255,255,255,.22);
}

.pedalValue{
  position:absolute;

  bottom:5px;

  width:100%;

  text-align:center;

  font-size:8px;
}

/* =====================================================
   BOTTOM CONTROLS
===================================================== */

#controls{
  position:absolute;

  z-index:100;

  left:10px;
  right:10px;

  bottom:calc(env(safe-area-inset-bottom) + 7px);

  height:60px;

  display:grid;

  grid-template-columns:
    repeat(6,minmax(0,1fr));

  gap:6px;
}

.control{
  height:60px;

  min-width:0;

  border-radius:14px;

  background:rgba(7,12,15,.76);

  border:1px solid rgba(255,255,255,.19);

  display:flex;
  flex-direction:column;

  justify-content:center;
  align-items:center;
}

.controlIcon{
  font-size:19px;
  line-height:1;
}

.controlText{
  margin-top:4px;

  font-size:7px;

  letter-spacing:1px;
  font-weight:bold;
}

.control.on{
  background:rgba(45,100,115,.82);
  border-color:#82d8ee;
}

.control.hazardOn{
  background:rgba(110,35,35,.9);
  border-color:#ef7070;
}

/* =====================================================
   SETTINGS
===================================================== */

#settings{
  position:absolute;
  z-index:500;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  width:min(340px,88vw);

  padding:20px;

  border-radius:20px;

  background:rgba(5,9,12,.97);

  border:1px solid rgba(255,255,255,.2);

  display:none;
}

#settings h2{
  margin:0 0 18px;
  font-size:20px;
}

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px 0;

  border-bottom:1px solid rgba(255,255,255,.1);

  font-size:13px;
}

.closeSettings{
  margin-top:18px;

  width:100%;
  height:42px;

  border-radius:10px;

  background:#396b7d;

  font-weight:bold;
}

/* =====================================================
   SMALL PHONES
===================================================== */

@media(max-width:390px){

  #statusCard{
    width:185px;
    min-height:80px;
    padding:11px 13px;
  }

  .vehicleName{
    font-size:14px;
  }

  .condition{
    font-size:10px;
  }

  .topButton{
    width:64px;
    height:64px;
  }

  #exitButton{
    width:72px;
    height:64px;
  }

  #steering{
    width:122px;
    height:122px;
    left:14px;
  }

  .pedal{
    width:56px;
  }

  #pedals{
    right:10px;
    gap:5px;
  }

  .gauge{
    width:68px;
    height:68px;
  }

  #gearDisplay{
    width:50px;
    height:50px;
  }

  .controlText{
    font-size:6px;
  }
}

/* =====================================================
   LANDSCAPE
===================================================== */

@media(orientation:landscape){

  #world{
    height:100dvh;
  }

  #cockpit{
    height:48dvh;
    min-height:250px;
  }

  #mirror{
    left:34%;
    right:34%;
    top:18%;
    height:17%;
  }

  #drivingArea{
    top:110px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- WORLD -->

  <div id="world">

    <div id="sun"></div>

    <div class="hill"></div>
    <div class="hill two"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div id="road">
      <div class="roadEdge left"></div>
      <div class="roadEdge right"></div>

      <div class="lane l1"></div>
      <div class="lane l2"></div>
      <div class="lane l3"></div>
      <div class="lane l4"></div>
    </div>

  </div>

  <!-- VEHICLE STATUS -->

  <div id="statusCard">

    <div class="vehicleName">
      WAYFLO • VEHICLE 01
    </div>

    <div class="condition">
      <span class="dot">●</span>
      CONDITION <b id="condition">100%</b>
    </div>

  </div>

  <!-- TOP BUTTONS -->

  <div id="topButtons">

    <button class="topButton" id="mirrorButton">
      <div class="topIcon">▱</div>
      <div class="topText">MIRROR</div>
    </button>

    <button class="topButton" id="settingsButton">
      <div class="topIcon">⚙️</div>
      <div class="topText">SETTINGS</div>
    </button>

  </div>

  <!-- EXIT -->

  <button id="exitButton">
    <span>↪</span>
    EXIT
  </button>

  <!-- MIRROR -->

  <div id="mirror">

    <div id="mirrorRoad"></div>
    <div id="mirrorCar"></div>

  </div>

  <!-- COCKPIT -->

  <div id="cockpit">

    <!-- DASHBOARD -->

    <div id="dashboard">

      <div class="gauge">

        <div class="gaugeValue" id="speedValue">
          0
        </div>

        <div class="gaugeUnit">
          KM/H
        </div>

      </div>

      <div id="gearDisplay">
        P
      </div>

      <div class="gauge">

        <div class="gaugeValue" id="rpmValue">
          800
        </div>

        <div class="gaugeUnit">
          RPM
        </div>

      </div>

    </div>

    <div id="dashInfo">
      <span class="ready">● READY</span>
      &nbsp; • &nbsp;
      TEMP <span id="tempValue">88</span>°C
      &nbsp; • &nbsp;
      FUEL <span id="fuelValue">100</span>%
      &nbsp; • &nbsp;
      ☀️ CLEAR
    </div>

    <!-- DRIVING CONTROLS -->

    <div id="drivingArea">

      <!-- STEERING -->

      <div id="steering">

        <div class="steerArrow steerLeft">
          ‹
        </div>

        <div id="steerCenter">
          <div id="steerLogo">
            WAYFLO
          </div>
        </div>

        <div class="steerArrow steerRight">
          ›
        </div>

      </div>

      <!-- GEAR -->

      <div id="gearSelector">

        <button class="gear" data-gear="P">
          P
        </button>

        <button class="gear" data-gear="R">
          R
        </button>

        <button class="gear" data-gear="N">
          N
        </button>

        <button class="gear active" data-gear="D">
          D
        </button>

      </div>

      <!-- PEDALS -->

      <div id="pedals">

        <div class="pedal brake">

          <div class="pedalTitle">
            BRAKE
          </div>

          <div class="pedalTrack">
            <div
              class="pedalFill"
              id="brakeFill">
            </div>
          </div>

          <div class="pedalValue">
            <span id="brakeValue">0</span>%
          </div>

        </div>

        <div class="pedal accel">

          <div class="pedalTitle">
            ACCEL
          </div>

          <div class="pedalTrack">
            <div
              class="pedalFill"
              id="accelFill">
            </div>
          </div>

          <div class="pedalValue">
            <span id="accelValue">0</span>%
          </div>

        </div>

      </div>

    </div>

    <!-- BOTTOM CONTROLS -->

    <div id="controls">

      <button class="control" id="lights">
        <div class="controlIcon">◉</div>
        <div class="controlText">LIGHTS</div>
      </button>

      <button class="control" id="leftSignal">
        <div class="controlIcon">←</div>
        <div class="controlText">LEFT</div>
      </button>

      <button class="control" id="hazard">
        <div class="controlIcon">△</div>
        <div class="controlText">HAZARD</div>
      </button>

      <button class="control" id="rightSignal">
        <div class="controlIcon">→</div>
        <div class="controlText">RIGHT</div>
      </button>

      <button class="control" id="wipers">
        <div class="controlIcon">◇</div>
        <div class="controlText">WIPERS</div>
      </button>

      <button class="control" id="map">
        <div class="controlIcon">□</div>
        <div class="controlText">MAP</div>
      </button>

    </div>

  </div>

  <!-- SETTINGS -->

  <div id="settings">

    <h2>WAYFLO SETTINGS</h2>

    <div class="settingRow">
      <span>Automatic lights</span>
      <span>ON</span>
    </div>

    <div class="settingRow">
      <span>Automatic wipers</span>
      <span>ON</span>
    </div>

    <div class="settingRow">
      <span>Driving assistance</span>
      <span>OFF</span>
    </div>

    <div class="settingRow">
      <span>Weather</span>
      <span>CLEAR</span>
    </div>

    <button
      class="closeSettings"
      id="closeSettings">
      CLOSE
    </button>

  </div>

</div>

<script>

/* =====================================================
   WAYFLO DRIVING SYSTEM
===================================================== */

let speed = 0;
let rpm = 800;
let fuel = 100;
let temp = 88;

let accelerator = 0;
let brake = 0;

let steering = 0;

let gear = "P";

let lastTime = performance.now();

const speedValue =
  document.getElementById("speedValue");

const rpmValue =
  document.getElementById("rpmValue");

const gearDisplay =
  document.getElementById("gearDisplay");

const accelFill =
  document.getElementById("accelFill");

const brakeFill =
  document.getElementById("brakeFill");

const accelValue =
  document.getElementById("accelValue");

const brakeValue =
  document.getElementById("brakeValue");

const steeringWheel =
  document.getElementById("steering");

const road =
  document.getElementById("road");

/* =====================================================
   PEDAL CONTROL
   TRUE SLIDER STYLE
===================================================== */

function setupPedal(element, setter){

  function update(e){

    const rect =
      element.getBoundingClientRect();

    let y =
      e.clientY - rect.top;

    let value =
      1 - (y / rect.height);

    value =
      Math.max(0,Math.min(1,value));

    setter(value);
  }

  element.addEventListener(
    "pointerdown",
    e=>{
      element.setPointerCapture(e.pointerId);
      update(e);
    }
  );

  element.addEventListener(
    "pointermove",
    e=>{
      if(element.hasPointerCapture(e.pointerId)){
        update(e);
      }
    }
  );

  element.addEventListener(
    "pointerup",
    e=>{
      element.releasePointerCapture(e.pointerId);
    }
  );

  element.addEventListener(
    "pointercancel",
    e=>{
      setter(0);
    }
  );
}

setupPedal(
  document.querySelector(".pedal.accel"),
  value=>{
    accelerator=value;
  }
);

setupPedal(
  document.querySelector(".pedal.brake"),
  value=>{
    brake=value;
  }
);

/* =====================================================
   STEERING
===================================================== */

let steeringStartX=0;
let steeringStart=0;
let steeringActive=false;

steeringWheel.addEventListener(
  "pointerdown",
  e=>{

    steeringActive=true;

    steeringStartX=e.clientX;
    steeringStart=steering;

    steeringWheel.setPointerCapture(
      e.pointerId
    );
  }
);

steeringWheel.addEventListener(
  "pointermove",
  e=>{

    if(!steeringActive) return;

    const delta =
      e.clientX-steeringStartX;

    steering =
      steeringStart + delta/100;

    steering =
      Math.max(-1,Math.min(1,steering));

    steeringWheel.style.transform =
      `rotate(${steering*35}deg)`;
  }
);

steeringWheel.addEventListener(
  "pointerup",
  e=>{
    steeringActive=false;
  }
);

document

/* =====================================================
   DRIVING PHYSICS
===================================================== */

function updateDriving(dt){

  let targetAcceleration=0;

  if(gear==="D"){

    targetAcceleration =
      accelerator * 22;

  }else if(gear==="R"){

    targetAcceleration =
      accelerator * -12;

  }

  /* braking */

  targetAcceleration -=
    brake * 38;

  /* rolling resistance */

  if(
    accelerator===0 &&
    brake===0
  ){

    if(speed>0){
      targetAcceleration -= 3;
    }

    if(speed<0){
      targetAcceleration += 3;
    }
  }

  speed +=
    targetAcceleration * dt;

  speed =
    Math.max(-30,Math.min(160,speed));

  /* Park / neutral */

  if(
    gear==="P" ||
    gear==="N"
  ){

    speed *=
      Math.max(0,1-6*dt);
  }

  /* RPM */

  const absSpeed =
    Math.abs(speed);

  rpm =
    800 +
    accelerator*5000 +
    absSpeed*20;

  rpm =
    Math.min(6500,rpm);

  /* Temperature */

  if(accelerator>.6){

    temp +=
      .25*dt;

  }else{

    temp -=
      .08*dt;
  }

  temp =
    Math.max(82,Math.min(105,temp));

  /* Fuel */

  fuel -=
    accelerator*.002*dt;

  fuel =
    Math.max(0,fuel);

  /* Road movement */

  const roadOffset =
    speed*dt*.65;

  road.style.transform =
    `translateY(${roadOffset}px)`;

  /* Steering effect */

  if(Math.abs(speed)>1){

    const turn =
      steering *
      Math.abs(speed) *
      dt *
      .35;

    road.style.transform +=
      ` translateX(${turn}px)`;
  }

  /* UI */

  speedValue.textContent =
    Math.round(Math.abs(speed));

  rpmValue.textContent =
    Math.round(rpm);

  tempValue.textContent =
    Math.round(temp);

  fuelValue.textContent =
    Math.round(fuel);

  accelFill.style.height =
    `${accelerator*100}%`;

  brakeFill.style.height =
    `${brake*100}%`;

  accelValue.textContent =
    Math.round(accelerator*100);

  brakeValue.textContent =
    Math.round(brake*100);

}

/* =====================================================
   GAME LOOP
===================================================== */

function loop(now){

  let dt =
    (now-lastTime)/1000;

  lastTime=now;

  dt =
    Math.min(dt,.05);

  updateDriving(dt);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

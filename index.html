<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>WAYFLO Driving Simulator</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05090d;
  color: #f4f7fa;
  font-family: Arial, Helvetica, sans-serif;
  user-select: none;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 420px;
  overflow: hidden;
  background: #05090d;
}

/* WORLD */

#world {
  position: absolute;
  inset: 0 0 42%;
  overflow: hidden;
  background:
    linear-gradient(
      to bottom,
      #79bddb 0%,
      #a8d9e9 42%,
      #8b9b84 43%,
      #7d8b76 100%
    );
}

#horizon {
  position: absolute;
  left: 0;
  right: 0;
  top: 42%;
  height: 2px;
  background: rgba(255,255,255,.12);
}

#road {
  position: absolute;
  left: 50%;
  bottom: -5%;
  width: min(76vw, 900px);
  height: 125%;
  transform: translateX(-50%);
  background: #30363a;
  clip-path: polygon(
    43% 0,
    57% 0,
    100% 100%,
    0 100%
  );
}

#road::before,
#road::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  background: #fff;
}

#road::before {
  left: 20%;
}

#road::after {
  right: 20%;
}

#lane {
  position: absolute;
  left: 50%;
  top: 0;
  width: 7px;
  height: 100%;
  transform: translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 42px,
      transparent 42px 78px
    );
}

/* TREES */

.tree {
  position: absolute;
  bottom: 12%;
  width: 105px;
  height: 150px;
}

.tree::before {
  content: "";
  position: absolute;
  left: 45px;
  bottom: 0;
  width: 20px;
  height: 70px;
  background: #705437;
}

.tree::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 45px;
  width: 105px;
  height: 85px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 25% 55%, #477650 0 34%, transparent 35%),
    radial-gradient(circle at 55% 35%, #356d48 0 38%, transparent 39%),
    radial-gradient(circle at 78% 60%, #3f744e 0 34%, transparent 35%);
}

.tree.left1 { left: 2%; transform: scale(.85); }
.tree.left2 { left: 10%; transform: scale(.65); bottom: 8%; }
.tree.left3 { left: 15%; transform: scale(.55); bottom: 10%; }

.tree.right1 { right: 2%; transform: scale(.85); }
.tree.right2 { right: 10%; transform: scale(.65); bottom: 8%; }
.tree.right3 { right: 15%; transform: scale(.55); bottom: 10%; }

/* TOP UI */

#brand {
  position: absolute;
  top: 3%;
  left: 2%;
  z-index: 20;
  padding: 22px 28px;
  min-width: 355px;
  border-radius: 28px;
  background: rgba(20,48,66,.92);
  box-shadow: 0 16px 30px rgba(0,0,0,.25);
}

#brand strong {
  display: block;
  font-size: clamp(24px,3vw,38px);
  letter-spacing: 3px;
}

#status {
  margin-top: 10px;
  font-size: 18px;
  color: #d9e5eb;
}

.statusDot {
  color: #5be27d;
}

.topButton {
  position: absolute;
  z-index: 20;
  top: 3%;
  width: 135px;
  height: 115px;
  border-radius: 28px;
  background: rgba(20,48,66,.92);
  box-shadow: 0 16px 30px rgba(0,0,0,.25);
  font-weight: 700;
  letter-spacing: 2px;
}

#mirrorBtn {
  right: 11%;
}

#settingsBtn {
  right: 2%;
}

#exitBtn {
  position: absolute;
  z-index: 20;
  top: 19%;
  left: 2%;
  width: 135px;
  height: 105px;
  border-radius: 28px;
  background: rgba(20,48,66,.92);
  font-weight: 700;
  letter-spacing: 2px;
}

/* MIRROR */

#mirror {
  position: absolute;
  z-index: 15;
  top: 3%;
  left: 50%;
  width: min(42vw,730px);
  height: 125px;
  transform: translateX(-50%);
  overflow: hidden;
  border: 8px solid #071015;
  border-radius: 35px;
  background:
    linear-gradient(
      to bottom,
      #8fcce1 0 48%,
      #899783 49% 100%
    );
  box-shadow: 0 14px 25px rgba(0,0,0,.3);
}

#mirrorRoad {
  position: absolute;
  left: 50%;
  bottom: -10px;
  width: 170px;
  height: 90px;
  transform: translateX(-50%);
  background: #30363a;
  clip-path: polygon(38% 0,62% 0,100% 100%,0 100%);
}

#mirrorLane {
  position: absolute;
  left: 50%;
  top: 0;
  width: 5px;
  height: 100%;
  transform: translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      white 0 20px,
      transparent 20px 32px
    );
}

/* DASHBOARD */

#dashboard {
  position: absolute;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 0;
  height: 42%;
  min-height: 250px;
  background: #03070a;
  border-top: 1px solid #101820;
}

#gauges {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 35px;
}

.gauge {
  width: 125px;
  height: 125px;
  border: 8px solid #161d22;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #05090c;
  box-shadow: inset 0 0 0 7px #0b1014;
}

.gaugeValue {
  font-size: 38px;
  font-weight: 700;
}

.gaugeUnit {
  margin-top: 2px;
  color: #9ba6ad;
  font-size: 13px;
  letter-spacing: 1px;
}

#gearDisplay {
  width: 92px;
  height: 92px;
  border: 6px solid #171f24;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #060a0d;
  font-size: 38px;
  font-weight: 700;
}

#statusLine {
  position: absolute;
  top: 160px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: #cbd2d7;
  font-size: 18px;
}

#engineState {
  color: #57df78;
}

/* STEERING */

#steering {
  position: absolute;
  left: 3%;
  bottom: 7%;
  width: 225px;
  height: 225px;
  border: 15px solid #242d33;
  border-radius: 50%;
  background: #080d11;
  box-shadow:
    inset 0 0 0 12px #11181d,
    0 8px 20px rgba(0,0,0,.3);
  transition: transform .08s ease-out;
  touch-action: none;
}

#steering::before {
  content: "";
  position: absolute;
  inset: 45px;
  border: 4px solid #151c20;
  border-radius: 50%;
}

#steeringText {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  letter-spacing: 2px;
  transform: rotate(-8deg);
}

/* GEARS */

#gears {
  position: absolute;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gearButton {
  width: 95px;
  height: 55px;
  border: 3px solid #172027;
  border-radius: 15px;
  background: #05090c;
  font-size: 23px;
  font-weight: 700;
}

.gearButton.active {
  background: #4f8eb0;
  border-color: #78c6ec;
}

/* PEDALS */

#pedals {
  position: absolute;
  right: 3%;
  bottom: 7%;
  display: flex;
  gap: 20px;
}

.pedal {
  width: 150px;
  height: 180px;
  border: 3px solid;
  border-radius: 35px;
  background: #070b0e;
  padding-top: 20px;
  text-align: center;
  font-weight: 700;
  letter-spacing: 3px;
}

#brake {
  border-color: #b84f4f;
}

#accel {
  border-color: #179cc9;
}

.pedalTrack {
  width: 62px;
  height: 105px;
  margin: 12px auto 5px;
  border-radius: 35px;
  background: #11181d;
  border: 2px solid #202a30;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.pedalFill {
  width: 100%;
  height: 0%;
  background: #667b87;
  transition: height .05s linear;
}

.pedalPercent {
  color: #9ba6ad;
  font-size: 13px;
}

/* SWITCHES */

#switches {
  position: absolute;
  left: 1%;
  right: 1%;
  bottom: 1%;
  display: grid;
  grid-template-columns: repeat(6,1fr);
  gap: 14px;
}

.switch {
  height: 72px;
  border: 3px solid #172127;
  border-radius: 18px;
  background: #050a0d;
  font-size: 17px;
  font-weight: 700;
}

.switch.active {
  background: #1c303b;
  border-color: #5c879c;
}

.switchIcon {
  display: block;
  font-size: 23px;
  margin-bottom: 3px;
}

/* SETTINGS */

#settingsPanel {
  position: absolute;
  z-index: 100;
  right: 2%;
  top: 20%;
  width: min(340px,90vw);
  padding: 25px;
  border-radius: 25px;
  background: #10181e;
  border: 2px solid #29343c;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: none;
}

#settingsPanel.open {
  display: block;
}

#settingsPanel h2 {
  margin-top: 0;
}

.settingRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #263139;
}

.closeSettings {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  background: #24333d;
}

/* LANDSCAPE */

@media (orientation: landscape) {

  #world {
    inset: 0 0 48%;
  }

  #dashboard {
    height: 48%;
  }

  #mirror {
    top: 4%;
    width: 40vw;
    height: 120px;
  }

  #brand {
    top: 4%;
    min-width: 300px;
    padding: 18px 25px;
  }

  #exitBtn {
    top: 20%;
  }

  #gauges {
    top: 8px;
    gap: 20px;
  }

  .gauge {
    width: 78px;
    height: 78px;
    border-width: 6px;
  }

  .gaugeValue {
    font-size: 23px;
  }

  .gaugeUnit {
    font-size: 9px;
  }

  #gearDisplay {
    width: 66px;
    height: 66px;
    font-size: 28px;
  }

  #statusLine {
    top: 92px;
    font-size: 15px;
  }

  #steering {
    width: 155px;
    height: 155px;
    border-width: 10px;
  }

  #steering::before {
    inset: 30px;
  }

  #gears {
    bottom: 10%;
  }

  .gearButton {
    width: 95px;
    height: 55px;
  }

  #pedals {
    bottom: 10%;
  }

  .pedal {
    width: 140px;
    height: 165px;
  }

  #switches {
    bottom: 1%;
  }

  .switch {
    height: 66px;
  }
}

/* PORTRAIT */

@media (orientation: portrait) {

  #world {
    inset: 0 0 46%;
  }

  #dashboard {
    height: 54%;
  }

  #brand {
    min-width: 0;
    width: 46%;
    padding: 15px 18px;
  }

  #brand strong {
    font-size: 25px;
  }

  #status {
    font-size: 13px;
  }

  .topButton {
    width: 105px;
    height: 105px;
  }

  #mirror {
    width: 52%;
    height: 105px;
  }

  #exitBtn {
    width: 105px;
    height: 100px;
  }

  #gauges {
    top: 8px;
    gap: 20px;
  }

  .gauge {
    width: 105px;
    height: 105px;
  }

  .gaugeValue {
    font-size: 31px;
  }

  #gearDisplay {
    width: 78px;
    height: 78px;
    font-size: 32px;
  }

  #statusLine {
    top: 130px;
  }

  #steering {
    width: 190px;
    height: 190px;
    bottom: 9%;
  }

  #gears {
    bottom: 10%;
  }

  #pedals {
    bottom: 9%;
    gap: 12px;
  }

  .pedal {
    width: 125px;
    height: 165px;
  }

  #switches {
    gap: 7px;
  }

  .switch {
    height: 65px;
    font-size: 13px;
  }

  .switchIcon {
    font-size: 19px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- WORLD -->
  <div id="world">
    <div id="horizon"></div>

    <div id="road">
      <div id="lane"></div>
    </div>

    <div class="tree left1"></div>
    <div class="tree left2"></div>
    <div class="tree left3"></div>

    <div class="tree right1"></div>
    <div class="tree right2"></div>
    <div class="tree right3"></div>
  </div>

  <!-- BRAND -->
  <div id="brand">
    <strong>WAYFLO</strong>
    <div id="status">
      <span class="statusDot">●</span>
      SYSTEM READY
    </div>
  </div>

  <button class="topButton" id="mirrorBtn">
    ◉<br>
    <small>MIRROR</small>
  </button>

  <button class="topButton" id="settingsBtn">
    ⚙<br>
    <small>SETTINGS</small>
  </button>

  <button id="exitBtn">
    EXIT
  </button>

  <!-- MIRROR -->
  <div id="mirror">
    <div id="mirrorRoad"></div>
    <div id="mirrorLane"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard">

    <div id="gauges">

      <div class="gauge">
        <div class="gaugeValue" id="speedValue">0</div>
        <div class="gaugeUnit">KM/H</div>
      </div>

      <div class="gauge">
        <div class="gaugeValue" id="rpmValue">0</div>
        <div class="gaugeUnit">RPM</div>
      </div>

      <div id="gearDisplay">P</div>

    </div>

    <div id="statusLine">
      <span id="engineState">ENGINE OFF</span>
      &nbsp; • &nbsp;
      STEER <span id="steerValue">0</span>°
      &nbsp; • &nbsp;
      <span id="ready">READY</span>
    </div>

    <!-- STEERING -->
    <div id="steering">
      <div id="steeringText">WAYFLO</div>
    </div>

    <!-- GEARS -->
    <div id="gears">
      <button class="gearButton" data-gear="R">R</button>
      <button class="gearButton" data-gear="N">N</button>
      <button class="gearButton active" data-gear="D">D</button>
    </div>

    <!-- PEDALS -->
    <div id="pedals">

      <div class="pedal" id="brake">
        BRAKE
        <div class="pedalTrack">
          <div class="pedalFill" id="brakeFill"></div>
        </div>
        <div class="pedalPercent" id="brakePercent">0%</div>
      </div>

      <div class="pedal" id="accel">
        ACCEL
        <div class="pedalTrack">
          <div class="pedalFill" id="accelFill"></div>
        </div>
        <div class="pedalPercent" id="accelPercent">0%</div>
      </div>

    </div>

    <!-- SWITCHES -->
    <div id="switches">

      <button class="switch" id="lightsBtn">
        <span class="switchIcon">☼</span>
        LIGHTS
      </button>

      <button class="switch" id="hazardBtn">
        <span class="switchIcon">⚠️</span>
        HAZARD
      </button>

      <button class="switch" id="parkBtn">
        <span class="switchIcon">P</span>
        PARK
      </button>

      <button class="switch" id="absBtn">
        <span class="switchIcon">A</span>
        ABS
      </button>

      <button class="switch" id="tractionBtn">
        <span class="switchIcon">T</span>
        TRACTION
      </button>

      <button class="switch" id="engineBtn">
        <span class="switchIcon">⚡</span>
        ENGINE
      </button>

    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsPanel">

    <h2>WAYFLO SETTINGS</h2>

    <div class="settingRow">
      <span>Engine sound</span>
      <span>ON</span>
    </div>

    <div class="settingRow">
      <span>Driving assist</span>
      <span>ON</span>
    </div>

    <div class="settingRow">
      <span>Steering return</span>
      <span>ON</span>
    </div>

    <button class="closeSettings" id="closeSettings">
      CLOSE
    </button>

  </div>

</div>

<script>
/* =========================================================
   WAYFLO DRIVING SIMULATOR
   Clean rebuild
========================================================= */

const speedValue = document.getElementById("speedValue");
const rpmValue = document.getElementById("rpmValue");
const gearDisplay = document.getElementById("gearDisplay");
const engineState = document.getElementById("engineState");
const steerValue = document.getElementById("steerValue");

const steering = document.getElementById("steering");

const brakeFill = document.getElementById("brakeFill");
const accelFill = document.getElementById("accelFill");

const brakePercent = document.getElementById("brakePercent");
const accelPercent = document.getElementById("accelPercent");

const engineBtn = document.getElementById("engineBtn");

let engineOn = false;

let gear = "D";

let speed = 0;
let rpm = 0;

let steeringAngle = 0;
let steeringTarget = 0;
let steeringPointerDown = false;
let steeringStartX = 0;
let steeringStartAngle = 0;

let accelerator = 0;
let brake = 0;

let lastTime = performance.now();

/* =========================================================
   ENGINE
========================================================= */

function updateEngine() {

  if (engineOn) {

    engineState.textContent = "ENGINE ON";

    engineBtn.classList.add("active");

    if (rpm < 800) {
      rpm += 40;
    }

  } else {

    engineState.textContent = "ENGINE OFF";

    engineBtn.classList.remove("active");

    rpm = 0;
    speed = 0;
    accelerator = 0;
  }

  rpmValue.textContent = Math.round(rpm);

  updatePedals();
}

engineBtn.addEventListener("click", function() {
  engineOn = !engineOn;
  updateEngine();
});

/* =========================================================
   GEARS
========================================================= */

document.querySelectorAll(".gearButton").forEach(button => {

  button.addEventListener("click", () => {

    const selected = button.dataset.gear;

    if (!engineOn && selected !== "N") {
      return;
    }

    gear = selected;

    document.querySelectorAll(".gearButton")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    gearDisplay.textContent = gear;

    if (gear === "N" || gear === "R") {
      accelerator = 0;
    }
  });

});

/* =========================================================
   STEERING
   IMPORTANT:
   RELEASE ALWAYS RETURNS TO CENTER
========================================================= */

function setSteering(angle) {

  steeringTarget = Math.max(-45, Math.min(45, angle));

  steerValue.textContent = Math.round(steeringTarget);

  steering.style.transform =
    "rotate(" + steeringTarget + "deg)";
}

function beginSteering(e) {

  steeringPointerDown = true;

  steeringStartX = e.clientX;

  steeringStartAngle = steeringTarget;

  steering.setPointerCapture(e.pointerId);
}

function moveSteering(e) {

  if (!steeringPointerDown) return;

  const dx = e.clientX - steeringStartX;

  const newAngle =
    steeringStartAngle + dx * 0.45;

  setSteering(newAngle);
}

function endSteering() {

  steeringPointerDown = false;

  /* FULL RETURN TO CENTER */
  steeringTarget = 0;

  steerValue.textContent = "0";

  steering.style.transform = "rotate(0deg)";
}

steering.addEventListener(
  "pointerdown",
  beginSteering
);

steering.addEventListener(
  "pointermove",
  moveSteering
);

steering.addEventListener(
  "pointerup",
  endSteering
);

steering.addEventListener(
  "pointercancel",
  endSteering
);

steering.addEventListener(
  "lostpointercapture",
  endSteering
);

/* =========================================================
   PEDAL HELPERS
========================================================= */

function setAccelerator(value) {

  if (!engineOn) {
    accelerator = 0;
    return;
  }

  accelerator =
    Math.max(0, Math.min(100, value));

  updatePedals();
}

function setBrake(value) {

  brake =
    Math.max(0, Math.min(100, value));

  updatePedals();
}

function updatePedals() {

  accelFill.style.height =
    accelerator + "%";

  brakeFill.style.height =
    brake + "%";

  accelPercent.textContent =
    Math.round(accelerator) + "%";

  brakePercent.textContent =
    Math.round(brake) + "%";
}

/* =========================================================
   ACCELERATOR
========================================================= */

const accel = document.getElementById("accel");

function accelDown(e) {

  e.preventDefault();

  accel.setPointerCapture?.(e.pointerId);

  setAccelerator(100);
}

function accelUp() {

  setAccelerator(0);
}

accel.addEventListener(
  "pointerdown",
  accelDown
);

accel.addEventListener(
  "pointerup",
  accelUp
);

accel.addEventListener(
  "pointercancel",
  accelUp
);

accel.addEventListener(
  "lostpointercapture",
  accelUp
);

/* =========================================================
   BRAKE
========================================================= */

const brakeButton =
  document.getElementById("brake");

function brakeDown(e) {

  e.preventDefault();

  brakeButton.setPointerCapture?.(e.pointerId);

  setBrake(100);
}

function brakeUp() {

  setBrake(0);
}

brakeButton.addEventListener(
  "pointerdown",
  brakeDown
);

brakeButton.addEventListener(
  "pointerup",
  brakeUp
);

brakeButton.addEventListener(
  "pointercancel",
  brakeUp
);

brakeButton.addEventListener(
  "lostpointercapture",
  brakeUp
);

/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics(dt) {

  if (!engineOn) {

    speed = Math.max(
      0,
      speed - 25 * dt
    );

    rpm = 0;

    return;
  }

  /* PARK / NEUTRAL */
  if (gear === "N") {

    speed = Math.max(
      0,
      speed - 4 * dt
    );

    rpm = 800;

    return;
  }

  /* BRAKING */
  if (brake > 0) {

    speed -=
      (brake / 100) * 85 * dt;

    speed =
      Math.max(0, speed);

  } else {

    /* ACCELERATION */

    if (accelerator > 0) {

      let direction =
        gear === "R" ? -1 : 1;

      speed +=
        direction *
        (accelerator / 100) *
        48 *
        dt;

      if (gear === "D") {

        speed =
          Math.min(420, speed);

      } else if (gear === "R") {

        speed =
          Math.max(-45, speed);

      }

    } else {

      /* NATURAL ROLL DOWN */

      if (speed > 0) {

        speed =
          Math.max(
            0,
            speed - 2.5 * dt
          );

      } else if (speed < 0) {

        speed =
          Math.min(
            0,
            speed + 2.5 * dt
          );
      }
    }
  }

  /*
    RPM:
    Idle = 800.
    RPM rises naturally with throttle and speed.
  */

  const absSpeed =
    Math.abs(speed);

  rpm =
    800 +
    absSpeed * 8 +
    accelerator * 12;

  rpm =
    Math.min(7000, rpm);
}

/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

  speedValue.textContent =
    Math.round(Math.abs(speed));

  rpmValue.textContent =
    Math.round(rpm);

  gearDisplay.textContent =
    gear;

  steerValue.textContent =
    Math.round(steeringTarget);

  updatePedals();
}

/* =========================================================
   MAIN LOOP
========================================================= */

function loop(now) {

  const dt =
    Math.min(
      0.05,
      (now - lastTime) / 1000
    );

  lastTime = now;

  updatePhysics(dt);

  updateDisplay();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   LIGHTS
========================================================= */

document
  .getElementById("lightsBtn")
  .addEventListener("click", function() {

    this.classList.toggle("active");

  });

/* =========================================================
   HAZARDS
========================================================= */

document
  .getElementById("hazardBtn")
  .addEventListener("click", function() {

    this.classList.toggle("active");

  });

/* =========================================================
   PARK
========================================================= */

document
  .getElementById("parkBtn")
  .addEventListener("click", function() {

    this.classList.toggle("active");

    if (this.classList.contains("active")) {

      speed = 0;

      accelerator = 0;

      gear = "N";

      document
        .querySelectorAll(".gearButton")
        .forEach(b =>
          b.classList.remove("active")
        );

      document
        .querySelector('[data-gear="N"]')
        .classList.add("active");

      gearDisplay.textContent = "N";
    }

  });

/* =========================================================
   ABS
========================================================= */

document
  .getElementById("absBtn")
  .addEventListener("click", function() {

    this.classList.toggle("active");

  });

/* =========================================================
   TRACTION
========================================================= */

document
  .getElementById("tractionBtn")
  .addEventListener("click", function() {

    this.classList.toggle("active");

  });

/* =========================================================
   MIRROR
========================================================= */

document
  .getElementById("mirrorBtn")
  .addEventListener("click", function() {

    document
      .getElementById("mirror")
      .classList.toggle("overlay");

  });

/* =========================================================
   SETTINGS
========================================================= */

const settingsPanel =
  document.getElementById("settingsPanel");

document
  .getElementById("settingsBtn")
  .addEventListener("click", function() {

    settingsPanel.classList.toggle("open");

  });

document
  .getElementById("closeSettings")
  .addEventListener("click", function() {

    settingsPanel.classList.remove("open");

  });

/* =========================================================
   EXIT
========================================================= */

document
  .getElementById("exitBtn")
  .addEventListener("click", function() {

    engineOn = false;

    accelerator = 0;

    brake = 0;

    speed = 0;

    rpm = 0;

    gear = "N";

    steeringTarget = 0;

    steering.style.transform =
      "rotate(0deg)";

    steerValue.textContent = "0";

    updateEngine();

    document
      .querySelectorAll(".gearButton")
      .forEach(b =>
        b.classList.remove("active")
      );

    document
      .querySelector('[data-gear="N"]')
      .classList.add("active");

    gearDisplay.textContent = "N";

  });

/* =========================================================
   INITIAL STATE
========================================================= */

gear = "D";

document
  .querySelector('[data-gear="D"]')
  .classList.add("active");

gearDisplay.textContent = "D";

engineOn = false;

speed = 0;

rpm = 0;

steeringTarget = 0;

steering.style.transform =
  "rotate(0deg)";

updateEngine();

updateDisplay();

</script>

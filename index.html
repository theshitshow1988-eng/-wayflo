<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#101318;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:white;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

button{
  font:inherit;
}

/* =========================================================
   WORLD / WINDSCREEN
   ========================================================= */

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(
      #7bb8df 0%,
      #b9d8e7 48%,
      #68776a 49%,
      #303833 100%
    );
}

#sky{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      #6faed5 0%,
      #b9d8e6 45%,
      #d5d9cf 52%,
      #687266 53%,
      #30352f 100%
    );
}

#sun{
  position:absolute;
  width:70px;
  height:70px;
  border-radius:50%;
  background:#fff4b0;
  top:12%;
  right:18%;
  box-shadow:0 0 40px rgba(255,240,150,.65);
}

/* road */

#road{
  position:absolute;
  left:50%;
  top:46%;
  width:145%;
  height:70%;
  transform:
    translateX(-50%)
    perspective(500px)
    rotateX(55deg);

  background:
    linear-gradient(
      90deg,
      #353535 0%,
      #494949 49%,
      #494949 51%,
      #353535 100%
    );

  clip-path:
    polygon(
      37% 0,
      63% 0,
      100% 100%,
      0 100%
    );
}

/* road edge lines */

.edge{
  position:absolute;
  top:0;
  width:8px;
  height:100%;
  background:#eee;
}

.edge.left{
  left:37%;
}

.edge.right{
  right:37%;
}

/* centre road markings */

#roadLines{
  position:absolute;
  left:50%;
  top:47%;
  width:10px;
  height:53%;
  transform:translateX(-50%);
  overflow:hidden;
}

.roadLine{
  position:absolute;
  left:0;
  width:10px;
  height:45px;
  background:#f5f5f5;
  border-radius:4px;
}

/* roadside scenery */

.tree{
  position:absolute;
  width:55px;
  height:110px;
  transform-origin:bottom;
}

.tree:before{
  content:"";
  position:absolute;
  bottom:0;
  left:24px;
  width:9px;
  height:58px;
  background:#5a3928;
}

.tree:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#315a3b;
  box-shadow:
    20px 10px 0 #3c7046,
    -12px 20px 0 #416f47;
}

.tree.one{
  left:5%;
  top:49%;
  transform:scale(.8);
}

.tree.two{
  right:5%;
  top:51%;
  transform:scale(.7);
}

.tree.three{
  left:17%;
  top:55%;
  transform:scale(.45);
}

.tree.four{
  right:16%;
  top:54%;
  transform:scale(.5);
}

/* windshield */

#windshield{
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.25),
      transparent 13%,
      transparent 87%,
      rgba(0,0,0,.25)
    );
}

/* =========================================================
   MIRROR
   ========================================================= */

#mirror{
  position:absolute;
  z-index:30;

  top:
    max(14px,env(safe-area-inset-top));

  left:50%;
  transform:translateX(-50%);

  width:190px;
  height:62px;

  border-radius:12px;

  background:
    linear-gradient(
      180deg,
      #28333a,
      #101519
    );

  border:5px solid #080909;

  box-shadow:
    0 6px 20px rgba(0,0,0,.6);

  overflow:hidden;
}

#mirrorView{
  width:100%;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#a9d5df;
  font-size:12px;
  opacity:.8;

  background:
    linear-gradient(
      180deg,
      #263d45,
      #11191c
    );
}

/* =========================================================
   DASHBOARD
   ========================================================= */

#dashboard{
  position:absolute;
  z-index:50;

  left:0;
  right:0;
  bottom:0;

  height:23vh;
  min-height:170px;

  background:
    linear-gradient(
      180deg,
      #202326,
      #080909
    );

  border-top:
    2px solid rgba(255,255,255,.12);

  box-shadow:
    0 -15px 40px rgba(0,0,0,.65);

  pointer-events:none;
}

/* dashboard instruments */

#instruments{
  position:absolute;
  left:50%;
  top:12px;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  gap:18px;
}

.gauge{
  width:105px;
  height:105px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #1c2022 0 55%,
      #090a0b 56% 100%
    );

  border:
    4px solid #555;

  box-shadow:
    inset 0 0 15px #000;

  position:relative;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.gaugeValue{
  font-size:28px;
  font-weight:900;
}

.gaugeLabel{
  font-size:9px;
  opacity:.65;
  letter-spacing:1px;
}

#rpmGauge .gaugeValue{
  font-size:22px;
}

#gearDisplay{
  width:52px;
  height:52px;

  border-radius:10px;

  display:flex;
  justify-content:center;
  align-items:center;

  background:#090a0a;

  border:2px solid #555;

  font-size:24px;
  font-weight:900;
}

#warning{
  position:absolute;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);

  font-size:10px;
  letter-spacing:1px;
  opacity:.6;

  white-space:nowrap;
}

.warningOn{
  color:#ff514d !important;
  opacity:1 !important;
}

/* =========================================================
   VEHICLE INFO
   ========================================================= */

#vehicleInfo{
  position:absolute;
  z-index:60;

  top:
    max(14px,env(safe-area-inset-top));

  left:12px;

  padding:8px 11px;

  border-radius:12px;

  background:rgba(10,13,16,.75);

  backdrop-filter:blur(10px);

  font-size:12px;
}

#vehicleName{
  font-weight:900;
  letter-spacing:1px;
}

#condition{
  margin-top:3px;
  font-size:10px;
  opacity:.7;
}

/* =========================================================
   TOP RIGHT BUTTONS
   ========================================================= */

.topButtons{
  position:absolute;
  z-index:70;

  top:
    max(14px,env(safe-area-inset-top));

  right:12px;

  display:flex;
  gap:8px;
}

.iconButton{
  width:46px;
  height:46px;

  border:1px solid rgba(255,255,255,.2);

  border-radius:13px;

  background:rgba(10,13,17,.8);

  color:white;

  font-size:20px;

  box-shadow:
    0 5px 16px rgba(0,0,0,.4);

  touch-action:none;
}

.iconButton:active{
  transform:scale(.92);
}

/* =========================================================
   STEERING WHEEL
   ========================================================= */

#steeringArea{
  position:absolute;
  z-index:100;

  left:15px;
  bottom:
    max(30px,calc(env(safe-area-inset-bottom) + 10px));

  width:150px;
  height:150px;

  pointer-events:auto;

  touch-action:none;
}

#steeringWheel{
  width:145px;
  height:145px;

  border-radius:50%;

  border:
    12px solid #17191a;

  box-shadow:
    0 5px 20px rgba(0,0,0,.65),
    inset 0 0 0 2px #555;

  position:relative;

  background:
    radial-gradient(
      circle,
      #242729 0 18%,
      transparent 19%
    );
}

#steeringWheel:before,
#steeringWheel:after{
  content:"";
  position:absolute;

  background:#17191a;

  width:12px;
  height:55px;

  left:50%;
  top:50%;

  transform-origin:center bottom;
}

#steeringWheel:before{
  transform:
    translate(-50%,-100%)
    rotate(0deg);
}

#steeringWheel:after{
  transform:
    translate(-50%,-100%)
    rotate(120deg);
}

#steeringHub{
  position:absolute;

  width:48px;
  height:48px;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:#252829;

  border:3px solid #555;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:12px;
  font-weight:900;
}

/* =========================================================
   PEDALS
   ========================================================= */

#pedals{
  position:absolute;
  z-index:100;

  right:18px;

  bottom:
    max(28px,calc(env(safe-area-inset-bottom) + 8px));

  display:flex;
  gap:12px;

  align-items:flex-end;

  pointer-events:auto;
}

.pedal{
  width:72px;
  height:155px;

  border-radius:18px;

  background:
    linear-gradient(
      90deg,
      #101213,
      #292d2f,
      #101213
    );

  border:2px solid #555;

  box-shadow:
    0 7px 20px rgba(0,0,0,.7);

  position:relative;

  overflow:hidden;

  touch-action:none;
}

.pedal:before{
  content:"";

  position:absolute;

  left:10px;
  right:10px;

  bottom:10px;

  height:0%;

  border-radius:12px;

  background:
    linear-gradient(
      to top,
      rgba(255,255,255,.32),
      rgba(255,255,255,.05)
    );

  transition:height .03s;
}

.pedalLabel{
  position:absolute;

  top:10px;
  left:0;
  right:0;

  text-align:center;

  font-size:9px;
  font-weight:900;

  letter-spacing:1px;

  opacity:.75;

  pointer-events:none;
}

.pedalValue{
  position:absolute;

  bottom:14px;
  left:0;
  right:0;

  text-align:center;

  font-size:12px;
  font-weight:900;

  pointer-events:none;
}

#brakePedal{
  border-color:#693c3c;
}

#acceleratorPedal{
  border-color:#3c5e69;
}

/* =========================================================
   SWITCH PANEL
   ========================================================= */

#switchPanel{
  position:absolute;
  z-index:110;

  left:50%;
  transform:translateX(-50%);

  bottom:
    max(25px,calc(env(safe-area-inset-bottom) + 5px));

  display:flex;
  gap:7px;

  pointer-events:auto;
}

.switch{
  width:42px;
  height:42px;

  border-radius:11px;

  border:1px solid #4a4d4f;

  background:#17191a;

  color:white;

  font-size:16px;

  box-shadow:
    0 4px 12px rgba(0,0,0,.45);
}

.switch.active{
  background:#344b54;
  border-color:#9bd5e2;
}

/* =========================================================
   SETTINGS PANEL
   ========================================================= */

#settings{
  position:fixed;
  z-index:500;

  inset:0;

  display:none;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:blur(8px);

  align-items:center;
  justify-content:center;
}

#settings.open{
  display:flex;
}

.settingsBox{
  width:min(90vw,420px);
  max-height:80vh;

  overflow:auto;

  background:#171a1d;

  border:
    1px solid rgba(255,255,255,.2);

  border-radius:20px;

  padding:20px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.7);
}

.settingsTitle{
  font-size:22px;
  font-weight:900;
  margin-bottom:15px;
}

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:13px 0;

  border-bottom:
    1px solid rgba(255,255,255,.08);

  font-size:14px;
}

.settingRow button{
  border:1px solid #555;
  border-radius:10px;
  background:#25292c;
  color:white;
  padding:8px 12px;
}

.closeSettings{
  margin-top:18px;
  width:100%;
  height:44px;
  border:0;
  border-radius:12px;
  background:#3d5962;
  color:white;
  font-weight:900;
}

/* =========================================================
   ENTER / EXIT
   ========================================================= */

#exitButton{
  position:absolute;
  z-index:120;

  left:18px;

  top:
    calc(
      max(14px,env(safe-area-inset-top))
      + 60px
    );

  width:58px;
  height:44px;

  border-radius:12px;

  border:1px solid rgba(255,255,255,.2);

  background:rgba(10,13,16,.8);

  color:white;

  font-size:12px;
  font-weight:900;

  pointer-events:auto;
}

/* =========================================================
   STATUS MESSAGE
   ========================================================= */

#status{
  position:absolute;
  z-index:300;

  top:38%;
  left:50%;

  transform:translate(-50%,-50%);

  padding:12px 18px;

  background:rgba(10,13,16,.8);

  border-radius:14px;

  font-weight:700;

  opacity:0;

  pointer-events:none;

  transition:opacity .3s;
}

#status.show{
  opacity:1;
}

/* =========================================================
   MAP MODE
   ========================================================= */

#mapMode{
  position:fixed;
  inset:0;
  z-index:400;

  display:none;

  background:#111;
}

#mapMode.show{
  display:block;
}

#mapCanvas{
  width:100%;
  height:100%;

  background:
    repeating-linear-gradient(
      0deg,
      #d6d2c4 0 28px,
      #c9c4b5 29px 31px
    );
}

#mapBack{
  position:absolute;
  z-index:10;

  top:15px;
  left:15px;

  width:48px;
  height:48px;

  border:0;
  border-radius:13px;

  background:#15191c;
  color:white;

  font-size:22px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-height:700px){

  #dashboard{
    height:27vh;
  }

  #steeringArea{
    transform:scale(.86);
    transform-origin:bottom left;
  }

  #pedals{
    transform:scale(.82);
    transform-origin:bottom right;
  }

  #instruments{
    transform:scale(.82);
  }

}

@media(min-width:700px){

  #steeringArea{
    left:30px;
  }

  #pedals{
    right:40px;
  }

}
</style>
</head>

<body>

<!-- ======================================================
     DRIVER WORLD
     ====================================================== -->

<div id="world">

  <div id="sky"></div>

  <div id="sun"></div>

  <div class="tree one"></div>
  <div class="tree two"></div>
  <div class="tree three"></div>
  <div class="tree four"></div>

  <div id="road">

    <div class="edge left"></div>
    <div class="edge right"></div>

  </div>

  <div id="roadLines"></div>

  <div id="windshield"></div>

</div>

<!-- ======================================================
     REAR VIEW MIRROR
     ====================================================== -->

<div id="mirror">

  <div id="mirrorView">
    REAR VIEW
  </div>

</div>

<!-- ======================================================
     VEHICLE INFO
     ====================================================== -->

<div id="vehicleInfo">

  <div id="vehicleName">
    WAYFLO • VEHICLE 01
  </div>

  <div id="condition">
    CONDITION 100%
  </div>

</div>

<!-- ======================================================
     TOP BUTTONS
     ====================================================== -->

<div class="topButtons">

  <button
    class="iconButton"
    id="mirrorButton"
    aria-label="Mirror">
    🪞
  </button>

  <button
    class="iconButton"
    id="settingsButton"
    aria-label="Settings">
    ⚙️
  </button>

</div>

<!-- ======================================================
     EXIT
     ====================================================== -->

<button id="exitButton">
  🚪 EXIT
</button>

<!-- ======================================================
     DASHBOARD
     ====================================================== -->

<div id="dashboard">

  <div id="instruments">

    <div class="gauge">

      <div
        id="speedValue"
        class="gaugeValue">
        0
      </div>

      <div class="gaugeLabel">
        KM/H
      </div>

    </div>

    <div id="gearDisplay">
      N
    </div>

    <div
      class="gauge"
      id="rpmGauge">

      <div
        id="rpmValue"
        class="gaugeValue">
        800
      </div>

      <div class="gaugeLabel">
        RPM
      </div>

    </div>

  </div>

  <div id="warning">
    <span id="lightIndicator">●</span>
    <span id="indicatorStatus">READY</span>
    &nbsp; • &nbsp;
    TEMP <span id="tempValue">90</span>°C
    &nbsp; • &nbsp;
    FUEL <span id="fuelValue">100</span>%
  </div>

</div>

<!-- ======================================================
     STEERING
     ====================================================== -->

<div id="steeringArea">

  <div id="steeringWheel">

    <div id="steeringHub">
      WAYFLO
    </div>

  </div>

</div>

<!-- ======================================================
     PEDALS
     ====================================================== -->

<div id="pedals">

  <div
    id="brakePedal"
    class="pedal">

    <div class="pedalLabel">
      BRAKE
    </div>

    <div
      id="brakeValue"
      class="pedalValue">
      0%
    </div>

  </div>

  <div
    id="acceleratorPedal"
    class="pedal">

    <div class="pedalLabel">
      ACCEL
    </div>

    <div
      id="accelValue"
      class="pedalValue">
      0%
    </div>

  </div>

</div>

<!-- ======================================================
     SWITCHES
     ====================================================== -->

<div id="switchPanel">

  <button
    class="switch"
    id="lightsButton"
    title="Headlights">
    💡
  </button>

  <button
    class="switch"
    id="leftIndicator"
    title="Left indicator">
    ◀
  </button>

  <button
    class="switch"
    id="hazardButton"
    title="Hazards">
    ⚠️
  </button>

  <button
    class="switch"
    id="rightIndicator"
    title="Right indicator">
    ▶
  </button>

  <button
    class="switch"
    id="wiperButton"
    title="Wipers">
    🌧️
  </button>

</div>

<!-- ======================================================
     STATUS
     ====================================================== -->

<div id="status"></div>

<!-- ======================================================
     SETTINGS
     ====================================================== -->

<div id="settings">

  <div class="settingsBox">

    <div class="settingsTitle">
      WAYFLO VEHICLE SETTINGS
    </div>

    <div class="settingRow">

      <span>
        Automatic headlights
      </span>

      <button id="autoLights">
        ON
      </button>

    </div>

    <div class="settingRow">

      <span>
        Automatic wipers
      </span>

      <button id="autoWipers">
        ON
      </button>

    </div>

    <div class="settingRow">

      <span>
        Traction control
      </span>

      <button id="traction">
        ON
      </button>

    </div>

    <div class="settingRow">

      <span>
        ABS
      </span>

      <button id="abs">
        ON
      </button>

    </div>

    <div class="settingRow">

      <span>
        Transmission
      </span>

      <button id="transmission">
        AUTO
      </button>

    </div>

    <div class="settingRow">

      <span>
        Driving side
      </span>

      <button id="driveSide">
        LEFT
      </button>

    </div>

    <button
      class="closeSettings"
      id="closeSettings">
      DONE
    </button>

  </div>

</div>

<!-- ======================================================
     MAP MODE
     ====================================================== -->

<div id="mapMode">

  <canvas id="mapCanvas"></canvas>

  <button id="mapBack">
    ←
  </button>

</div>

<script>

/* =========================================================
   WAYFLO VEHICLE ENGINE
   ========================================================= */

const state = {

  speed:0,

  rpm:800,

  temp:90,

  fuel:100,

  damage:0,

  gear:"N",

  throttle:0,

  brake:0,

  steering:0,

  steeringAngle:0,

  heading:0,

  distance:0,

  headlights:false,

  leftIndicator:false,

  rightIndicator:false,

  hazards:false,

  wipers:false,

  autoLights:true,

  autoWipers:true,

  traction:true,

  abs:true,

  automatic:true,

  drivingSide:"LEFT",

  time:12,

  weather:"CLEAR",

  running:true

};

/* =========================================================
   ELEMENTS
   ========================================================= */

const speedValue =
  document.getElementById("speedValue");

const rpmValue =
  document.getElementById("rpmValue");

const tempValue =
  document.getElementById("tempValue");

const fuelValue =
  document.getElementById("fuelValue");

const condition =
  document.getElementById("condition");

const gearDisplay =
  document.getElementById("gearDisplay");

const steeringWheel =
  document.getElementById("steeringWheel");

const accelPedal =
  document.getElementById("acceleratorPedal");

const brakePedal =
  document.getElementById("brakePedal");

const accelValue =
  document.getElementById("accelValue");

const brakeValue =
  document.getElementById("brakeValue");

const status =
  document.getElementById("status");

const indicatorStatus =
  document.getElementById("indicatorStatus");

const lightIndicator =
  document.getElementById("lightIndicator");

/* =========================================================
   STATUS MESSAGE
   ========================================================= */

let statusTimer = null;

function showStatus(text){

  status.textContent = text;

  status.classList.add("show");

  clearTimeout(statusTimer);

  statusTimer =
    setTimeout(
      () => status.classList.remove("show"),
      1800
    );

}

/* =========================================================
   PROGRESSIVE PEDALS
   ========================================================= */

function makePedal(element,callback){

  let pointer = null;

  function update(event){

    const rect =
      element.getBoundingClientRect();

    let value =
      (rect.bottom - event.clientY)
      / rect.height;

    value =
      Math.max(
        0,
        Math.min(
          1,
          value
        )
      );

    callback(value);

  }

  element.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      pointer =
        event.pointerId;

      element.setPointerCapture(
        pointer
      );

      update(event);

    }
  );

  element.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointerId === pointer
      ){

        update(event);

      }

    }
  );

  function release(){

    pointer = null;

    callback(0);

  }

  element.addEventListener(
    "pointerup",
    release
  );

  element.addEventListener(
    "pointercancel",
    release
  );

}

makePedal(
  accelPedal,
  value => {

    state.throttle =
      value;

  }
);

makePedal(
  brakePedal,
  value => {

    state.brake =
      value;

  }
);

/* =========================================================
   STEERING WHEEL
   ========================================================= */

let wheelPointer = null;

let wheelStartAngle = 0;

let wheelStartSteering = 0;

function wheelAngle(event){

  const rect =
    steeringWheel.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width / 2;

  const cy =
    rect.top +
    rect.height / 2;

  return Math.atan2(
    event.clientY - cy,
    event.clientX - cx
  ) * 180 / Math.PI;

}

steeringWheel.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    wheelPointer =
      event.pointerId;

    steeringWheel.setPointerCapture(
      wheelPointer
    );

    wheelStartAngle =
      wheelAngle(event);

    wheelStartSteering =
      state.steering;

  }
);

steeringWheel.addEventListener(
  "pointermove",
  event => {

    if(
      event.pointerId !==
      wheelPointer
    ){

      return;

    }

    let current =
      wheelAngle(event);

    let delta =
      current -
      wheelStartAngle;

    if(delta > 180){
      delta -= 360;
    }

    if(delta < -180){
      delta += 360;
    }

    state.steering =
      Math.max(
        -1,
        Math.min(
          1,
          wheelStartSteering +
          delta / 135
        )
      );

  }
);

function releaseWheel(){

  wheelPointer =
    null;

}

steeringWheel.addEventListener(
  "pointerup",
  releaseWheel
);

steeringWheel.addEventListener(
  "pointercancel",
  releaseWheel
);

/* =========================================================
   VEHICLE PHYSICS
   ========================================================= */

let previousTime =
  performance.now();

function updateVehicle(delta){

  /* throttle */

  const engineForce =
    state.throttle *
    42;

  /* resistance */

  const rollingResistance =
    8 +
    state.speed *
    .07;

  /* braking */

  const brakeForce =
    state.brake *
    110;

  let acceleration =
    engineForce -
    rollingResistance -
    brakeForce;

  /* traction control */

  if(
    state.traction &&
    state.throttle > .85
  ){

    acceleration *= .92;

  }

  state.speed +=
    acceleration *
    delta;

  state.speed =
    Math.max(
      0,
      Math.min(
        220,
        state.speed
      )
    );

  /* RPM */

  if(state.automatic){

    state.rpm =
      750 +
      state.throttle *
      4300 +
      state.speed *
      18;

    if(state.speed < 1){
      state.gear = "N";
    }else if(state.speed < 12){
      state.gear = "1";
    }else if(state.speed < 28){
      state.gear = "2";
    }else if(state.speed < 48){
      state.gear = "3";
    }else if(state.speed < 75){
      state.gear = "4";
    }else if(state.speed < 110){
      state.gear = "5";
    }else{
      state.gear = "6";
    }

  }

  state.rpm =
    Math.max(
      700,
      Math.min(
        7000,
        state.rpm
      )
    );

  /* steering */

  const steeringStrength =
    Math.min(
      1,
      state.speed / 25
    );

  state.heading +=
    state.steering *
    65 *
    steeringStrength *
    delta;

  /* steering return */

  if(
    wheelPointer === null
  ){

    state.steering *=
      Math.pow(
        .05,
        delta
      );

  }

  /* distance */

  const metres =
    state.speed /
    3.6 *
    delta;

  state.distance +=
    metres / 1000;

  /* temperature */

  const temperatureTarget =
    88 +
    state.throttle * 12;

  state.temp +=
    (
      temperatureTarget -
      state.temp
    ) *
    delta *
    .7;

  /* fuel */

  state.fuel -=
    state.throttle *
    delta *
    .003;

  state.fuel =
    Math.max(
      0,
      state.fuel
    );

  /* damage */

  if(
    state.speed > 145 &&
    Math.abs(state.steering) > .95
  ){

    state.damage +=
      delta * .03;

  }

  state.damage =
    Math.min(
      100,
      state.damage
    );

}

/* =========================================================
   VISUAL ROAD MOTION
   ========================================================= */

let roadOffset = 0;

function updateRoad(delta){

  roadOffset +=
    state.speed *
    delta *
    .65;

  if(
    roadOffset > 90
  ){

    roadOffset = 0;

  }

  const lines =
    document.querySelectorAll(
      ".roadLine"
    );

  lines.forEach(
    (line,index) => {

      let y =
        (
          index * 110 +
          roadOffset * 2
        ) % 520;

      line.style.top =
        y + "px";

      const scale =
        .25 +
        y / 600;

      line.style.transform =
        `translateX(-50%) scale(${scale})`;

      line.style.left =
        "50%";

    }
  );

}

/* create road markings */

const roadLines =
  document.getElementById(
    "roadLines"
  );

for(
  let i=0;
  i<7;
  i++
){

  const line =
    document.createElement("div");

  line.className =
    "roadLine";

  line.style.top =
    (i * 110) + "px";

  line.style.left =
    "50%";

  roadLines.appendChild(
    line
  );

}

/* =========================================================
   UPDATE DASHBOARD
   ========================================================= */

function updateDashboard(){

  speedValue.textContent =
    Math.round(
      state.speed
    );

  rpmValue.textContent =
    Math.round(
      state.rpm
    );

  tempValue.textContent =
    Math.round(
      state.temp
    );

  fuelValue.textContent =
    Math.round(
      state.fuel
    );

  gearDisplay.textContent =
    state.gear;

  condition.textContent =
    "CONDITION " +
    Math.max(
      0,
      Math.round(
        100 -
        state.damage
      )
    ) +
    "%";

  accelValue.textContent =
    Math.round(
      state.throttle * 100
    ) + "%";

  brakeValue.textContent =
    Math.round(
      state.brake * 100
    ) + "%";

  accelPedal.style.setProperty(
    "--unused",
    "0"
  );

  accelPedal.style.setProperty(
    "background",
    `linear-gradient(
      to top,
      #263e46
      ${state.throttle * 100}%,
      #101213
      ${state.throttle * 100}%
    )`
  );

  brakePedal.style.background =
    `linear-gradient(
      to top,
      #4c2929
      ${state.brake * 100}%,
      #101213
      ${state.brake * 100}%
    )`;

  steeringWheel.style.transform =
    `rotate(${state.steering * 135}deg)`;

  indicatorStatus.textContent =
    state.hazards
      ? "HAZARD"
      : state.leftIndicator
        ? "LEFT"
        : state.rightIndicator
          ? "RIGHT"
          : state.headlights
            ? "LIGHTS"
            : "READY";

  lightIndicator.className =
    state.headlights
      ? "warningOn"
      : "";

}

/* =========================================================
   BUTTONS
   ========================================================= */

document
  .getElementById("lightsButton")
  .addEventListener(
    "click",
    () => {

      state.headlights =
        !state.headlights;

      document
        .getElementById(
          "lightsButton"
        )
        .classList.toggle(
          "active",
          state.headlights
        );

    }
  );

document
  .getElementById("leftIndicator")
  .addEventListener(
    "click",
    () => {

      state.leftIndicator =
        !state.leftIndicator;

      state.rightIndicator =
        false;

      document
        .getElementById(
          "leftIndicator"
        )
        .classList.toggle(
          "active",
          state.leftIndicator
        );

      document
        .getElementById(
          "rightIndicator"
        )
        .classList.remove(
          "active"
        );

    }
  );

document
  .getElementById("rightIndicator")
  .addEventListener(
    "click",
    () => {

      state.rightIndicator =
        !state.rightIndicator;

      state.leftIndicator =
        false;

      document
        .getElementById(
          "rightIndicator"
        )
        .classList.toggle(
          "active",
          state.rightIndicator
        );

      document
        .getElementById(
          "leftIndicator"
        )
        .classList.remove(
          "active"
        );

    }
  );

document
  .getElementById("hazardButton")
  .addEventListener(
    "click",
    () => {

      state.hazards =
        !state.hazards;

      document
        .getElementById(
          "hazardButton"
        )
        .classList.toggle(
          "active",
          state.hazards
        );

    }
  );

document
  .getElementById("wiperButton")
  .addEventListener(
    "click",
    () => {

      state.wipers =
        !state.wipers;

      document
        .getElementById(
          "wiperButton"
        )
        .classList.toggle(

        );

  );

/* =========================================================
   SETTINGS
   ========================================================= */

const settings =
  document.getElementById(
    "settings"
  );

document
  .getElementById(
    "settingsButton"
  )
  .addEventListener(
    "click",
    () => {

      settings.classList.add(
        "open"
      );

    }
  );

document
  .getElementById(
    "closeSettings"
  )
  .addEventListener(
    "click",
    () => {

      settings.classList.remove(
        "open"
      );

    }
  );

function toggleSetting(
  id,
  property
){

  document
    .getElementById(id)
    .addEventListener(
      "click",
      event => {

        state[property] =
          !state[property];

        event.target.textContent =
          state[property]
            ? "ON"
            : "OFF";

      }
    );

}

toggleSetting(
  "autoLights",
  "autoLights"
);

toggleSetting(
  "autoWipers",
  "autoWipers"
);

toggleSetting(
  "traction",
  "traction"
);

toggleSetting(
  "abs",
  "abs"
);

document
  .getElementById(
    "transmission"
  )
  .addEventListener(
    "click",
    event => {

      state.automatic =
        !state.automatic;

      event.target.textContent =
        state.automatic
          ? "AUTO"
          : "MANUAL";

    }
  );

document
  .getElementById(
    "driveSide"
  )
  .addEventListener(
    "click",
    event => {

      state.drivingSide =
        state.drivingSide ===
        "LEFT"
          ? "RIGHT"
          : "LEFT";

      event.target.textContent =
        state.drivingSide;

    }
  );

/* =========================================================
   MIRROR
   ========================================================= */

document
  .getElementById(
    "mirrorButton"
  )
  .addEventListener(
    "click",
    () => {

      showStatus(
        "Rear-view mirror active"
      );

    }
  );

/* =========================================================
   EXIT VEHICLE
   ========================================================= */

document
  .getElementById(
    "exitButton"
  )
  .addEventListener(
    "click",
    () => {

      state.throttle = 0;
      state.brake = 1;

      showStatus(
        "Vehicle parked • Exit feature ready"
      );

      setTimeout(
        () => {
          state.brake = 0;
        },
        500
      );

    }
  );

/* =========================================================
   KEYBOARD SUPPORT
   ========================================================= */

const keys = {};

window.addEventListener(
  "keydown",
  event => {

    keys[event.key] =
      true;

    if(
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ){

      state.throttle = 1;

    }

    if(
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ){

      state.brake = 1;

    }

    if(
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a"
    ){

      state.steering = -1;

    }

    if(
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ){

      state.steering = 1;

    }

  }
);

window.addEventListener(
  "keyup",
  event => {

    keys[event.key] =
      false;

    if(
      event.key === "ArrowUp" ||
      event.key.toLowerCase() === "w"
    ){

      state.throttle = 0;

    }

    if(
      event.key === "ArrowDown" ||
      event.key.toLowerCase() === "s"
    ){

      state.brake = 0;

    }

    if(
      event.key === "ArrowLeft" ||
      event.key.toLowerCase() === "a" ||
      event.key === "ArrowRight" ||
      event.key.toLowerCase() === "d"
    ){

      state.steering = 0;

    }

  }
);

/* =========================================================
   GAME LOOP
   ========================================================= */

function gameLoop(time){

  const delta =
    Math.min(
      .05,
      (time - previousTime) /
      1000
    );

  previousTime =
    time;

  updateVehicle(delta);

  updateRoad(delta);

  updateDashboard();

  requestAnimationFrame(
    gameLoop
  );

}

requestAnimationFrame(
  gameLoop
);

/* =========================================================
   SAVE GAME
   ========================================================= */

setInterval(
  () => {

    localStorage.setItem(
      "wayflo-vehicle",
      JSON.stringify({
        distance:
          state.distance,
        fuel:
          state.fuel,
        damage:
          state.damage
      })
    );

  },
  5000
);

/* =========================================================
   START MESSAGE
   ========================================================= */

setTimeout(
  () => {

    showStatus(
      "WAYFLO • Driver view ready"
    );

  },
  700
);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>WAYFLO Driving Simulator</title>

<style>
/* =========================================================
   WAYFLO COCKPIT — CLEAN RESPONSIVE LAYOUT
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #071018;
  font-family: Arial, Helvetica, sans-serif;
  color: #fff;
}

body {
  touch-action: manipulation;
}

/* ---------------------------------------------------------
   GENERAL CONTROL STYLE
   --------------------------------------------------------- */

button,
.control,
.panel,
.card {
  font-family: inherit;
}

button {
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
}

.control {
  background: rgba(7, 17, 25, 0.78);
  border: 2px solid rgba(255,255,255,0.13);
  border-radius: 18px;
  color: #fff;
  box-shadow:
    0 8px 22px rgba(0,0,0,0.25),
    inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.control.active {
  background: rgba(67, 145, 177, 0.75);
  border-color: #75d7ff;
}

/* ---------------------------------------------------------
   TOP INFORMATION
   --------------------------------------------------------- */

#vehicleInfo,
.vehicle-info,
#vehiclePanel,
.vehicle-panel {
  position: fixed !important;
  top: 20px !important;
  left: 20px !important;
  width: 285px !important;
  min-height: 112px;
  padding: 20px 22px !important;
  z-index: 1000 !important;

  background: rgba(17, 39, 53, 0.88);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 20px;

  box-shadow: 0 10px 28px rgba(0,0,0,0.22);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

#vehicleInfo h1,
.vehicle-info h1,
#vehiclePanel h1,
.vehicle-panel h1 {
  margin: 0 0 12px;
  font-size: 25px;
  line-height: 1.15;
  letter-spacing: 2px;
}

#vehicleInfo p,
.vehicle-info p,
#vehiclePanel p,
.vehicle-panel p {
  margin: 0;
  font-size: 16px;
}

/* ---------------------------------------------------------
   MIRROR
   --------------------------------------------------------- */

#mirror,
.mirror,
.mirror-container {
  position: fixed !important;

  top: 24px !important;
  left: 50% !important;

  width: min(460px, 46vw) !important;
  height: 125px !important;

  transform: translateX(-50%) !important;

  z-index: 900 !important;
}

/*
   Mirror must NEVER be hidden behind the vehicle card.
   The center position leaves the left and right controls
   independent from the mirror.
*/

#mirror img,
.mirror img,
.mirror-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 25px;
}

/* ---------------------------------------------------------
   TOP RIGHT BUTTONS
   --------------------------------------------------------- */

#mirrorButton,
.mirror-button,
#settingsButton,
.settings-button {
  position: fixed !important;
  top: 20px !important;
  z-index: 1100 !important;

  width: 100px !important;
  height: 92px !important;

  display: flex !important;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  border-radius: 20px;
}

#mirrorButton,
.mirror-button {
  right: 130px !important;
}

#settingsButton,
.settings-button {
  right: 20px !important;
}

#mirrorButton span,
.mirror-button span,
#settingsButton span,
.settings-button span {
  font-size: 13px;
  margin-top: 7px;
  letter-spacing: 1.5px;
}

/* ---------------------------------------------------------
   EXIT
   --------------------------------------------------------- */

#exitButton,
.exit-button,
.exit {
  position: fixed !important;

  top: 150px !important;
  left: 20px !important;

  width: 105px !important;
  height: 92px !important;

  z-index: 1100 !important;

  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border-radius: 20px;
}

/* ---------------------------------------------------------
   DRIVING SCENE
   --------------------------------------------------------- */

#road,
.road,
#scene,
.scene,
#game,
.game {
  position: fixed !important;
  left: 0 !important;
  right: 0 !important;

  top: 0 !important;
  bottom: 42% !important;

  z-index: 1 !important;

  overflow: hidden;
}

/* Keep the road visually behind the cockpit */

canvas {
  max-width: 100%;
}

/* ---------------------------------------------------------
   DASHBOARD
   --------------------------------------------------------- */

#dashboard,
.dashboard,
#cockpit,
.cockpit {
  position: fixed !important;

  left: 0 !important;
  right: 0 !important;
  bottom: 0 !important;

  height: 42% !important;

  z-index: 500 !important;

  background:
    linear-gradient(
      to bottom,
      rgba(3,8,12,0.88),
      rgba(3,8,12,0.97)
    );

  border-top: 1px solid rgba(255,255,255,0.08);
}

/* ---------------------------------------------------------
   INSTRUMENT ROW
   --------------------------------------------------------- */

#instrumentCluster,
.instrument-cluster,
#gauges,
.gauges {
  position: absolute !important;

  top: 20px !important;
  left: 50% !important;

  transform: translateX(-50%) !important;

  display: flex !important;
  align-items: center;
  justify-content: center;

  gap: 24px;

  width: 360px !important;
  height: 92px !important;

  z-index: 700 !important;
}

/* Speed / RPM circles */

.speed,
.rpm,
.speedometer,
.tachometer {
  width: 88px !important;
  height: 88px !important;

  flex: 0 0 88px;

  display: flex !important;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: rgba(3,8,12,0.92);
  border: 6px solid rgba(80,90,100,0.45);

  font-weight: 700;
  text-align: center;
}

/* Gear display */

#gearDisplay,
.gear-display {
  width: 82px !important;
  height: 82px !important;

  display: flex !important;
  align-items: center;
  justify-content: center;

  border-radius: 16px;

  background: rgba(3,8,12,0.92);
  border: 5px solid rgba(80,90,100,0.4);

  font-size: 30px;
  font-weight: 800;
}

/* ---------------------------------------------------------
   STATUS LINE
   --------------------------------------------------------- */

#status,
.status,
#statusBar,
.status-bar {
  position: absolute !important;

  top: 115px !important;
  left: 50% !important;

  transform: translateX(-50%) !important;

  width: 500px !important;
  max-width: 90vw;

  text-align: center;

  white-space: nowrap;

  font-size: 16px !important;
  letter-spacing: 1px;

  z-index: 700 !important;
}

/* ---------------------------------------------------------
   STEERING
   --------------------------------------------------------- */

#steering,
.steering,
#steeringWheel,
.steering-wheel {
  position: absolute !important;

  left: 28px !important;
  bottom: 88px !important;

  width: 190px !important;
  height: 190px !important;

  z-index: 750 !important;

  border-radius: 50%;
}

/* ---------------------------------------------------------
   GEAR SELECTOR
   --------------------------------------------------------- */

#gearSelector,
.gear-selector,
.gear-controls {
  position: absolute !important;

  left: 50% !important;
  bottom: 82px !important;

  transform: translateX(-50%) !important;

  width: 82px !important;

  display: flex !important;
  flex-direction: column;
  gap: 7px;

  z-index: 800 !important;
}

#gearSelector button,
.gear-selector button,
.gear-controls button {
  width: 82px !important;
  height: 48px !important;

  border-radius: 12px;

  background: rgba(5,10,15,0.9);
  border: 2px solid rgba(255,255,255,0.10);

  color: #fff;

  font-size: 16px;
  font-weight: 700;
}

#gearSelector button.active,
.gear-selector button.active,
.gear-controls button.active {
  background: #5795b0;
  border-color: #80d8ff;
}

/* ---------------------------------------------------------
   PEDALS
   --------------------------------------------------------- */

#pedals,
.pedals,
#pedalControls,
.pedal-controls {
  position: absolute !important;

  right: 24px !important;
  bottom: 80px !important;

  display: flex !important;
  gap: 16px;

  z-index: 750 !important;
}

#brake,
.brake,
#accelerator,
.accelerator {
  width: 112px !important;
  height: 190px !important;

  border-radius: 22px;

  background: rgba(5,10,15,0.78);

  display: flex !important;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  padding-top: 15px;
}

#brake,
.brake {
  border: 3px solid rgba(220,75,75,0.75);
}

#accelerator,
.accelerator {
  border: 3px solid rgba(60,190,230,0.75);
}

#brake .pedal-fill,
.brake .pedal-fill,
#accelerator .pedal-fill,
.accelerator .pedal-fill {
  width: 54px;
  height: 125px;
  margin-top: 18px;

  border-radius: 30px;

  background: rgba(255,255,255,0.06);

  overflow: hidden;
}

/* ---------------------------------------------------------
   BOTTOM CONTROL BAR
   --------------------------------------------------------- */

#bottomControls,
.bottom-controls,
#controlBar,
.control-bar {
  position: absolute !important;

  left: 16px !important;
  right: 16px !important;
  bottom: 10px !important;

  height: 58px !important;

  display: grid !important;
  grid-template-columns: repeat(6, 1fr);

  gap: 10px;

  z-index: 900 !important;
}

#bottomControls button,
.bottom-controls button,
#controlBar button,
.control-bar button {
  min-width: 0;

  height: 58px !important;

  border-radius: 14px;

  background: rgba(4,9,14,0.84);

  border: 2px solid rgba(255,255,255,0.10);

  color: #fff;

  font-size: 12px;
  letter-spacing: 1px;
}

#bottomControls button.active,
.bottom-controls button.active,
#controlBar button.active,
.control-bar button.active {
  background: rgba(65,135,165,0.65);
  border-color: #78d5f5;
}

/* ---------------------------------------------------------
   PORTRAIT PHONE
   --------------------------------------------------------- */

@media (orientation: portrait) and (max-width: 700px) {

  #vehicleInfo,
  .vehicle-info,
  #vehiclePanel,
  .vehicle-panel {
    top: 18px !important;
    left: 18px !important;
    width: 270px !important;
    min-height: 92px !important;
    padding: 16px 18px !important;
  }

  #vehicleInfo h1,
  .vehicle-info h1,
  #vehiclePanel h1,
  .vehicle-panel h1 {
    font-size: 20px;
  }

  #vehicleInfo p,
  .vehicle-info p,
  #vehiclePanel p,
  .vehicle-panel p {
    font-size: 14px;
  }

  #mirror,
  .mirror,
  .mirror-container {
    top: 145px !important;
    left: 50% !important;

    width: 62vw !important;
    height: 105px !important;
  }

  #mirrorButton,
  .mirror-button {
    top: 18px !important;
    right: 112px !important;

    width: 90px !important;
    height: 82px !important;
  }

  #settingsButton,
  .settings-button {
    top: 18px !important;
    right: 18px !important;

    width: 90px !important;
    height: 82px !important;
  }

  #exitButton,
  .exit-button,
  .exit {
    top: 125px !important;
    left: 18px !important;

    width: 90px !important;
    height: 82px !important;
  }

  #road,
  .road,
  #scene,
  .scene,
  #game,
  .game {
    bottom: 45% !important;
  }

  #dashboard,
  .dashboard,
  #cockpit,
  .cockpit {
    height: 45% !important;
  }

  #instrumentCluster,
  .instrument-cluster,
  #gauges,
  .gauges {
    top: 16px !important;

    width: 330px !important;
    gap: 15px !important;
  }

  .speed,
  .rpm,
  .speedometer,
  .tachometer {
    width: 82px !important;
    height: 82px !important;
  }

  #gearDisplay,
  .gear-display {
    width: 76px !important;
    height: 76px !important;
  }

  #status,
  .status,
  #statusBar,
  .status-bar {
    top: 104px !important;

    font-size: 13px !important;

    width: 94vw !important;
  }

  #steering,
  .steering,
  #steeringWheel,
  .steering-wheel {
    left: 20px !important;
    bottom: 72px !important;

    width: 150px !important;
    height: 150px !important;
  }

  #gearSelector,
  .gear-selector,
  .gear-controls {
    bottom: 72px !important;
    width: 70px !important;
  }

  #gearSelector button,
  .gear-selector button,
  .gear-controls button {
    width: 70px !important;
    height: 42px !important;
  }

  #pedals,
  .pedals,
  #pedalControls,
  .pedal-controls {
    right: 14px !important;
    bottom: 72px !important;
    gap: 10px !important;
  }

  #brake,
  .brake,
  #accelerator,
  .accelerator {
    width: 82px !important;
    height: 160px !important;
  }

  #bottomControls,
  .bottom-controls,
  #controlBar,
  .control-bar {
    left: 10px !important;
    right: 10px !important;
    bottom: 8px !important;

    height: 54px !important;

    gap: 6px !important;
  }

  #bottomControls button,
  .bottom-controls button,
  #controlBar button,
  .control-bar button {
    height: 54px !important;
    font-size: 10px !important;
  }
}

/* ---------------------------------------------------------
   VERY SMALL PHONES
   --------------------------------------------------------- */

@media (orientation: portrait) and (max-width: 430px) {

  #mirror,
  .mirror,
  .mirror-container {
    top: 135px !important;
    width: 64vw !important;
    height: 90px !important;
  }

  #steering,
  .steering,
  #steeringWheel,
  .steering-wheel {
    width: 125px !important;
    height: 125px !important;
    left: 12px !important;
  }

  #brake,
  .brake,
  #accelerator,
  .accelerator {
    width: 72px !important;
    height: 145px !important;
  }

  #gearSelector,
  .gear-selector,
  .gear-controls {
    width: 62px !important;
  }

  #gearSelector button,
  .gear-selector button,
  .gear-controls button {
    width: 62px !important;
    height: 38px !important;
  }
}

/* ---------------------------------------------------------
   LANDSCAPE
   --------------------------------------------------------- */

@media (orientation: landscape) {

  #vehicleInfo,
  .vehicle-info,
  #vehiclePanel,
  .vehicle-panel {
    top: 20px !important;
    left: 20px !important;
    width: 285px !important;
  }

  #mirror,
  .mirror,
  .mirror-container {
    top: 20px !important;
    width: min(42vw, 700px) !important;
    height: 105px !important;
  }

  #road,
  .road,
  #scene,
  .scene,
  #game,
  .game {
    bottom: 34% !important;
  }

  #dashboard,
  .dashboard,
  #cockpit,
  .cockpit {
    height: 34% !important;
  }

  #instrumentCluster,
  .instrument-cluster,
  #gauges,
  .gauges {
    top: 12px !important;
  }

  #status,
  .status,
  #statusBar,
  .status-bar {
    top: 105px !important;
  }

  #steering,
  .steering,
  #steeringWheel,
  .steering-wheel {
    left: 28px !important;
    bottom: 68px !important;
    width: 150px !important;
    height: 150px !important;
  }

  #gearSelector,
  .gear-selector,
  .gear-controls {
    bottom: 65px !important;
  }

  #pedals,
  .pedals,
  #pedalControls,
  .pedal-controls {

  }

  #brake,
  .brake,
  #accelerator,

  }

  #bottomControls,

  #bottomControls button,

</style>
</head>

<body>

<div id="game">

  <!-- ================= WINDSHIELD ================= -->

  <section id="windshield">

    <div id="horizon"></div>

    <div class="tree left"></div>
    <div class="tree left2"></div>
    <div class="tree right"></div>
    <div class="tree right2"></div>

    <div id="road">
      <div id="roadMarkings"></div>
    </div>

    <div id="mirror">
      <div id="mirrorRoad"></div>
      <div id="mirrorLine"></div>
    </div>

  </section>

  <!-- ================= TOP UI ================= -->

  <div id="vehicleStatus">
    <div class="vehicleTitle">WAYFLO • VEHICLE 01</div>
    <div class="condition">
      <span class="greenDot">●</span>
      CONDITION <strong id="condition">100%</strong>
    </div>
  </div>

  <button class="topButton" id="mirrorButton">
    <div class="icon">▱</div>
    <span>MIRROR</span>
  </button>

  <button class="topButton" id="settingsButton">
    <div class="icon">⚙</div>
    <span>SETTINGS</span>
  </button>

  <button id="exitButton">↪<br>EXIT</button>

  <!-- ================= DASHBOARD ================= -->

  <section id="dashboard">

    <div id="instruments">

      <div class="gauge">
        <div class="gaugeValue" id="speed">0</div>
        <div class="gaugeLabel">KM/H</div>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <div class="gaugeValue" id="rpm">800</div>
        <div class="gaugeLabel">RPM</div>
      </div>

    </div>

    <div id="statusStrip">
      <span class="ready">● READY</span>
      <span>•</span>
      <span>TEMP <strong id="temp">88</strong>°C</span>
      <span>•</span>
      <span>FUEL <strong id="fuel">100</strong>%</span>
      <span>•</span>
      <span>☀️ CLEAR</span>
    </div>

    <!-- ================= CONTROLS ================= -->

    <div id="controls">

      <!-- STEERING -->

      <div id="steering">
        <div id="steeringInner"></div>
        <div class="steerArrow" id="steerLeft">‹</div>
        <div class="steerArrow" id="steerRight">›</div>
        <div id="steeringHub">WAYFLO</div>
      </div>

      <!-- GEAR SELECTOR -->

      <div id="gearSelector">

        <button class="gearButton active" data-gear="P">P</button>
        <button class="gearButton" data-gear="R">R</button>
        <button class="gearButton" data-gear="N">N</button>
        <button class="gearButton" data-gear="D">D</button>

      </div>

      <!-- PEDALS -->

      <div id="pedals">

        <div class="pedal" id="brake">
          <div class="pedalName">BRAKE</div>
          <div class="pedalTrack">
            <div class="pedalFill" id="brakeFill"></div>
          </div>
          <div class="pedalPercent" id="brakePercent">0%</div>
        </div>

        <div class="pedal" id="accel">
          <div class="pedalName">ACCEL</div>
          <div class="pedalTrack">
            <div class="pedalFill" id="accelFill"></div>
          </div>
          <div class="pedalPercent" id="accelPercent">0%</div>
        </div>

      </div>

      <!-- BOTTOM SWITCHES -->

      <div id="switches">

        <button class="switch" data-switch="lights">
          <div class="switchIcon">◉</div>
          <div class="switchText">LIGHTS</div>
        </button>

        <button class="switch" data-switch="left">
          <div class="switchIcon">←</div>
          <div class="switchText">LEFT</div>
        </button>

        <button class="switch" data-switch="hazard">
          <div class="switchIcon">△</div>
          <div class="switchText">HAZARD</div>
        </button>

        <button class="switch" data-switch="right">
          <div class="switchIcon">→</div>
          <div class="switchText">RIGHT</div>
        </button>

        <button class="switch" data-switch="wipers">
          <div class="switchIcon">◇</div>
          <div class="switchText">WIPERS</div>
        </button>

        <button class="switch" data-switch="map">
          <div class="switchIcon">□</div>
          <div class="switchText">MAP</div>
        </button>

      </div>

    </div>
  </section>

</div>

<script>

/* =========================================================
   WAYFLO DRIVING SYSTEM
========================================================= */

let gear = "P";
let speed = 0;
let rpm = 800;
let temp = 88;
let fuel = 100;

let acceleration = 0;
let braking = 0;
let steering = 0;

let lastTime = performance.now();

/* =========================================================
   ELEMENTS
========================================================= */

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const tempEl = document.getElementById("temp");
const fuelEl = document.getElementById("fuel");
const gearDisplay = document.getElementById("gearDisplay");

const brakeFill = document.getElementById("brakeFill");
const accelFill = document.getElementById("accelFill");

const brakePercent = document.getElementById("brakePercent");
const accelPercent = document.getElementById("accelPercent");

const steeringEl = document.getElementById("steering");

/* =========================================================
   GEAR SELECTOR
========================================================= */

document.querySelectorAll(".gearButton").forEach(button => {

  button.addEventListener("click", () => {

    gear = button.dataset.gear;

    document.querySelectorAll(".gearButton")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    gearDisplay.textContent = gear;

    if(gear === "P" || gear === "N"){
      speed = 0;
    }

  });

});

/* =========================================================
   PEDAL SLIDER
========================================================= */

function makePedal(element, fill, percent, callback){

  let active = false;

  function update(clientY){

    const rect = element.getBoundingClientRect();

    let value =
      (rect.bottom - clientY) / rect.height;

    value = Math.max(0,Math.min(1,value));

    callback(value);

    fill.style.height = (value * 100) + "%";
    percent.textContent =
      Math.round(value * 100) + "%";
  }

  element.addEventListener("pointerdown",e=>{
    active=true;
    element.setPointerCapture(e.pointerId);
    update(e.clientY);
  });

  element.addEventListener("pointermove",e=>{
    if(active) update(e.clientY);
  });

  element.addEventListener("pointerup",()=>{
    active=false;
  });

  element.addEventListener("pointercancel",()=>{
    active=false;
  });
}

makePedal(
  document.getElementById("accel"),
  accelFill,
  accelPercent,
  value => acceleration=value
);

makePedal(
  document.getElementById("brake"),
  brakeFill,
  brakePercent,
  value => braking=value
);

/* =========================================================
   STEERING
========================================================= */

let steeringActive=false;

steeringEl.addEventListener("pointerdown",e=>{
  steeringActive=true;
  steeringEl.setPointerCapture(e.pointerId);
  updateSteering(e.clientX);
});

steeringEl.addEventListener("pointermove",e=>{
  if(steeringActive) updateSteering(e.clientX);
});

steeringEl.addEventListener("pointerup",()=>{
  steeringActive=false;
  steering=0;
  steeringEl.style.transform="rotate(0deg)";
});

function updateSteering(x){

  const rect=steeringEl.getBoundingClientRect();

  const centre=rect.left+rect.width/2;

  steering=(x-centre)/(rect.width/2);

  steering=Math.max(-1,Math.min(1,steering));

  steeringEl.style.transform=
    "rotate("+(steering*70)+"deg)";
}

/* =========================================================
   LIGHTS / SWITCHES
========================================================= */

document.querySelectorAll(".switch").forEach(button=>{

  button.addEventListener("click",()=>{

    const type=button.dataset.switch;

    if(type==="hazard"){

      document
        .querySelectorAll('[data-switch="left"],[data-switch="right"]')
        .forEach(b=>b.classList.remove("active"));

    }

    if(type==="left"){

      document
        .querySelector('[data-switch="right"]')
        .classList.remove("active");

    }

    if(type==="right"){

      document
        .querySelector('[data-switch="left"]')
        .classList.remove("active");

    }

    button.classList.toggle("active");

  });

});

/* =========================================================
   DRIVING PHYSICS
========================================================= */

function updateDriving(dt){

  const forward =
    gear==="D";

  const reverse =
    gear==="R";

  if(forward || reverse){

    const accelerationForce =
      acceleration * 32;

    const brakingForce =
      braking * 55;

    speed +=
      accelerationForce * dt;

    speed -=
      brakingForce * dt;

    if(acceleration===0){
      speed -= 5 * dt;
    }

    speed=Math.max(0,Math.min(140,speed));

  }else{

    speed=0;

  }

  if(reverse){
    speed=Math.min(speed,25);
  }

  rpm =
    800 +
    acceleration * 4200 +
    speed * 15;

  if(braking>.1){
    rpm-=braking*300;
  }

  rpm=Math.max(800,Math.min(6500,rpm));

  if(acceleration>.7 && temp<105){
    temp+=.012*dt*60;
  }else if(temp>88){
    temp-=.004*dt*60;
  }

  temp=Math.max(88,Math.min(105,temp));

  fuel-=
    acceleration * .0007 * dt * 60;

  fuel=Math.max(0,fuel);

  speedEl.textContent=Math.round(speed);
  rpmEl.textContent=Math.round(rpm);
  tempEl.textContent=Math.round(temp);
  fuelEl.textContent=Math.round(fuel);

}

/* =========================================================
   ANIMATION LOOP
========================================================= */

function loop(now){

  let dt=(now-lastTime)/1000;

  lastTime=now;

  dt=Math.min(dt,.05);

  updateDriving(dt);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   MIRROR BUTTON
========================================================= */

document.getElementById("mirrorButton")
  .addEventListener("click",()=>{

    const mirror=document.getElementById("mirror");

    mirror.style.opacity =
      mirror.style.opacity==="0.35" ? "1" : "0.35";

  });

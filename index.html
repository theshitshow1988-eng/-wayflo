<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>WAYFLO Cockpit</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05090c;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

button{
  border:0;
  color:#fff;
  font:inherit;
  background:none;
  padding:0;
  touch-action:none;
}

/* =========================================================
   MAIN
========================================================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#071016;
}

/* =========================================================
   OUTSIDE WORLD
========================================================= */

#world{
  position:absolute;
  inset:0 0 36% 0;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #62afe0 0%,
      #9bd1e7 58%,
      #8a9d7b 59%,
      #596b50 100%
    );
}

#sun{
  position:absolute;
  width:105px;
  height:105px;
  right:13%;
  top:18%;
  border-radius:50%;
  background:#fff0a4;
  box-shadow:0 0 45px rgba(255,240,160,.5);
}

.hill{
  position:absolute;
  left:-20%;
  bottom:20%;
  width:140%;
  height:23%;
  border-radius:50% 50% 0 0;
  background:#758b92;
}

.hill.two{
  bottom:16%;
  background:#829875;
  transform:scaleX(1.15);
}

/* Trees */

.tree{
  position:absolute;
  bottom:15%;
  width:20px;
  height:105px;
  background:#624832;
}

.tree:before{
  content:"";
  position:absolute;
  width:105px;
  height:105px;
  left:-42px;
  top:-68px;
  border-radius:50%;
  background:#275b38;
  box-shadow:
    38px 17px 0 #326d42,
    -25px 23px 0 #367447;
}

.t1{left:7%;transform:scale(.8)}
.t2{left:23%;transform:scale(.55)}
.t3{right:18%;transform:scale(1.05)}
.t4{right:5%;transform:scale(.72)}

/* Road */

#road{
  position:absolute;
  left:7%;
  bottom:-2%;
  width:86%;
  height:48%;
  background:#363a3c;
  clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  height:100%;
  width:5px;
  background:#fff;
}

#road:before{left:31%}
#road:after{right:31%}

.lane{
  position:absolute;
  left:50%;
  width:5px;
  height:10%;
  border-radius:4px;
  background:#fff;
  transform:translateX(-50%);
}

.l1{top:5%}
.l2{top:30%}
.l3{top:55%}
.l4{top:80%}

/* =========================================================
   TOP INFORMATION
========================================================= */

#top{
  position:absolute;
  z-index:50;
  top:max(16px,env(safe-area-inset-top));
  left:22px;
  right:22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.info{
  width:290px;
  max-width:52%;
  padding:14px 18px;
  border-radius:20px;
  background:rgba(9,28,39,.78);
  border:1px solid rgba(255,255,255,.24);
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.infoTitle{
  font-size:clamp(16px,4vw,23px);
  font-weight:800;
  letter-spacing:2px;
}

.infoCondition{
  margin-top:7px;
  font-size:clamp(11px,2.8vw,15px);
  opacity:.85;
  letter-spacing:.5px;
}

.greenDot{
  color:#43e276;
}

/* Top buttons */

.topButtons{
  display:flex;
  gap:10px;
}

.topButton{
  width:76px;
  height:76px;
  border-radius:20px;
  background:rgba(9,28,39,.78);
  border:1px solid rgba(255,255,255,.25);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:0 8px 25px rgba(0,0,0,.25);
}

.topIcon{
  font-size:27px;
  line-height:1;
}

.topLabel{
  margin-top:6px;
  font-size:10px;
  letter-spacing:1px;
  font-weight:bold;
}

/* Exit */

#exit{
  position:absolute;
  z-index:51;
  left:22px;
  top:140px;
  width:90px;
  height:82px;
  border-radius:20px;
  background:rgba(9,28,39,.78);
  border:1px solid rgba(255,255,255,.25);
  font-size:13px;
  font-weight:bold;
  letter-spacing:1px;
}

#exitIcon{
  font-size:25px;
  display:block;
  margin-bottom:5px;
}

/* =========================================================
   REAR VIEW MIRROR
========================================================= */

#mirror{
  position:absolute;
  z-index:40;
  left:20%;
  right:20%;
  top:15%;
  height:14%;
  min-height:70px;
  border:6px solid #101417;
  border-radius:30px;
  overflow:hidden;
  background:
    linear-gradient(
      #75b9dc 0%,
      #9ac9d0 53%,
      #72876d 54%,
      #4d5d4d 100%
    );
  box-shadow:0 8px 22px rgba(0,0,0,.4);
}

#mirrorRoad{
  position:absolute;
  left:40%;
  bottom:0;
  width:20%;
  height:65%;
  background:#3a3c3d;
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
}

#mirrorCar{
  position:absolute;
  left:48%;
  bottom:18%;
  width:4%;
  height:10%;
  min-width:5px;
  background:#171a1c;
  border-radius:3px;
}

/* =========================================================
   COCKPIT
========================================================= */

#cockpit{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  height:36%;
  min-height:270px;
  background:
    linear-gradient(
      to bottom,
      rgba(6,10,13,.90),
      rgba(3,6,8,.98)
    );
  border-top:1px solid rgba(255,255,255,.14);
  box-shadow:0 -15px 35px rgba(0,0,0,.4);
}

/* =========================================================
   DASHBOARD
========================================================= */

#dashboard{
  position:absolute;
  left:20%;
  right:20%;
  top:12px;
  height:110px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
}

.gauge{
  width:92px;
  height:92px;
  border-radius:50%;
  background:#080c0f;
  border:6px solid #30383d;
  box-shadow:
    inset 0 0 20px #000,
    0 2px 8px rgba(0,0,0,.4);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.gaugeValue{
  font-size:29px;
  font-weight:800;
}

.gaugeUnit{
  margin-top:2px;
  font-size:9px;
  letter-spacing:1px;
  opacity:.7;
}

#gearDisplay{
  width:66px;
  height:66px;
  border-radius:12px;
  background:#080c0f;
  border:4px solid #363e43;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:31px;
  font-weight:800;
}

/* Dashboard lower information */

#status{
  position:absolute;
  left:20%;
  right:20%;
  top:112px;
  text-align:center;
  white-space:nowrap;
  font-size:11px;
  letter-spacing:1px;
  color:#d7dadd;
}

.ready{
  color:#42e477;
}

/* =========================================================
   STEERING WHEEL
========================================================= */

#steering{
  position:absolute;
  left:22px;
  bottom:65px;
  width:min(185px,31vw);
  height:min(185px,31vw);
  min-width:145px;
  min-height:145px;
  border-radius:50%;
  background:rgba(8,12,15,.65);
  border:9px solid rgba(255,255,255,.16);
  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.07),
    0 8px 25px rgba(0,0,0,.4);
  transition:transform .08s linear;
}

#steering:before,
#steering:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.15);
  border-radius:5px;
}

#steering:before{
  width:12px;
  height:65%;
  left:50%;
  top:18%;
  transform:translateX(-50%);
}

#steering:after{
  height:12px;
  width:65%;
  left:18%;
  top:50%;
  transform:translateY(-50%);
}

#steerCenter{
  position:absolute;
  left:25%;
  top:25%;
  width:50%;
  height:50%;
  border-radius:50%;
  background:rgba(10,15,18,.8);
  border:5px solid rgba(255,255,255,.12);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:2;
}

#steerLogo{
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  z-index:3;
  top:42%;
  font-size:28px;
  opacity:.7;
}

.steerLeft{left:5%}
.steerRight{right:5%}

/* =========================================================
   GEAR SELECTOR
========================================================= */

#gears{
  position:absolute;
  right:30%;
  bottom:76px;
  display:flex;
  flex-direction:column;
  gap:4px;
}

.gear{
  width:62px;
  height:38px;
  border-radius:9px;
  background:rgba(12,17,21,.82);
  border:1px solid rgba(255,255,255,.18);
  font-size:15px;
  font-weight:800;
}

.gear.active{
  background:#376579;
  border-color:#82d8ee;
  box-shadow:0 0 8px rgba(100,210,235,.2);
}

/* =========================================================
   PEDALS
========================================================= */

#pedals{
  position:absolute;
  right:22px;
  bottom:70px;
  height:175px;
  display:flex;
  gap:12px;
}

.pedal{
  position:relative;
  width:76px;
  height:175px;
  border-radius:20px;
  background:rgba(8,12,15,.46);
  border:2px solid rgba(255,255,255,.2);
  overflow:hidden;
}

.pedal.brake{
  border-color:rgba(215,85,85,.65);
}

.pedal.accel{
  border-color:rgba(55,190,220,.65);
}

.pedalName{
  position:absolute;
  top:12px;
  width:100%;
  text-align:center;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1.5px;
  opacity:.8;
}

.pedalFill{
  position:absolute;
  left:7px;
  right:7px;
  bottom:7px;
  height:0;
  border-radius:13px;
  background:rgba(255,255,255,.13);
}

/* =========================================================
   BOTTOM CONTROLS
========================================================= */

#controls{
  position:absolute;
  z-index:60;
  left:20px;
  right:20px;
  bottom:12px;
  height:70px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}

.control{
  min-width:0;
  height:70px;
  border-radius:17px;
  background:rgba(8,13,16,.72);
  border:1px solid rgba(255,255,255,.2);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.controlIcon{
  font-size:23px;
  line-height:1;
}

.controlLabel{
  margin-top:6px;
  font-size:8px;
  letter-spacing:1px;
  font-weight:bold;
}

.control.on{
  background:rgba(55,105,120,.8);
  border-color:#85d7e9;
}

.control.hazardOn{
  background:rgba(100,35,35,.8);
  border-color:#f06a6a;
}

/* =========================================================
   SETTINGS PANEL
========================================================= */

#settingsPanel{
  position:absolute;
  z-index:200;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(360px,88vw);
  padding:22px;
  border-radius:22px;
  background:rgba(7,12,16,.96);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 20px 60px rgba(0,0,0,.55);
  display:none;
}

#settingsPanel.show{
  display:block;
}

.settingsTitle{
  font-size:19px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:18px;
}

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  font-size:14px;
}

.settingButton{
  padding:8px 14px;
  border-radius:10px;
  background:#263b45;
  border:1px solid rgba(255,255,255,.2);
}

#closeSettings{
  margin-top:20px;
  width:100%;
  height:45px;
  border-radius:12px;
  background:#315b6c;
}

/* =========================================================
   MESSAGE
========================================================= */

#message{
  position:absolute;
  z-index:300;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  padding:11px 18px;
  border-radius:18px;
  background:rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.18);
  font-size:12px;
  letter-spacing:.5px;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s;
  white-space:nowrap;
}

#message.show{
  opacity:1;
}

/* =========================================================
   SMALL PHONES
========================================================= */

@media(max-width:390px){

  #top{
    left:14px;
    right:14px;
  }

  .info{
    padding:11px 13px;
    border-radius:16px;
  }

  .topButton{
    width:62px;
    height:62px;
    border-radius:16px;
  }

  #exit{
    left:14px;
    top:122px;
    width:70px;
    height:65px;
  }

  #mirror{
    left:17%;
    right:17%;
    top:16%;
    height:12%;
  }

  #dashboard{
    left:15%;
    right:15%;
    gap:6px;
  }

  .gauge{
    width:76px;
    height:76px;
    border-width:5px;
  }

  .gaugeValue{
    font-size:24px;
  }

  #gearDisplay{
    width:56px;
    height:56px;
    font-size:25px;
  }

  #status{
    left:8%;
    right:8%;
    top:106px;
    font-size:9px;
  }

  #steering{
    left:10px;
    bottom:64px;
  }

  #gears{
    right:27%;
    bottom:67px;
  }

  .gear{
    width:52px;
    height:34px;
  }

  #pedals{
    right:10px;
    bottom:64px;
    height:150px;
  }

  .pedal{
    width:60px;
    height:150px;
  }

  #controls{
    left:10px;
    right:10px;
    gap:5px;
    bottom:7px;
    height:61px;
  }

  .control{
    height:61px;
    border-radius:13px;
  }

  .controlIcon{
    font-size:19px;
  }

  .controlLabel{
    font-size:7px;
    margin-top:4px;
  }
}

/* Landscape */
@media(max-height:500px){
  #world{
    inset:0 0 42% 0;
  }

  #cockpit{
    height:42%;
  }

  #mirror{
    top:13%;
    height:18%;
  }

  #dashboard{
    top:5px;
    height:85px;
  }

  .gauge{
    width:70px;
    height:70px;
  }

  #status{
    top:88px;
  }

  #steering{
    width:125px;
    height:125px;
    min-width:125px;
    min-height:125px;
  }

  #pedals{
    height:125px;
  }

  .pedal{
    height:125px;
  }

  #controls{
    height:52px;
  }

  .control{
    height:52px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- =====================================================
       OUTSIDE WORLD
  ====================================================== -->

  <div id="world">

    <div id="sun"></div>

    <div class="hill"></div>
    <div class="hill two"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div id="road">
      <div class="lane l1"></div>
      <div class="lane l2"></div>
      <div class="lane l3"></div>
      <div class="lane l4"></div>
    </div>

    <!-- Rear view mirror -->

    <div id="mirror">
      <div id="mirrorRoad"></div>
      <div id="mirrorCar"></div>
    </div>

  </div>


  <!-- =====================================================
       TOP UI
  ====================================================== -->

  <div id="top">

    <div class="info">
      <div class="infoTitle">
        WAYFLO • VEHICLE 01
      </div>

      <div class="infoCondition">
        <span class="greenDot">●</span>
        CONDITION <b id="condition">100</b>%
      </div>
    </div>

    <div class="topButtons">

      <button class="topButton" id="mirrorButton">
        <div class="topIcon">▱</div>
        <div class="topLabel">MIRROR</div>
      </button>

      <button class="topButton" id="settingsButton">
        <div class="topIcon">⚙</div>
        <div class="topLabel">SETTINGS</div>
      </button>

    </div>

  </div>


  <!-- EXIT -->

  <button id="exit">
    <span id="exitIcon">↪</span>
    EXIT
  </button>


  <!-- =====================================================
       COCKPIT
  ====================================================== -->

  <div id="cockpit">

    <!-- Dashboard -->

    <div id="dashboard">

      <div class="gauge">
        <div class="gaugeValue" id="speed">0</div>
        <div class="gaugeUnit">KM/H</div>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <div class="gaugeValue" id="rpm">800</div>
        <div class="gaugeUnit">RPM</div>
      </div>

    </div>


    <!-- Status -->

    <div id="status">

      <span class="ready">● READY</span>
      &nbsp; • &nbsp;

      TEMP <span id="temp">88</span>°C
      &nbsp; • &nbsp;

      FUEL <span id="fuel">100</span>%
      &nbsp; • &nbsp;

      <span id="weather">☀ CLEAR</span>

    </div>


    <!-- Steering -->

    <div id="steering">

      <span class="steerArrow steerLeft">‹</span>

      <div id="steerCenter">
        <span id="steerLogo">WAYFLO</span>
      </div>

      <span class="steerArrow steerRight">›</span>

    </div>


    <!-- Gear selector -->

    <div id="gears">

      <button class="gear active" data-gear="P">P</button>
      <button class="gear" data-gear="R">R</button>
      <button class="gear" data-gear="N">N</button>
      <button class="gear" data-gear="D">D</button>

    </div>


    <!-- Pedals -->

    <div id="pedals">

      <div class="pedal brake" id="brake">
        <div class="pedalName">BRAKE</div>
        <div class="pedalFill"></div>
      </div>

      <div class="pedal accel" id="accel">
        <div class="pedalName">ACCEL</div>
        <div class="pedalFill"></div>
      </div>

    </div>

  </div>


  <!-- =====================================================
       BOTTOM CONTROLS
  ====================================================== -->

  <div id="controls">

    <button class="control" id="lights">
      <div class="controlIcon">◉</div>
      <div class="controlLabel">LIGHTS</div>
    </button>

    <button class="control" id="left">
      <div class="controlIcon">←</div>
      <div class="controlLabel">LEFT</div>
    </button>

    <button class="control" id="hazard">
      <div class="controlIcon">△</div>
      <div class="controlLabel">HAZARD</div>
    </button>

    <button class="control" id="right">
      <div class="controlIcon">→</div>
      <div class="controlLabel">RIGHT</div>
    </button>

    <button class="control" id="wipers">
      <div class="controlIcon">♢</div>
      <div class="controlLabel">WIPERS</div>
    </button>

    <button class="control" id="map">
      <div class="controlIcon">□</div>
      <div class="controlLabel">MAP</div>
    </button>

  </div>


  <!-- =====================================================
       SETTINGS
  ====================================================== -->

  <div id="settingsPanel">

    <div class="settingsTitle">
      WAYFLO • VEHICLE SETTINGS
    </div>

    <div class="settingRow">
      <span>Lights</span>
      <button class="settingButton" id="lightMode">
        MANUAL
      </button>
    </div>

    <div class="settingRow">
      <span>Wipers</span>
      <button class="settingButton" id="wiperMode">
        MANUAL
      </button>
    </div>

    <div class="settingRow">
      <span>Weather</span>
      <button class="settingButton" id="weatherMode">
        CLEAR
      </button>
    </div>

    <button id="closeSettings">
      CLOSE SETTINGS
    </button>

  </div>


  <div id="message"></div>

</div>


<script>

/* =========================================================
   WAYFLO DRIVING SYSTEM
========================================================= */

let speed = 0;
let rpm = 800;
let gear = "P";

let accel = 0;
let brake = 0;
let steering = 0;

let fuel = 100;
let temp = 88;
let condition = 100;

let lightsOn = false;
let hazardOn = false;
let leftOn = false;
let rightOn = false;
let wipersOn = false;

let lightAuto = false;
let wiperAuto = false;

let weather = "CLEAR";


/* =========================================================
   ELEMENTS
========================================================= */

const speedEl =
  document.getElementById("speed");

const rpmEl =
  document.getElementById("rpm");

const gearEl =
  document.getElementById("gearDisplay");

const fuelEl =
  document.getElementById("fuel");

const tempEl =
  document.getElementById("temp");

const conditionEl =
  document.getElementById("condition");

const steeringEl =
  document.getElementById("steering");

const mirrorEl =
  document.getElementById("mirror");

const weatherEl =
  document.getElementById("weather");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

  const box =
    document.getElementById("message");

  box.textContent = text;
  box.classList.add("show");

  clearTimeout(window.messageTimer);

  window.messageTimer =
    setTimeout(function(){
      box.classList.remove("show");
    },1200);
}


/* =========================================================

/* =========================================================
   PEDALS
========================================================= */

function setupPedal(element,type){

  const fill =
    element.querySelector(".pedalFill");

  let active = false;

  function update(e){

    const rect =
      element.getBoundingClientRect();

    let value =
      1 -
      ((e.clientY - rect.top) / rect.height);

    value =
      Math.max(0,Math.min(1,value));

    if(type === "accel"){
      accel = value;
    }else{
      brake = value;
    }

    fill.style.height =
      (value * 100) + "%";
  }

  element.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      active = true;

      element.setPointerCapture(
        e.pointerId
      );

      update(e);
    }
  );

  element.addEventListener(
    "pointermove",
    function(e){

      if(active){
        update(e);
      }

    }
  );

  function release(){

    active = false;

    if(type === "accel"){
      accel = 0;
    }else{
      brake = 0;
    }

    fill.style.height = "0%";
  }

  element.addEventListener(
    "pointerup",
    release
  );

  element.addEventListener(
    "pointercancel",
    release
  );
}

setupPedal(
  document.getElementById("accel"),
  "accel"
);

setupPedal(
  document.getElementById("brake"),
  "brake"
);


/* =========================================================
   STEERING
========================================================= */

let steeringActive = false;
let steeringStartX = 0;
let steeringStartValue = 0;

steeringEl.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    steeringActive = true;

    steeringStartX =
      e.clientX;

    steeringStartValue =
      steering;

    steeringEl.setPointerCapture(
      e.pointerId
    );
  }
);

steeringEl.addEventListener(
  "pointermove",
  function(e){

    if(!steeringActive){
      return;
    }

    const delta =
      (e.clientX - steeringStartX) / 100;

    steering =
      Math.max(
        -1,
        Math.min(
          1,
          steeringStartValue + delta
        )
      );

    steeringEl.style.transform =
      "rotate(" +
      (steering * 65) +
      "deg)";
  }
);

function releaseSteering(){

  steeringActive = false;

}

steeringEl.addEventListener(
  "pointerup",
  releaseSteering
);

steeringEl.addEventListener(
  "pointercancel",
  releaseSteering
);

  if(weather === "CLEAR"){

    document.getElementById(
      "world"
    ).style.filter =
      "none";

  }

  if(weather === "RAIN"){

    weatherEl.textContent =
      "RAIN";

    document.getElementById(
      "world"
    ).style.filter =
      "brightness(.75)";

  }

  if(weather === "NIGHT"){

    weatherEl.textContent =
      "NIGHT";

    document.getElementById(
      "world"
    ).style.filter =
      "brightness(.38)";

  }

  if(
    lightAuto &&
    weather === "NIGHT"
  ){

    document
      .getElementById("lights")
      .classList.add("on");

    lightsOn = true;
  }

  if(
    wiperAuto &&
    weather === "RAIN"
  ){

    document
      .getElementById("wipers")
      .classList.add("on");

    wipersOn = true;
  }

}

/* =========================================================
   DRIVING LOOP
========================================================= */

let lastTime =
  performance.now();

function drivingLoop(now){

  const dt =
    Math.min(
      .05,
      (now - lastTime) / 1000
    );

  lastTime = now;


  /* Direction */

  let driveForce = 0;

  if(gear === "D"){
    driveForce = accel;
  }

  if(gear === "R"){
    driveForce = -accel;
  }


  /* Acceleration */

  speed +=
    driveForce * 28 * dt;


  /* Rolling resistance */

  if(accel === 0){

    speed *=
      Math.pow(
        .992,
        dt * 60
      );

  }


  /* Brakes */

  speed -=
    brake * 55 * dt;


  /* Direction limits */

  if(gear === "D"){
    speed =
      Math.max(
        0,
        speed
      );
  }

  if(gear === "R"){
    speed =
      Math.min(
        0,
        speed
      );
  }


  speed =
    Math.max(
      -18,
      Math.min(
        180,
        speed
      )
    );


  /* RPM */

  const absoluteSpeed =
    Math.abs(speed);

  if(
    gear === "P" ||
    gear === "N"
  ){

    rpm =
      800 +
      accel * 2500;

  }else{

    rpm =
      800 +
      absoluteSpeed * 55 +
      accel * 2300;

  }

  rpm =
    Math.max(
      700,
      Math.min(
        6500,
        rpm
      )
    );


  /* Steering returns */

  if(!steeringActive){

    steering *=
      Math.pow(
        .90,
        dt * 60
      );

    steeringEl.style.transform =
      "rotate(" +
      (steering * 65) +
      "deg)";

  }


  /* =====================================================
     ROAD MOVEMENT
  ====================================================== */

  const lanes =
    document.querySelectorAll(
      ".lane"
    );

  const movement =
    Math.abs(speed) * 1.8;

  lanes.forEach(
    function(lane,index){

      let y =
        parseFloat(
          lane.dataset.y ||
          [5,30,55,80][index]
        );

      y +=
        movement * dt;

      if(y > 105){
        y = -12;
      }

      lane.dataset.y =
        y;

      lane.style.top =
        y + "%";

    }
  );


  /* =====================================================
     MIRROR MOVEMENT
  ====================================================== */

  const mirrorCar =
    document.getElementById(
      "mirrorCar"
    );

  mirrorCar.style.transform =
    "translateX(" +
    (-steering * 18) +
    "px)";


  /* =====================================================
     DASHBOARD
  ====================================================== */

  speedEl.textContent =
    Math.round(
      Math.abs(speed)
    );

  rpmEl.textContent =
    Math.round(rpm);

  gearEl.textContent =
    gear;


  /* Fuel */

  if(
    accel > 0 &&
    Math.abs(speed) > 0
  ){

    fuel -=
      accel *
      .002 *
      dt *
      60;

  }

  fuel =
    Math.max(
      0,
      fuel
    );

  fuelEl.textContent =
    Math.round(fuel);


  /* Temperature */

  if(
    temp < 105 &&
    accel > .7
  ){

    temp +=
      .015 *
      dt *
      60;

  }else if(temp > 88){

    temp -=
      .005 *
      dt *
      60;

  }

  tempEl.textContent =
    Math.round(temp);


  /* Condition */

  conditionEl.textContent =
    Math.round(
      condition
    );


  requestAnimationFrame(
    drivingLoop
  );
}


/* Start */

requestAnimationFrame(
  drivingLoop
);

showMessage(
  "WAYFLO • COCKPIT READY"
);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#071015">
<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071015;
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  touch-action:none;
}

button{
  font:inherit;
  color:white;
  border:0;
  outline:0;
  -webkit-user-select:none;
  user-select:none;
  touch-action:none;
}

/* =====================================================
   MAIN WORLD / WINDSCREEN
===================================================== */

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100svh;
  overflow:hidden;
  background:#82bad6;
}

#scene{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #62a6ce 0%,
      #9ccce2 42%,
      #dce0d4 58%,
      #677267 59%,
      #313632 100%
    );
  transition:filter .6s;
}

/* sky glow */

#sun{
  position:absolute;
  width:72px;
  height:72px;
  right:16%;
  top:16%;
  border-radius:50%;
  background:#fff3a5;
  box-shadow:0 0 55px rgba(255,243,165,.8);
}

/* distant hills */

.hill{
  position:absolute;
  left:-10%;
  width:120%;
  border-radius:50% 50% 0 0;
}

.hill.back{
  bottom:40%;
  height:18%;
  background:#627d8a;
  opacity:.7;
}

.hill.front{
  bottom:36%;
  height:16%;
  background:#66745f;
}

/* fields */

.field{
  position:absolute;
  bottom:28%;
  width:55%;
  height:20%;
  background:#74865e;
}

.field.left{
  left:-4%;
  transform:skewY(-8deg);
}

.field.right{
  right:-4%;
  transform:skewY(8deg);
}

/* trees */

.tree{
  position:absolute;
  width:65px;
  height:115px;
}

.tree:before{
  content:"";
  position:absolute;
  left:29px;
  bottom:0;
  width:9px;
  height:60px;
  background:#553927;
}

.tree:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:64px;
  height:64px;
  border-radius:50%;
  background:#2f603b;
  box-shadow:
    20px 13px 0 #396b43,
    -15px 23px 0 #397047;
}

.tree.a{
  left:4%;
  bottom:38%;
  transform:scale(.72);
}

.tree.b{
  right:5%;
  bottom:37%;
  transform:scale(1.05);
}

.tree.c{
  left:20%;
  bottom:39%;
  transform:scale(.45);
}

.tree.d{
  right:23%;
  bottom:39%;
  transform:scale(.5);
}

/* road */

#road{
  position:absolute;
  left:50%;
  bottom:0;
  width:145%;
  height:52%;
  transform:translateX(-50%);
  background:#3f4140;
  clip-path:polygon(
    40% 0,
    60% 0,
    100% 100%,
    0 100%
  );
}

.roadEdge{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:#f3f3ef;
}

.roadEdge.left{
  left:40%;
}

.roadEdge.right{
  right:40%;
}

#centreLine{
  position:absolute;
  left:50%;
  bottom:0;
  width:8px;
  height:48%;
  transform:translateX(-50%);
  overflow:hidden;
}

.roadMark{
  position:absolute;
  left:50%;
  width:8px;
  height:46px;
  transform:translateX(-50%);
  border-radius:4px;
  background:#f4f4ef;
}

/* windshield edge */

#glass{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.17),
      transparent 12%,
      transparent 88%,
      rgba(0,0,0,.17)
    );
}

/* =====================================================
   MIRROR
===================================================== */

#mirror{
  position:absolute;
  z-index:50;
  top:max(12px,env(safe-area-inset-top));
  left:50%;
  width:min(47vw,320px);
  height:min(16vw,90px);
  min-height:62px;
  transform:translateX(-50%);
  border:4px solid rgba(4,7,9,.9);
  border-radius:22px;
  overflow:hidden;
  background:#18272d;
  box-shadow:0 7px 22px rgba(0,0,0,.45);
}

#rearSky{
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      #5f9dc1 0 50%,
      #5b665b 51% 100%
    );
}

#rearRoad{
  position:absolute;
  left:50%;
  bottom:-15px;
  width:125%;
  height:70%;
  transform:translateX(-50%);
  background:#3e403f;
  clip-path:polygon(
    34% 0,
    66% 0,
    100% 100%,
    0 100%
  );
}

#rearVehicle{
  position:absolute;
  left:50%;
  bottom:15px;
  width:23px;
  height:13px;
  transform:translateX(-50%);
  border-radius:5px;
  background:#4d5558;
}

#mirrorLabel{
  position:absolute;
  left:0;
  right:0;
  bottom:4px;
  text-align:center;
  font-size:7px;
  letter-spacing:1.5px;
  color:rgba(255,255,255,.55);
}

/* =====================================================
   TOP STATUS
===================================================== */

#statusCard{
  position:absolute;
  z-index:70;
  left:20px;
  top:max(18px,env(safe-area-inset-top));
  padding:12px 17px;
  border-radius:15px;
  background:rgba(9,20,26,.62);
  border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(9px);
}

#vehicleTitle{
  font-size:15px;
  font-weight:900;
  letter-spacing:1px;
}

#condition{
  margin-top:4px;
  font-size:10px;
  opacity:.75;
}

.statusDot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:7px;
  border-radius:50%;
  background:#35d269;
}

/* top-right */

#topActions{
  position:absolute;
  z-index:70;
  top:max(18px,env(safe-area-inset-top));
  right:18px;
  display:flex;
  gap:8px;
}

.actionButton{
  width:68px;
  height:68px;
  border-radius:15px;
  background:rgba(9,20,26,.55);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(8px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
}

.actionIcon{
  font-size:22px;
}

.actionLabel{
  font-size:8px;
  font-weight:800;
  letter-spacing:.6px;
}

.actionButton:active,
.controlButton:active,
.gearButton:active{
  transform:scale(.94);
}

/* exit */

#exit{
  position:absolute;
  z-index:70;
  left:20px;
  top:110px;
  width:68px;
  height:68px;
  border-radius:15px;
  background:rgba(9,20,26,.55);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(8px);
  font-size:9px;
  font-weight:900;
}

#exit span{
  display:block;
  font-size:22px;
  margin-bottom:4px;
}

/* =====================================================
   COCKPIT / DASHBOARD
===================================================== */

#cockpit{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  height:38%;
  min-height:245px;
  pointer-events:none;
  background:
    linear-gradient(
      to bottom,
      transparent,
      rgba(3,6,7,.18) 12%,
      rgba(3,5,6,.78) 44%,
      #080b0d 100%
    );
}

/* dashboard */

#dashboard{
  position:absolute;
  left:50%;
  bottom:84px;
  width:min(370px,48vw);
  height:130px;
  transform:translateX(-50%);
  border-radius:28px 28px 0 0;
  background:rgba(7,10,12,.87);
  border:1px solid rgba(255,255,255,.12);
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  box-shadow:0 -5px 20px rgba(0,0,0,.3);
}

.gauge{
  width:92px;
  height:92px;
  border-radius:50%;
  border:3px solid #4c5153;
  background:
    radial-gradient(
      circle,
      #171b1d 0 56%,
      #080a0b 57%
    );
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.gaugeValue{
  font-size:25px;
  font-weight:900;
}

.gaugeLabel{
  font-size:8px;
  letter-spacing:1px;
  opacity:.65;
}

#gearDisplay{
  width:56px;
  height:62px;
  border-radius:10px;
  border:2px solid #4d5254;
  background:#0a0d0f;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#gearDisplay small{
  font-size:7px;
  opacity:.55;
}

#gearDisplay strong{
  font-size:27px;
}

#dashboardInfo{
  position:absolute;
  left:0;
  right:0;
  bottom:10px;
  text-align:center;
  font-size:8px;
  letter-spacing:.6px;
  color:rgba(255,255,255,.62);
}

/* =====================================================
   STEERING
===================================================== */

#steeringZone{
  position:absolute;
  z-index:100;
  left:20px;
  bottom:88px;
  width:180px;
  height:180px;
  pointer-events:auto;
  touch-action:none;
}

#steeringWheel{
  position:absolute;
  inset:5px;
  border-radius:50%;
  border:13px solid rgba(15,17,18,.76);
  background:
    radial-gradient(
      circle,
      rgba(255,255,255,.04) 0 22%,
      transparent 23%
    );
  box-shadow:
    inset 0 0 0 2px rgba(255,255,255,.16),
    0 8px 22px rgba(0,0,0,.4);
  transition:transform .04s linear;
}

#steeringWheel:before,
#steeringWheel:after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  width:11px;
  height:68px;
  transform-origin:50% 100%;
  background:rgba(13,15,16,.82);
  border-radius:5px;
}

#steeringWheel:before{
  transform:translate(-50%,-100%) rotate(0deg);
}

#steeringWheel:after{
  transform:translate(-50%,-100%) rotate(120deg);
}

#wheelHub{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(19,22,24,.9);
  border:2px solid rgba(255,255,255,.15);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
}

#steeringHint{
  position:absolute;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:7px;
  color:rgba(255,255,255,.45);
}

/* =====================================================
   PEDALS
===================================================== */

#pedals{
  position:absolute;
  z-index:100;
  right:22px;
  bottom:92px;
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.pedal{
  width:72px;
  height:165px;
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:rgba(7,10,11,.42);
  backdrop-filter:blur(6px);
  border:2px solid rgba(255,255,255,.23);
  touch-action:none;
}

#brake{
  border-color:rgba(255,90,90,.55);
}

#accelerator{
  border-color:rgba(60,190,230,.65);
}

.pedalTitle{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  text-align:center;
  font-size:9px;
  font-weight:800;
  letter-spacing:.8px;
  opacity:.75;
  pointer-events:none;
}

.pedalTrack{
  position:absolute;
  left:50%;
  top:43px;
  bottom:15px;
  width:28px;
  transform:translateX(-50%);
  border-radius:14px;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);
}

.pedalFill{
  position:absolute;
  left:3px;
  right:3px;
  bottom:3px;
  height:0;
  border-radius:11px;
  background:rgba(255,255,255,.24);
}

.pedalValue{
  position:absolute;
  left:0;
  right:0;
  bottom:8px;
  text-align:center;
  font-size:8px;
  font-weight:900;
  pointer-events:none;
}

/* =====================================================
   GEAR SELECTOR
===================================================== */

#gearSelector{
  position:absolute;
  z-index:105;
  right:115px;
  bottom:99px;
  display:flex;
  flex-direction:column;
  gap:4px;
  pointer-events:auto;
}

.gearButton{
  width:48px;
  height:42px;
  border-radius:10px;
  background:rgba(8,11,13,.5);
  border:1px solid rgba(255,255,255,.2);
  backdrop-filter:blur(5px);
  font-size:13px;
  font-weight:900;
}

.gearButton.active{
  background:rgba(75,166,207,.68);
  border-color:#8ee3ff;
  box-shadow:0 0 12px rgba(70,190,230,.35);
}

/* =====================================================
   LOWER CONTROL BAR
===================================================== */

#controlBar{
  position:absolute;
  z-index:120;
  left:18px;
  right:18px;
  bottom:max(10px,env(safe-area-inset-bottom));
  height:66px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:7px;
  pointer-events:auto;
}

.controlButton{
  min-width:0;
  border-radius:14px;
  background:rgba(8,11,13,.5);
  border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(7px);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:3px;
}

.controlIcon{
  font-size:21px;
  line-height:1;
}

.controlText{
  font-size:7px;
  font-weight:900;
  letter-spacing:.5px;
}

.controlButton.active{
  background:rgba(58,103,111,.62);
  border-color:rgba(160,225,235,.65);
}

/* =====================================================
   STATUS STRIP
===================================================== */

#bottomStatus{
  position:absolute;
  z-index:125;
  left:18px;
  right:18px;
  bottom:80px;
  height:24px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  font-size:8px;
  color:rgba(255,255,255,.65);
  pointer-events:none;
}

.statusItem{
  display:flex;
  align-items:center;
  gap:5px;
}

.greenDot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#37d26c;
}

/* =====================================================
   MESSAGE
===================================================== */

#message{
  position:absolute;
  z-index:400;
  left:50%;
  top:43%;
  transform:translate(-50%,-50%);
  padding:10px 16px;
  border-radius:12px;
  background:rgba(5,8,10,.75);
  backdrop-filter:blur(9px);
  font-size:12px;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

#message.show{
  opacity:1;
}

/* =====================================================
   SETTINGS
===================================================== */

#settings{
  position:fixed;
  inset:0;
  z-index:500;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(9px);
}

#settings.open{
  display:flex;
}

.settingsPanel{
  width:min(90vw,390px);
  padding:20px;
  border-radius:20px;
  background:#151a1d;
  border:1px solid rgba(255,255,255,.2);
}

.settingsPanel h2{
  margin:0 0 14px;
  font-size:20px;
}

.settingRow{
  min-height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
  font-size:12px;
}

.settingToggle{
  padding:7px 12px;
  border-radius:9px;
  background:#293337;
  border:1px solid #566268;
  font-size:10px;
  font-weight:900;
}

#closeSettings{
  width:100%;
  height:44px;
  margin-top:16px;
  border-radius:11px;
  background:#42606a;
  font-weight:900;
}

/* =====================================================
   NIGHT
===================================================== */

body.night #scene{
  filter:brightness(.45) saturate(.75);
}

body.night #sun{
  background:#cbdcff;
  box-shadow:0 0 30px #b8ccff;
}

/* =====================================================
   PHONE ADJUSTMENTS
===================================================== */

@media(max-width:600px){

  #statusCard{
    left:12px;
    padding:10px 13px;
  }

  #vehicleTitle{
    font-size:12px;
  }

  #topActions{
    right:12px;
  }

  .actionButton{
    width:55px;
    height:55px;
  }

  #exit{
    left:12px;
    top:92px;
    width:58px;
    height:58px;
  }

  #cockpit{
    height:43%;
  }

  #dashboard{
    bottom:72px;
    width:330px;
    height:112px;
  }

  .gauge{
    width:78px;
    height:78px;
  }

  .gaugeValue{
    font-size:22px;
  }

  #gearDisplay{
    width:48px;
    height:55px;
  }

  #steeringZone{
    left:8px;
    bottom:72px;
    width:158px;
    height:158px;
  }

  #pedals{
    right:10px;
    bottom:76px;
    gap:8px;
  }

  .pedal{
    width:58px;
    height:145px;
  }

  #gearSelector{
    right:78px;
    bottom:82px;
  }

  .gearButton{
    width:42px;
    height:35px;
  }

  #controlBar{
    left:8px;
    right:8px;
    bottom:max(5px,env(safe-area-inset-bottom));
    height:58px;
    gap:4px;
  }

  .controlIcon{
    font-size:17px;
  }

  .controlText{
    font-size:6px;
  }

  #bottomStatus{
    bottom:65px;
    font-size:7px;
  }

}

/* very short phone */

@media(max-height:700px){

  #mirror{
    height:58px;
  }

  #cockpit{
    min-height:220px;
  }

  #steeringZone{
    transform:scale(.82);
    transform-origin:bottom left;
  }

  #pedals{
    transform:scale(.82);
    transform-origin:bottom right;
  }

  #gearSelector{
    transform:scale(.82);
    transform-origin:bottom right;
  }

}
</style>
</head>

<body>

<div id="game">

  <!-- WORLD -->

  <div id="scene">

    <div id="sun"></div>

    <div class="hill back"></div>
    <div class="hill front"></div>

    <div class="field left"></div>
    <div class="field right"></div>

    <div class="tree a"></div>
    <div class="tree b"></div>
    <div class="tree c"></div>
    <div class="tree d"></div>

    <div id="road">
      <div class="roadEdge left"></div>
      <div class="roadEdge right"></div>
    </div>

    <div id="centreLine"></div>

    <div id="glass"></div>

  </div>

  <!-- REAR VIEW MIRROR -->

  <div id="mirror">

    <div id="rearSky"></div>
    <div id="rearRoad"></div>
    <div id="rearVehicle"></div>

    <div id="mirrorLabel">
      REAR VIEW
    </div>

  </div>

  <!-- TOP LEFT STATUS -->

  <div id="statusCard">

    <div id="vehicleTitle">
      <span class="statusDot"></span>
      WAYFLO • VEHICLE 01
    </div>

    <div id="condition">
      CONDITION 100%
    </div>

  </div>

  <!-- TOP RIGHT -->

  <div id="topActions">

    <button class="actionButton" id="mirrorButton">
      <span class="actionIcon">🪞</span>
      <span class="actionLabel">MIRROR</span>
    </button>

    <button class="actionButton" id="settingsButton">
      <span class="actionIcon">⚙️</span>
      <span class="actionLabel">SETTINGS</span>
    </button>

  </div>

  <!-- EXIT -->

  <button id="exit">
    <span>↪</span>
    EXIT
  </button>

  <!-- COCKPIT -->

  <div id="cockpit">

    <!-- DASHBOARD -->

    <div id="dashboard">

      <div class="gauge">

        <div
          class="gaugeValue"
          id="speed"
        >0</div>

        <div class="gaugeLabel">
          KM/H
        </div>

      </div>

      <div id="gearDisplay">

        <small>GEAR</small>

        <strong id="gearDisplayValue">
          P
        </strong>

      </div>

      <div class="gauge">

        <div
          class="gaugeValue"
          id="rpm"
        >800</div>

        <div class="gaugeLabel">
          RPM
        </div>

      </div>

      <div id="dashboardInfo">
        TEMP <span id="temp">88</span>°C
        • FUEL <span id="fuel">100</span>%
        • <span id="driveStatus">READY</span>
      </div>

    </div>

    <!-- STEERING -->

    <div id="steeringZone">

      <div id="steeringWheel">

        <div id="wheelHub">
          WAYFLO
        </div>

      </div>

      <div id="steeringHint">
        STEER
      </div>

    </div>

    <!-- GEAR SELECTOR -->

    <div id="gearSelector">

      <button
        class="gearButton active"
        data-gear="P"
      >P</button>

      <button
        class="gearButton"
        data-gear="R"
      >R</button>

      <button
        class="gearButton"
        data-gear="N"
      >N</button>

      <button
        class="gearButton"
        data-gear="D"
      >D</button>

    </div>

    <!-- PEDALS -->

    <div id="pedals">

      <div
        class="pedal"
        id="brake"
      >

        <div class="pedalTitle">
          BRAKE
        </div>

        <div class="pedalTrack">
          <div
            class="pedalFill"
            id="brakeFill"
          ></div>
        </div>

        <div
          class="pedalValue"
          id="brakeValue"
        >0%</div>

      </div>

      <div
        class="pedal"
        id="accelerator"
      >

        <div class="pedalTitle">
          ACCEL
        </div>

        <div class="pedalTrack">
          <div
            class="pedalFill"
            id="accelFill"
          ></div>
        </div>

        <div
          class="pedalValue"
          id="accelValue"
        >0%</div>

      </div>

    </div>

    <!-- LOWER CONTROLS -->

    <div id="controlBar">

      <button
        class="controlButton"
        id="lights"
      >
        <span class="controlIcon">💡</span>
        <span class="controlText">LIGHTS</span>
      </button>

      <button
        class="controlButton"
        id="leftIndicator"
      >
        <span class="controlIcon">←</span>
        <span class="controlText">LEFT</span>
      </button>

      <button
        class="controlButton"
        id="hazard"
      >
        <span class="controlIcon">⚠</span>
        <span class="controlText">HAZARD</span>
      </button>

      <button
        class="controlButton"
        id="rightIndicator"
      >
        <span class="controlIcon">→</span>
        <span class="controlText">RIGHT</span>
      </button>

      <button
        class="controlButton"
        id="wipers"
      >
        <span class="controlIcon">♢</span>
        <span class="controlText">WIPERS</span>
      </button>

      <button
        class="controlButton"
        id="mapButton"
      >
        <span class="controlIcon">🗺</span>
        <span class="controlText">MAP</span>
      </button>

    </div>

    <!-- STATUS -->

    <div id="bottomStatus">

      <div class="statusItem">
        <span class="greenDot"></span>
        READY
      </div>

      <div class="statusItem">
        🌡 TEMP <span id="bottomTemp">88</span>°C
      </div>

      <div class="statusItem">
        ⛽ FUEL <span id="bottomFuel">100</span>%
      </div>

      <div class="statusItem">
        ☀ CLEAR
      </div>

    </div>

  </div>

  <!-- MESSAGE -->

  <div id="message"></div>

</div>

<!-- SETTINGS -->

<div id="settings">

  <div class="settingsPanel">

    <h2>WAYFLO SETTINGS</h2>

    <div class="settingRow">
      <span>Automatic headlights</span>
      <button
        class="settingToggle"
        data-setting="autoLights"
      >ON</button>
    </div>

    <div class="settingRow">
      <span>Automatic wipers</span>
      <button
        class="settingToggle"
        data-setting="autoWipers"
      >ON</button>
    </div>

    <div class="settingRow">
      <span>Traction control</span>
      <button
        class="settingToggle"
        data-setting="traction"
      >ON</button>
    </div>

    <div class="settingRow">
      <span>ABS</span>
      <button
        class="settingToggle"
        data-setting="abs"
      >ON</button>
    </div>

    <div class="settingRow">
      <span>Night mode</span>
      <button
        class="settingToggle"
        data-setting="night"
      >OFF</button>
    </div>

    <button id="closeSettings">
      DONE
    </button>

  </div>

</div>

<script>

/* =====================================================
   VEHICLE
===================================================== */

const car = {

  speed:0,
  rpm:800,
  temp:88,
  fuel:100,
  damage:0,

  gear:"P",

  throttle:0,
  brake:0,

  steering:0,
  steeringAngle:0,

  headlights:false,
  left:false,
  right:false,
  hazard:false,
  wipers:false,

  autoLights:true,
  autoWipers:true,
  traction:true,
  abs:true,
  night:false

};

/* =====================================================
   HELPERS
===================================================== */

const $ =
  id => document.getElementById(id);

let messageTimer;

function showMessage(text){

  $("message").textContent = text;

  $("message").classList.add("show");

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(
      () =>
        $("message").classList.remove("show"),
      1300
    );

}

/* =====================================================
   GEARS
===================================================== */

document
.querySelectorAll(".gearButton")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const requested =
        button.dataset.gear;

      if(
        Math.abs(car.speed) > 3
      ){

        showMessage(
          "SLOW DOWN TO CHANGE GEAR"
        );

        return;

      }

      car.gear =
        requested;

      document
      .querySelectorAll(".gearButton")
      .forEach(b =>
        b.classList.toggle(
          "active",
          b === button
        )
      );

      $("gearDisplayValue")
        .textContent =
        requested;

      if(requested === "R")
        showMessage("REVERSE");

      if(requested === "D")
        showMessage("DRIVE");

      if(requested === "N")
        showMessage("NEUTRAL");

      if(requested === "P")
        showMessage("PARK");

    }
  );

});

/* =====================================================
   PEDALS
===================================================== */

function setupPedal(
  element,
  callback
){

  let pointer = null;

  function update(event){

    const rect =
      element.getBoundingClientRect();

    let value =
      (
        rect.bottom -
        event.clientY
      ) /
      rect.height;

    value =
      Math.max(
        0,
        Math.min(
          1,
          value
        )
      );

    callback(value);

  }

  element.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      pointer =
        event.pointerId;

      element.setPointerCapture(
        pointer
      );

      update(event);

    }
  );

  element.addEventListener(
    "pointermove",
    event => {

      if(
        event.pointer === pointer ||
        event.pointerId === pointer
      ){

        update(event);

      }

    }
  );

  function release(){

    pointer = null;
    callback(0);

  }

  element.addEventListener(
    "pointerup",
    release
  );

  element.addEventListener(
    "pointercancel",
    release
  );

}

setupPedal(
  $("accelerator"),
  value => car.throttle = value
);

setupPedal(
  $("brake"),
  value => car.brake = value
);

/* =====================================================
   STEERING
===================================================== */

const steeringZone =
  $("steeringZone");

const steeringWheel =
  $("steeringWheel");

let steeringPointer =
  null;

let steeringStartX =
  0;

let steeringStart =
  0;

steeringZone.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    steeringPointer =
      event.pointerId;

    steeringZone.setPointerCapture(
      steeringPointer
    );

    steeringStartX =
      event.clientX;

    steeringStart =
      car.steering;

  }
);

steeringZone.addEventListener(
  "pointermove",
  event => {

    if(
      event.pointerId !==
      steeringPointer
    )
      return;

    const delta =
      (
        event.clientX -
        steeringStartX
      ) / 100;

    car.steering =
      Math.max(
        -1,
        Math.min(
          1,
          steeringStart + delta
        )
      );

  }
);

function releaseSteering(){

  steeringPointer =
    null;

}

steeringZone.addEventListener(
  "pointerup",
  releaseSteering
);

steeringZone.addEventListener(
  "pointercancel",
  releaseSteering
);

/* =====================================================
   SWITCHES
===================================================== */

function switchToggle(
  id,
  property
){

  $(id).addEventListener(
    "click",
    () => {

      car[property] =
        !car[property];

      $(id).classList.toggle(
        "active",
        car[property]
      );

    }
  );

}

switchToggle(
  "lights",
  "headlights"
);

switchToggle(
  "hazard",
  "hazard"
);

switchToggle(
  "wipers",
  "wipers"
);

$("leftIndicator")
.addEventListener(
  "click",
  () => {

    car.left =
      !car.left;

    car.right =
      false;

    $("leftIndicator")
      .classList.toggle(
        "active",
        car.left
      );

    $("rightIndicator")
      .classList.remove(
        "active"
      );

  }
);

$("rightIndicator")
.addEventListener(
  "click",
  () => {

    car.right =
      !car.right;

    car.left =
      false;

    $("rightIndicator")
      .classList.toggle(
        "active",
        car.right
      );

    $("leftIndicator")
      .classList.remove(
        "active"
      );

  }
);

/* =====================================================
   PHYSICS
===================================================== */

function physics(dt){

  let acceleration = 0;

  if(
    car.gear === "D"
  ){

    acceleration +=
      car.throttle * 38;

  }

  if(
    car.gear === "R"
  ){

    acceleration -=
      car.throttle * 24;

  }

  if(
    car.gear === "P" ||
    car.gear === "N"
  ){

    acceleration = 0;

  }

  /*
    Natural resistance.
  */

  if(
    Math.abs(car.speed) > .1
  ){

    acceleration -=
      Math.sign(car.speed) *
      (
        3.5 +
        Math.abs(car.speed) * .045
      );

  }

  /*
    Brake.
  */

  if(
    car.brake > 0
  ){

    const brakeForce =
      car.abs
        ? 82
        : 68;

    acceleration -=
      Math.sign(car.speed || 1) *
      car.brake *
      brakeForce;

  }

  /*
    Update speed.
  */

  car.speed +=
    acceleration * dt;

  /*
    Prevent tiny movement.
  */

  if(
    Math.abs(car.speed) < .25 &&
    car.brake > .2
  ){

    car.speed = 0;

  }

  car.speed =
    Math.max(
      -35,
      Math.min(
        220,
        car.speed
      )
    );

  /*
    RPM.
  */

  if(
    car.gear === "P" ||
    car.gear === "N"
  ){

    car.rpm = 800;

  }else{

    car.rpm =
      800 +
      car.throttle * 4000 +
      Math.abs(car.speed) * 14;

  }

  car.rpm =
    Math.min(
      7000,
      car.rpm
    );

  /*
    Steering return.
  */

  if(
    steeringPointer === null
  ){

    car.steering *=
      Math.pow(
        .035,
        dt
      );

  }

  /*
    Steering angle.
  */

  const movement =
    Math.min(
      1,
      Math.abs(car.speed) / 12
    );

  const direction =
    car.gear === "R"
      ? -1
      : 1;

  car.steeringAngle +=
    car.steering *
    movement *
    55 *
    dt *
    direction;

  /*
    Temperature.
  */

  car.temp +=
    (
      88 +
      car.throttle * 10 -
      car.temp
    ) *
    dt *
    .8;

  /*
    Fuel.
  */

  car.fuel -=
    car.throttle *
    dt *
    .002;

  car.fuel =
    Math.max(
      0,
      car.fuel
    );

  /*
    Damage begins to rise
    during extreme manoeuvres.
  */

  if(
    Math.abs(car.steering) > .92 &&
    Math.abs(car.speed) > 105
  ){

    car.damage +=
      dt * .015;

  }

  car.damage =
    Math.min(
      100,
      car.damage
    );

}

/* =====================================================
   ROAD MOTION
===================================================== */

let roadMotion = 0;

function updateRoad(dt){

  roadMotion +=
    Math.abs(car.speed) *
    dt *
    1.5;

  document
  .querySelectorAll(".roadMark")
  .forEach(
    (mark,index) => {

      const y =
        (
          index * 95 +
          roadMotion * 3
        ) % 480;

      mark.style.top =
        y + "px";

      const scale =
        .25 +
        y / 500;

      mark.style.transform =
        `translateX(-50%) scale(${scale})`;

    }
  );

}

/* =====================================================
   DASHBOARD
===================================================== */

function updateDashboard(){

  $("speed")
    .textContent =
    Math.round(
      Math.abs(car.speed)
    );

  $("rpm")
    .textContent =
    Math.round(
      car.rpm
    );

  $("temp")
    .textContent =
    Math.round(
      car.temp
    );

  $("bottomTemp")
    .textContent =
    Math.round(
      car.temp
    );

  $("fuel")
    .textContent =
    Math.round(
      car.fuel
    );

  $("bottomFuel")
    .textContent =
    Math.round(
      car.fuel
    );

  $("condition")
    .textContent =
    "CONDITION " +
    Math.round(
      100 - car.damage
    ) +
    "%";

  $("brakeFill")
    .style.height =
    (
      car.brake * 100
    ) + "%";

  $("accelFill")
    .style.height =
    (
      car.throttle * 100
    ) + "%";

  $("brakeValue")
    .textContent =
    Math.round(
      car.brake * 100
    ) + "%";

  $("accelValue")
    .textContent =
    Math.round(
      car.throttle * 100
    ) + "%";

  /*
    Steering wheel visual rotation.
  */

  steeringWheel.style.transform =
    `rotate(${car.steering * 115}deg)`;

  /*
    Status.
  */

  if(car.gear === "D"){

    $("driveStatus")
      .textContent =
      "DRIVE";

  }else if(car.gear === "R"){

    $("driveStatus")
      .textContent =
      "REVERSE";

  }else if(car.gear === "N"){

    $("driveStatus")
      .textContent =
      "NEUTRAL";

  }else{

    $("driveStatus")
      .textContent =
      "PARK";

  }

}

/* =====================================================
   MIRROR
===================================================== */

function updateMirror(){

  if(
    car.gear === "R"
  ){

    $("mirrorLabel")
      .textContent =
      "REVERSE CAMERA";

    $("rearVehicle")
      .style.opacity =
      ".25";

  }else{

    $("mirrorLabel")
      .textContent =
      "REAR VIEW";

    $("rearVehicle")
      .style.opacity =
      ".8";

  }

}

/* =====================================================
   SETTINGS
===================================================== */

$("settingsButton")
.addEventListener(
  "click",
  () => {

    $("settings")
      .classList.add("open");

  }
);

$("closeSettings")
.addEventListener(
  "click",
  () => {

    $("settings")
      .classList.remove("open");

  }
);

document
.querySelectorAll(
  "[data-setting]"
)
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const setting =
        button.dataset.setting;

      car[setting] =
        !car[setting];

      button.textContent =
        car[setting]
          ? "ON"
          : "OFF";

      if(
        setting === "night"
      ){

        document.body
          .classList.toggle(
            "night",
            car.night
          );

      }

    }
  );

});

/* =====================================================
   EXIT
===================================================== */

$("exit")
.addEventListener(
  "click",
  () => {

    car.throttle = 0;
    car.brake = .8;
    car.gear = "P";

    document
    .querySelectorAll(".gearButton")
    .forEach(button =>
      button.classList.toggle(
        "active",
        button.dataset.gear === "P"
      )
    );

    $("gearDisplayValue")
      .textContent = "P";

    showMessage(
      "VEHICLE PARKED"
    );

    setTimeout(
      () => car.brake = 0,
      500
    );

  }
);

/* =====================================================
   MIRROR BUTTON
===================================================== */

$("mirrorButton")
.addEventListener(
  "click",
  () => {

    showMessage(
      "REAR VIEW ACTIVE"
    );

    $("mirror")
      .style.boxShadow =
      "0 0 28px rgba(100,220,255,.55)";

    setTimeout(
      () => {

        $("mirror")
          .style.boxShadow =
          "0 7px 22px rgba(0,0,0,.45)";

      },
      800
    );

  }
);

/* =====================================================
   MAP BUTTON
===================================================== */

$("mapButton")
.addEventListener(
  "click",
  () => {

    showMessage(
      "MAP MODE COMING SOON"
    );

  }
);

/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

window.addEventListener(
  "keydown",
  event => {

    const key =
      event.key.toLowerCase();

    if(key === "w")
      car.throttle = 1;

    if(key === "s")
      car.brake = 1;

    if(key === "a")
      car.steering = -1;

    if(key === "d")
      car.steering = 1;

    if(
      key === "r" &&
      Math.abs(car.speed) < 3
    ){

      car.gear = "R";

    }

    if(
      key === "n" &&
      Math.abs(car.speed) < 3
    ){

      car.gear = "N";

    }

    if(
      key === "p" &&
      Math.abs(car.speed) < 3
    ){

      car.gear = "P";

    }

    if(
      key === "f" &&
      Math.abs(car.speed) < 3
    ){

      car.gear = "D";

    }

  }
);

window.addEventListener(
  "keyup",
  event => {

    const key =
      event.key.toLowerCase();

    if(key === "w")
      car.throttle = 0;

    if(key === "s")
      car.brake = 0;

    if(
      key === "a" ||
      key === "d"
    ){

      car.steering = 0;

    }

  }
);

/* =====================================================
   ROAD MARKS
===================================================== */

for(
  let i = 0;
  i < 7;
  i++
){

  const mark =
    document.createElement("div");

  mark.className =
    "roadMark";

  mark.style.top =
    (
      i * 95
    ) + "px";

  $("centreLine")
    .appendChild(mark);

}

/* =====================================================
   GAME LOOP
===================================================== */

let previous =
  performance.now();

function gameLoop(time){

  const dt =
    Math.min(
      .05,
      (time - previous) / 1000
    );

  previous =
    time;

  physics(dt);
  updateRoad(dt);
  updateDashboard();
  updateMirror();

  requestAnimationFrame(
    gameLoop
  );

}

requestAnimationFrame(
  gameLoop
);

/* =====================================================
   START
===================================================== */

setTimeout(
  () => {

    showMessage(
      "WAYFLO • COCKPIT READY"
    );

  },
  700
);

</script>

</body>

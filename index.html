<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>WAYFLO Driving Simulator</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05090d;
  color: #f4f7fa;
  font-family: Arial, Helvetica, sans-serif;
  user-select: none;
  touch-action: manipulation;
}

button {
  font: inherit;
  color: inherit;
  border: 0;
  cursor: pointer;
}

/* =========================
   APP
========================= */

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  min-height: 420px;
  overflow: hidden;
  background: #05090d;
}

/* =========================
   ROAD / WORLD
========================= */

#world {
  position: absolute;
  inset: 0 0 42%;
  overflow: hidden;
  background:
    linear-gradient(
      to bottom,
      #79bddb 0%,
      #a8d9e9 42%,
      #8b9b84 43%,
      #7d8b76 100%
    );
}

#horizon {
  position: absolute;
  left: 0;
  right: 0;
  top: 42%;
  height: 2px;
  background: rgba(255,255,255,.12);
}

#road {
  position: absolute;
  left: 50%;
  bottom: -5%;
  width: min(76vw, 900px);
  height: 125%;
  transform: translateX(-50%);
  background: #30363a;
  clip-path: polygon(
    43% 0,
    57% 0,
    100% 100%,
    0 100%
  );
}

#road::before,
#road::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 6px;
  background: #fff;
}

#road::before {
  left: 20%;
}

#road::after {
  right: 20%;
}

#lane {
  position: absolute;
  left: 50%;
  top: 0;
  width: 7px;
  height: 100%;
  transform: translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 42px,
      transparent 42px 78px
    );
}

/* =========================
   TREES
========================= */

.tree {
  position: absolute;
  bottom: 12%;
  width: 105px;
  height: 150px;
}

.tree::before {
  content: "";
  position: absolute;
  left: 45px;
  bottom: 0;
  width: 20px;
  height: 70px;
  background: #705437;
}

.tree::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 45px;
  width: 105px;
  height: 85px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 25% 55%, #477650 0 34%, transparent 35%),
    radial-gradient(circle at 55% 35%, #356d48 0 38%, transparent 39%),
    radial-gradient(circle at 78% 60%, #3f744e 0 34%, transparent 35%);
}

.tree.left1 { left: 2%; transform: scale(.85); }
.tree.left2 { left: 10%; transform: scale(.65); bottom: 8%; }
.tree.left3 { left: 15%; transform: scale(.55); bottom: 10%; }

.tree.right1 { right: 2%; transform: scale(.85); }
.tree.right2 { right: 10%; transform: scale(.65); bottom: 8%; }
.tree.right3 { right: 15%; transform: scale(.55); bottom: 10%; }

/* =========================
   TOP UI
========================= */

#brand {
  position: absolute;
  top: 3%;
  left: 2%;
  z-index: 20;
  padding: 22px 28px;
  min-width: 355px;
  border-radius: 28px;
  background: rgba(20, 48, 66, .92);
  box-shadow: 0 16px 30px rgba(0,0,0,.25);
}

#brand strong {
  display: block;
  font-size: clamp(24px, 3vw, 38px);
  letter-spacing: 3px;
}

#status {
  margin-top: 10px;
  font-size: 18px;
  color: #d9e5eb;
}

#status::first-letter {
  color: #5be27d;
}

.topButton {
  position: absolute;
  z-index: 20;
  top: 3%;
  width: 135px;
  height: 115px;
  border-radius: 28px;
  background: rgba(20,48,66,.92);
  box-shadow: 0 16px 30px rgba(0,0,0,.25);
  font-weight: 700;
  letter-spacing: 2px;
}

#mirrorBtn {
  right: 11%;
}

#settingsBtn {
  right: 2%;
}

#exitBtn {
  position: absolute;
  z-index: 20;
  top: 19%;
  left: 2%;
  width: 135px;
  height: 105px;
  border-radius: 28px;
  background: rgba(20,48,66,.92);
  font-weight: 700;
  letter-spacing: 2px;
}

/* =========================
   MIRROR
========================= */

#mirror {
  position: absolute;
  z-index: 15;
  top: 3%;
  left: 50%;
  width: min(42vw, 730px);
  height: 125px;
  transform: translateX(-50%);
  overflow: hidden;
  border: 8px solid #071015;
  border-radius: 35px;
  background:
    linear-gradient(
      to bottom,
      #8fcce1 0 48%,
      #899783 49% 100%
    );
  box-shadow: 0 14px 25px rgba(0,0,0,.3);
}

#mirrorRoad {
  position: absolute;
  left: 50%;
  bottom: -10px;
  width: 170px;
  height: 90px;
  transform: translateX(-50%);
  background: #30363a;
  clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
}

#mirrorLane {
  position: absolute;
  left: 50%;
  top: 0;
  width: 5px;
  height: 100%;
  transform: translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      white 0 20px,
      transparent 20px 32px
    );
}

/* =========================
   DASHBOARD
========================= */

#dashboard {
  position: absolute;
  z-index: 10;
  left: 0;
  right: 0;
  bottom: 0;
  height: 42%;
  min-height: 250px;
  background: #03070a;
  border-top: 1px solid #101820;
}

#gauges {
  position: absolute;
  top: 14px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 35px;
}

.gauge {
  width: 125px;
  height: 125px;
  border: 8px solid #161d22;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #05090c;
  box-shadow: inset 0 0 0 7px #0b1014;
}

.gaugeValue {
  font-size: 38px;
  font-weight: 700;
}

.gaugeUnit {
  margin-top: 2px;
  color: #9ba6ad;
  font-size: 13px;
  letter-spacing: 1px;
}

#gearDisplay {
  width: 92px;
  height: 92px;
  border: 6px solid #171f24;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #060a0d;
  font-size: 38px;
  font-weight: 700;
}

#statusLine {
  position: absolute;
  top: 160px;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  color: #cbd2d7;
  font-size: 18px;
}

#ready {
  color: #57df78;
}

/* =========================
   STEERING
========================= */

#steering {
  position: absolute;
  left: 3%;
  bottom: 7%;
  width: 225px;
  height: 225px;
  border: 15px solid #242d33;
  border-radius: 50%;
  background: #080d11;
  box-shadow:
    inset 0 0 0 12px #11181d,
    0 8px 20px rgba(0,0,0,.3);
  transition: transform .08s linear;
}

#steering::before {
  content: "";
  position: absolute;
  inset: 45px;
  border: 4px solid #151c20;
  border-radius: 50%;
}

#steeringText {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  letter-spacing: 2px;
  transform: rotate(-8deg);
}

/* =========================
   GEAR SELECTOR
========================= */

#gears {
  position: absolute;
  left: 50%;
  bottom: 7%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.gearButton {
  width: 95px;
  height: 55px;
  border: 3px solid #172027;
  border-radius: 15px;
  background: #05090c;
  font-size: 23px;
  font-weight: 700;
}

.gearButton.active {
  background: #4f8eb0;
  border-color: #78c6ec;
}

/* =========================
   PEDALS
========================= */

#pedals {
  position: absolute;
  right: 3%;
  bottom: 7%;
  display: flex;
  gap: 20px;
}

.pedal {
  width: 150px;
  height: 180px;
  border: 3px solid;
  border-radius: 35px;
  background: #070b0e;
  padding-top: 20px;
  text-align: center;
  font-weight: 700;
  letter-spacing: 3px;
}

#brake {
  border-color: #b84f4f;
}

#accel {
  border-color: #179cc9;
}

.pedalTrack {
  width: 62px;
  height: 105px;
  margin: 12px auto 5px;
  border-radius: 35px;
  background: #11181d;
  border: 2px solid #202a30;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.pedalFill {
  width: 100%;
  height: 0%;
  background: #667b87;
  transition: height .05s linear;
}

/* =========================
   SWITCHES
========================= */

#switches {
  position: absolute;
  left: 1%;
  right: 1%;
  bottom: 1%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 14px;
}

.switch {
  height: 72px;
  border: 3px solid #172127;
  border-radius: 18px;
  background: #050a0d;
  font-size: 17px;
  font-weight: 700;
}

.switch.active {
  background: #1c303b;
  border-color: #5c879c;
}

.switchIcon {
  display: block;
  font-size: 23px;
  margin-bottom: 3px;
}

/* =========================
   MIRROR STATE
========================= */

#mirror.overlay {
  background:
    linear-gradient(
      to bottom,
      #6f9aaa 0 48%,
      #667161 49% 100%
    );
}

/* =========================
   SETTINGS
========================= */

#settingsPanel {
  position: absolute;
  z-index: 100;
  right: 2%;
  top: 20%;
  width: min(340px, 90vw);
  padding: 25px;
  border-radius: 25px;
  background: #10181e;
  border: 2px solid #29343c;
  box-shadow: 0 20px 50px rgba(0,0,0,.5);
  display: none;
}

#settingsPanel.open {
  display: block;
}

#settingsPanel h2 {
  margin-top: 0;
}

.settingRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 0;
  border-bottom: 1px solid #263139;
}

.closeSettings {
  width: 100%;
  margin-top: 20px;
  padding: 14px;
  border-radius: 12px;
  background: #24333d;
}

/* =========================
   RESPONSIVE LANDSCAPE
========================= */

@media (orientation: landscape) {

  #world {
    inset: 0 0 48%;
  }

  #dashboard {
    height: 48%;
  }

  #mirror {
    top: 4%;
    width: 40vw;
    height: 120px;
  }

  #brand {
    top: 4%;
    min-width: 300px;
    padding: 18px 25px;
  }

  #exitBtn {
    top: 20%;
  }

  #gauges {
    top: 8px;
    gap: 20px;
  }

  .gauge {
    width: 78px;
    height: 78px;
    border-width: 6px;
  }

  .gaugeValue {
    font-size: 23px;
  }

  .gaugeUnit {
    font-size: 9px;
  }

  #gearDisplay {
    width: 66px;
    height: 66px;
    font-size: 28px;
  }

  #statusLine {
    top: 94px;
    font-size: 15px;
  }

  #steering {
    width: 155px;
    height: 155px;
    left: 2%;
    bottom: 9%;
    border-width: 10px;
  }

  #steering::before {
    inset: 30px;
  }

  #gears {
    bottom: 8%;
  }

  .gearButton {
    width: 95px;
    height: 48px;
  }

  #pedals {
    bottom: 9%;
    right: 2%;
  }

  .pedal {
    width: 135px;
    height: 165px;
  }

  #switches {
    bottom: 1%;
    gap: 8px;
  }

  .switch {
    height: 58px;
    font-size: 13px;
  }

  .switchIcon {
    font-size: 18px;
  }
}

/* =========================
   SMALL PORTRAIT
========================= */

@media (orientation: portrait) and (max-width: 600px) {

  #world {
    inset: 0 0 45%;
  }

  #dashboard {
    height: 45%;
  }

  #brand {
    min-width: 0;
    width: 45%;
    padding: 14px 18px;
    border-radius: 20px;
  }

  #brand strong {
    font-size: 20px;
  }

  #status {
    font-size: 12px;
  }

  .topButton {
    width: 90px;
    height: 90px;
    border-radius: 22px;
    font-size: 12px;
  }

  #mirrorBtn {
    right: 20%;
  }

  #settingsBtn {
    right: 2%;
  }

  #exitBtn {
    width: 90px;
    height: 80px;
    top: 18%;
    font-size: 12px;
  }

  #mirror {
    width: 52vw;
    height: 100px;
  }

  #gauges {
    gap: 10px;
  }

  .gauge {
    width: 85px;
    height: 85px;
  }

  .gaugeValue {
    font-size: 25px;
  }

  #gearDisplay {
    width: 65px;
    height: 65px;
    font-size: 25px;
  }

  #statusLine {
    top: 105px;
    font-size: 12px;
  }

  #steering {
    width: 125px;
    height: 125px;
    left: 4%;
    bottom: 11%;
    border-width: 9px;
  }

  #steering::before {
    inset: 25px;
  }

  #steeringText {
    font-size: 12px;
  }

  #gears {
    bottom: 11%;
  }

  .gearButton {
    width: 70px;
    height: 42px;
    font-size: 17px;
  }

  #pedals {
    right: 3%;
    gap: 8px;
    bottom: 11%;
  }

  .pedal {
    width: 82px;
    height: 135px;
    font-size: 12px;
    border-radius: 20px;
  }

  .pedalTrack {
    width: 38px;
    height: 75px;
  }

  #switches {
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
  }

  .switch {
    height: 48px;
    border-radius: 10px;
    font-size: 8px;
  }

  .switchIcon {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div id="app">

  <!-- WORLD -->
  <section id="world">

    <div id="horizon"></div>

    <div class="tree left1"></div>
    <div class="tree left2"></div>
    <div class="tree left3"></div>

    <div class="tree right1"></div>
    <div class="tree right2"></div>
    <div class="tree right3"></div>

    <div id="road">
      <div id="lane"></div>
    </div>

    <!-- MIRROR -->
    <div id="mirror">
      <div id="mirrorRoad">
        <div id="mirrorLane"></div>
      </div>
    </div>

    <!-- TOP CONTROLS -->
    <div id="brand">
      <strong>WAYFLO</strong>
      <div id="status">● SYSTEM READY</div>
    </div>

    <button class="topButton" id="mirrorBtn">
      ◉<br>
      MIRROR
    </button>

    <button class="topButton" id="settingsBtn">
      ⚙<br>
      SETTINGS
    </button>

    <button id="exitBtn">EXIT</button>

  </section>

  <!-- DASHBOARD -->
  <section id="dashboard">

    <div id="gauges">

      <div class="gauge">
        <div class="gaugeValue" id="speed">0</div>
        <div class="gaugeUnit">KM/H</div>
      </div>

      <div class="gauge">
        <div class="gaugeValue" id="rpm">0</div>
        <div class="gaugeUnit">RPM</div>
      </div>

      <div id="gearDisplay">N</div>

    </div>

    <div id="statusLine">
      <span id="engineState">ENGINE OFF</span>
      <span> • </span>
      <span>STEER <span id="steerValue">0</span>°</span>
      <span> • </span>
      <span id="ready">READY</span>
    </div>

    <!-- STEERING -->
    <div id="steering">
      <div id="steeringText">WAYFLO</div>
    </div>

    <!-- GEARS -->
    <div id="gears">
      <button class="gearButton" data-gear="R">R</button>
      <button class="gearButton active" data-gear="N">N</button>
      <button class="gearButton" data-gear="D">D</button>
    </div>

    <!-- PEDALS -->
    <div id="pedals">

      <button class="pedal" id="brake">
        BRAKE
        <div class="pedalTrack">
          <div class="pedalFill" id="brakeFill"></div>
        </div>
        <span id="brakeValue">0%</span>
      </button>

      <button class="pedal" id="accel">
        ACCEL
        <div class="pedalTrack">
          <div class="pedalFill" id="accelFill"></div>
        </div>
        <span id="accelValue">0%</span>
      </button>

    </div>

    <!-- SWITCHES -->
    <div id="switches">

      <button class="switch" data-switch="lights">
        <span class="switchIcon">☼</span>
        LIGHTS
      </button>

      <button class="switch" data-switch="hazard">
        <span class="switchIcon">⚠</span>
        HAZARD
      </button>

      <button class="switch" data-switch="park">
        <span class="switchIcon">P</span>
        PARK
      </button>

      <button class="switch" data-switch="abs">
        <span class="switchIcon">A</span>
        ABS
      </button>

      <button class="switch" data-switch="traction">
        <span class="switchIcon">T</span>
        TRACTION
      </button>

      <button class="switch" id="engineBtn">
        <span class="switchIcon">ϟ</span>
        ENGINE
      </button>

    </div>

  </section>

  <!-- SETTINGS -->
  <div id="settingsPanel">

    <h2>WAYFLO SETTINGS</h2>

    <div class="settingRow">
      <span>Engine</span>
      <span id="settingEngine">OFF</span>
    </div>

    <div class="settingRow">
      <span>Gear</span>
      <span id="settingGear">N</span>
    </div>

    <div class="settingRow">
      <span>Steering</span>
      <span id="settingSteer">0°</span>
    </div>

    <button class="closeSettings" id="closeSettings">
      CLOSE
    </button>

  </div>

</div>

<script>
/* =========================================================
   WAYFLO STATE
========================================================= */

const state = {
  engineOn: false,
  gear: "N",

  speed: 0,
  rpm: 0,

  steering: 0,
  steeringTarget: 0,

  accel: 0,
  brake: 0,

  mirror: false,

  switches: {
    lights: false,
    hazard: false,
    park: false,
    abs: false,
    traction: false
  }
};


/* =========================================================
   ELEMENTS
========================================================= */

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const gearDisplay = document.getElementById("gearDisplay");

const engineStateEl = document.getElementById("engineState");
const steerValueEl = document.getElementById("steerValue");

const steeringEl = document.getElementById("steering");

const accelFill = document.getElementById("accelFill");
const brakeFill = document.getElementById("brakeFill");

const accelValue = document.getElementById("accelValue");
const brakeValue = document.getElementById("brakeValue");

const mirrorEl = document.getElementById("mirror");

const settingsPanel = document.getElementById("settingsPanel");
const settingEngine = document.getElementById("settingEngine");
const settingGear = document.getElementById("settingGear");
const settingSteer = document.getElementById("settingSteer");


/* =========================================================
   ENGINE
========================================================= */

document.getElementById("engineBtn").addEventListener("click", () => {

  state.engineOn = !state.engineOn;

  if (!state.engineOn) {
    state.speed = 0;
    state.rpm = 0;
    state.accel = 0;
  } else {
    state.rpm = 800;
  }

  updateUI();
});


/* =========================================================
   GEARS
========================================================= */

document.querySelectorAll(".gearButton").forEach(button => {

  button.addEventListener("click", () => {

    state.gear = button.dataset.gear;

    document.querySelectorAll(".gearButton").forEach(b => {
      b.classList.toggle(
        "active",
        b.dataset.gear === state.gear
      );
    });

    gearDisplay.textContent = state.gear;

    updateUI();
  });

});


/* =========================================================
   ACCELERATOR
========================================================= */

function setAccel(value) {

  state.accel = Math.max(0, Math.min(100, value));

}

function setBrake(value) {

  state.brake = Math.max(0, Math.min(100, value));

}


/* Mouse / touch pedal controls */

function pedalControl(element, setter) {

  const start = event => {

    event.preventDefault();

    const rect = element.getBoundingClientRect();

    const move = e => {

      const point =
        e.touches ? e.touches[0] : e;

      const y = point.clientY;

      const amount =
        1 - ((y - rect.top) / rect.height);

      setter(amount * 100);
    };

    const end = () => {

      setter(0);

      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", end);

      document.removeEventListener("touchmove", move);
      document.removeEventListener("touchend", end);
    };

    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", end);

    document.addEventListener("touchmove", move, {
      passive: false
    });

    document.addEventListener("touchend", end);

    move(event);
  };

  element.addEventListener("mousedown", start);
  element.addEventListener("touchstart", start, {
    passive: false
  });
}

pedalControl(
  document.getElementById("accel"),
  setAccel
);

pedalControl(
  document.getElementById("brake"),
  setBrake
);


/* =========================================================
   STEERING
========================================================= */

let steeringPointerActive = false;

function updateSteeringFromPointer(clientX) {

  const rect = steeringEl.getBoundingClientRect();

  const centerX =
    rect.left + rect.width / 2;

  const offset =
    clientX - centerX;

  const normalized =
    offset / (rect.width / 2);

  state.steeringTarget =
    Math.max(-45, Math.min(45, normalized * 45));
}

steeringEl.addEventListener("pointerdown", e => {

  steeringPointerActive = true;

  steeringEl.setPointerCapture(e.pointerId);

  updateSteeringFromPointer(e.clientX);

});

steeringEl.addEventListener("pointermove", e => {

  if (!steeringPointerActive) return;

  updateSteeringFromPointer(e.clientX);

});

steeringEl.addEventListener("pointerup", () => {

  steeringPointerActive = false;

  /*
   IMPORTANT:
   When released, the steering target returns to
   center instead of remaining stuck at the last angle.
  */
  state.steeringTarget = 0;

});

steeringEl.addEventListener("pointercancel", () => {

  steeringPointerActive = false;
  state.steeringTarget = 0;

});


/* =========================================================
   MIRROR
========================================================= */

document.getElementById("mirrorBtn")
  .addEventListener("click", () => {

    state.mirror = !state.mirror;

    mirrorEl.classList.toggle(
      "overlay",
      state.mirror
    );

  });


/* =========================================================
   SETTINGS
========================================================= */

document.getElementById("settingsBtn")
  .addEventListener("click", () => {

    settingsPanel.classList.toggle("open");

  });

document.getElementById("closeSettings")
  .addEventListener("click", () => {

    settingsPanel.classList.remove("open");

  });


/* =========================================================
   SWITCHES
========================================================= */

document.querySelectorAll(".switch[data-switch]")
  .forEach(button => {

    button.addEventListener("click", () => {

      const key = button.dataset.switch;

      state.switches[key] =
        !state.switches[key];

      button.classList.toggle(
        "active",
        state.switches[key]
      );

    });

  });


/* =========================================================
   PHYSICS
========================================================= */

let lastTime = performance.now();

function physics(now) {

  const dt =
    Math.min((now - lastTime) / 1000, 0.05);

  lastTime = now;


  /*
   ENGINE OFF
   ----------------
   Speed and RPM are forced toward zero.
   This prevents the old bug where the car displayed
   hundreds of KM/H while the engine was OFF.
  */

  if (!state.engineOn) {

    state.speed *= Math.pow(0.001, dt);

    if (state.speed < 0.5) {
      state.speed = 0;
    }

    state.rpm *= Math.pow(0.001, dt);

    if (state.rpm < 1) {
      state.rpm = 0;
    }

  }

  /*
   ENGINE ON
   ----------------
   Simple arcade physics.
  */

  else {

    const drivingGear =
      state.gear === "D" ||
      state.gear === "R";

    if (drivingGear) {

      const acceleration =
        state.accel * 0.045;

      const braking =
        state.brake * 0.08;

      if (state.gear === "D") {
        state.speed += acceleration;
      }

      if (state.gear === "R") {
        state.speed += acceleration * 0.55;
      }

      state.speed -= braking;

      /*
       Natural rolling resistance.
      */
      state.speed -=
        state.speed * 0.018;

    } else {

      state.speed -=
        state.speed * 0.05;

    }

    state.speed =
      Math.max(0, Math.min(260, state.speed));

    /*
     RPM follows throttle/speed.
    */

    const targetRPM =
      750 +
      state.accel * 45 +
      state.speed * 25;

    state.rpm +=
      (targetRPM - state.rpm) *
      Math.min(1, dt * 6);

  }


  /*
   STEERING RETURN-TO-CENTER
   -------------------------
   Smoothly returns to zero whenever the
   steering wheel is released.
  */

  const steeringReturnSpeed = 8;

  state.steering +=
    (state.steeringTarget - state.steering) *
    Math.min(1, dt * steeringReturnSpeed);


  updateUI();

  requestAnimationFrame(physics);
}


/* =========================================================
   UI
========================================================= */

function updateUI() {

  /*
   Engine OFF must ALWAYS display zero.
  */

  const displaySpeed =
    state.engineOn
      ? Math.round(state.speed)
      : 0;

  const displayRPM =
    state.engineOn
      ? Math.round(state.rpm)
      : 0;

  speedEl.textContent =
    displaySpeed;

  rpmEl.textContent =
    displayRPM;

  gearDisplay.textContent =
    state.gear;

  engineStateEl.textContent =
    state.engineOn
      ? "ENGINE ON"
      : "ENGINE OFF";

  steerValueEl.textContent =
    Math.round(state.steering);

  steeringEl.style.transform =
    `rotate(${state.steering}deg)`;

  accelFill.style.height =
    `${state.accel}%`;

  brakeFill.style.height =
    `${state.brake}%`;

  accelValue.textContent =
    `${Math.round(state.accel)}%`;

  brakeValue.textContent =
    `${Math.round(state.brake)}%`;

  settingEngine.textContent =
    state.engineOn ? "ON" : "OFF";

  settingGear.textContent =
    state.gear;

  settingSteer.textContent =
    `${Math.round(state.steering)}°`;

}


/* =========================================================
   KEYBOARD SUPPORT
========================================================= */

document.addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") {
    state.steeringTarget = -45;
  }

  if (e.key === "ArrowRight") {
    state.steeringTarget = 45;
  }

  if (e.key === "ArrowUp") {
    state.accel = 100;
  }

  if (e.key === "ArrowDown") {
    state.brake = 100;
  }

  if (e.key.toLowerCase() === "e") {
    document.getElementById("engineBtn").click();
  }

  if (e.key.toLowerCase() === "r") {
    document.querySelector('[data-gear="R"]').click();
  }

  if (e.key.toLowerCase() === "n") {
    document.querySelector('[data-gear="N"]').click();
  }

  if (e.key.toLowerCase() === "d") {
    document.querySelector('[data-gear="D"]').click();
  }

});

document.addEventListener("keyup", e => {

  if (
    e.key === "ArrowLeft" ||
    e.key === "ArrowRight"
  ) {
    state.steeringTarget = 0;
  }

  if (e.key === "ArrowUp") {
    state.accel = 0;
  }

  if (e.key === "ArrowDown") {
    state.brake = 0;
  }

});


/* =========================================================
   START
========================================================= */

updateUI();

requestAnimationFrame(physics);

</script>

</body>
</html>

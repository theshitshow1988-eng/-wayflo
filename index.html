<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>WAYFLO World Simulator</title>

<style>
:root{
  --glass:rgba(8,15,21,.78);
  --glass2:rgba(15,25,32,.88);
  --line:rgba(255,255,255,.22);
  --text:#f4f7f8;
  --muted:#aeb8bd;
  --green:#36d978;
  --blue:#37bde8;
  --red:#ff5b58;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050a0e;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#071016;
}

/* =========================================================
   WORLD / WINDSCREEN
   ========================================================= */

#world{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:58%;
  overflow:hidden;
  background:
    linear-gradient(#69b9df 0%,
                    #9ed7e8 55%,
                    #8b9c83 56%,
                    #71836c 100%);
}

.sun{
  position:absolute;
  width:90px;
  height:90px;
  right:9%;
  top:19%;
  border-radius:50%;
  background:#fff0a4;
  box-shadow:0 0 35px rgba(255,240,164,.45);
}

.horizon{
  position:absolute;
  left:-10%;
  width:120%;
  bottom:38%;
  height:22%;
  background:#788a78;
  border-radius:50% 50% 0 0;
}

.tree{
  position:absolute;
  bottom:18%;
  width:90px;
  height:150px;
}

.tree:before{
  content:"";
  position:absolute;
  left:39px;
  bottom:0;
  width:15px;
  height:65px;
  background:#66492f;
}

.tree:after{
  content:"";
  position:absolute;
  left:5px;
  bottom:42px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:#2f6640;
  box-shadow:
    35px -18px 0 10px #356d43,
    -25px 8px 0 4px #376f44;
}

.tree.t1{left:2%;transform:scale(.8)}
.tree.t2{left:17%;transform:scale(.55)}
.tree.t3{right:7%;transform:scale(1.1)}
.tree.t4{right:22%;transform:scale(.65)}

.road{
  position:absolute;
  left:50%;
  bottom:-4%;
  width:78%;
  height:61%;
  transform:translateX(-50%);
  background:#33393c;
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
}

.road:before,
.road:after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:5px;
  background:white;
}

.road:before{left:22%}
.road:after{right:22%}

.lane{
  position:absolute;
  left:50%;
  top:2%;
  width:5px;
  height:100%;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    to bottom,
    white 0 38px,
    transparent 38px 78px
  );
  opacity:.95;
}

/* =========================================================
   MIRROR
   ========================================================= */

#mirror{
  position:absolute;
  z-index:8;
  top:7%;
  left:50%;
  width:min(52%,520px);
  height:100px;
  transform:translateX(-50%);
  border:6px solid #0a0d0f;
  border-radius:30px;
  background:
    linear-gradient(#8dc9df,#b5d9d9 58%,#596958 59%);
  overflow:hidden;
  box-shadow:0 12px 24px rgba(0,0,0,.35);
}

.mirror-road{
  position:absolute;
  left:50%;
  bottom:-10px;
  width:30%;
  height:75%;
  transform:translateX(-50%);
  background:#3c4243;
  clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);
}

.mirror-road:after{
  content:"";
  position:absolute;
  left:50%;
  top:12%;
  width:3px;
  height:90%;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    to bottom,
    white 0 15px,
    transparent 15px 28px
  );
}

/* =========================================================
   TOP HUD
   ========================================================= */

#vehicleCard{
  position:absolute;
  z-index:20;
  left:20px;
  top:18px;
  width:275px;
  padding:18px 20px;
  border-radius:20px;
  background:var(--glass);
  border:1px solid var(--line);
  box-shadow:0 10px 25px rgba(0,0,0,.22);
}

.vehicle-title{
  font-size:22px;
  font-weight:800;
  letter-spacing:3px;
}

.condition{
  margin-top:12px;
  font-size:15px;
  color:#d8dfe2;
}

.condition span{
  color:var(--green);
}

.topButtons{
  position:absolute;
  z-index:21;
  right:20px;
  top:18px;
  display:flex;
  gap:12px;
}

.topBtn,
.exitBtn{
  background:var(--glass);
  border:1px solid var(--line);
  border-radius:18px;
  min-width:92px;
  height:92px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.topBtn .icon,
.exitBtn .icon{
  font-size:30px;
}

.topBtn small,
.exitBtn small{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
}

#exit{
  position:absolute;
  z-index:20;
  left:20px;
  top:150px;
}

/* =========================================================
   COCKPIT
   ========================================================= */

#cockpit{
  position:absolute;
  z-index:30;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  min-height:300px;
  background:
    linear-gradient(
      rgba(2,7,10,.88),
      rgba(3,8,12,.98)
    );
  border-top:1px solid rgba(255,255,255,.08);
}

/* =========================================================
   DASHBOARD
   ========================================================= */

#dashboard{
  position:absolute;
  top:15px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  align-items:center;
  gap:18px;
  white-space:nowrap;
}

.gauge{
  width:86px;
  height:86px;
  border-radius:50%;
  border:5px solid #20292e;
  box-shadow:
    inset 0 0 0 2px #080c0f,
    0 0 0 1px #485158;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:#060b0e;
}

.gauge .value{
  font-size:28px;
  font-weight:800;
}

.gauge .unit{
  font-size:9px;
  color:#aeb7bb;
  letter-spacing:1px;
}

#gearDisplay{
  width:70px;
  height:70px;
  border:5px solid #20292e;
  border-radius:14px;
  background:#05090c;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:800;
}

.status{
  position:absolute;
  top:108px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:14px;
  color:#bdc7cb;
}

.ready{
  color:var(--green);
}

/* =========================================================
   STEERING
   ========================================================= */

#steeringArea{
  position:absolute;
  left:25px;
  bottom:70px;
  width:180px;
  height:180px;
}

#steering{
  position:absolute;
  inset:0;
  border-radius:50%;
  border:12px solid rgba(150,160,166,.22);
  background:rgba(10,15,19,.45);
  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.07),
    0 8px 20px rgba(0,0,0,.3);
  touch-action:none;
}

#steeringRing{
  position:absolute;
  inset:24px;
  border:5px solid rgba(255,255,255,.16);
  border-radius:50%;
}

#steeringHub{
  position:absolute;
  left:50%;
  top:50%;
  width:78px;
  height:78px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#11191e;
  border:8px solid #283137;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  top:50%;
  font-size:30px;
  color:#e8eef0;
  transform:translateY(-50%);
}

.steerArrow.left{left:8px}
.steerArrow.right{right:8px}

/* =========================================================
   GEAR
   ========================================================= */

#gearSelector{
  position:absolute;
  left:50%;
  bottom:70px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  gap:6px;
}

.gear{
  width:70px;
  height:42px;
  border-radius:10px;
  background:#080d10;
  border:2px solid #222c32;
  font-size:17px;
  font-weight:700;
}

.gear.active{
  background:#397c97;
  border-color:#83d5ee;
}

/* =========================================================
   PEDALS
   ========================================================= */

#pedals{
  position:absolute;
  right:24px;
  bottom:70px;
  display:flex;
  gap:14px;
}

.pedal{
  position:relative;
  width:92px;
  height:190px;
  border-radius:20px;
  background:rgba(8,13,16,.8);
  border:2px solid;
  overflow:hidden;
  touch-action:none;
}

.pedal.brake{
  border-color:#b84d4b;
}

.pedal.accel{
  border-color:#31a8c9;
}

.pedalLabel{
  position:absolute;
  top:12px;
  left:0;
  right:0;
  text-align:center;
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
}

.pedalTrack{
  position:absolute;
  left:50%;
  top:45px;
  bottom:18px;
  width:36px;
  transform:translateX(-50%);
  border-radius:18px;
  background:#12191d;
  border:1px solid rgba(255,255,255,.08);
}

.pedalFill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  border-radius:18px;
  background:rgba(255,255,255,.13);
}

.pedalValue{
  position:absolute;
  bottom:7px;
  left:0;
  right:0;
  text-align:center;
  font-size:10px;
  color:#aeb7bb;
}

/* =========================================================
   UTILITY CONTROLS
   ========================================================= */

#utilities{
  position:absolute;
  left:14px;
  right:14px;
  bottom:10px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:8px;
}

.utility{
  height:58px;
  border-radius:14px;
  background:rgba(8,13,16,.85);
  border:1px solid rgba(255,255,255,.18);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
}

.utility .uicon{
  font-size:20px;
}

.utility span{
  font-size:9px;
  font-weight:800;
  letter-spacing:1px;
}

.utility.active{
  border-color:#64c9e5;
  background:rgba(39,91,110,.55);
}

#message{
  position:absolute;
  z-index:100;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  padding:12px 20px;
  border-radius:12px;
  background:rgba(0,0,0,.75);
  opacity:0;
  pointer-events:none;
  transition:.2s;
  font-size:14px;
}

#message.show{
  opacity:1;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:600px){

  #world{
    height:58%;
  }

  #vehicleCard{
    left:12px;
    top:12px;
    width:220px;
    padding:13px 15px;
  }

  .vehicle-title{
    font-size:17px;
    letter-spacing:2px;
  }

  .condition{
    margin-top:7px;
    font-size:12px;
  }

  .topButtons{
    right:12px;
    top:12px;
    gap:7px;
  }

  .topBtn{
    min-width:68px;
    width:68px;
    height:68px;
    border-radius:14px;
  }

  .topBtn .icon{
    font-size:22px;
  }

  .topBtn small{
    font-size:9px;
  }

  #exit{
    left:12px;
    top:110px;
  }

  .exitBtn{
    min-width:68px;
    width:68px;
    height:68px;
    border-radius:14px;
  }

  .exitBtn .icon{
    font-size:22px;
  }

  .exitBtn small{
    font-size:9px;
  }

  #mirror{
    top:18%;
    width:58%;
    height:76px;
    border-width:5px;
    border-radius:22px;
  }

  #dashboard{
    top:10px;
    gap:10px;
  }

  .gauge{
    width:68px;
    height:68px;
    border-width:4px;
  }

  .gauge .value{
    font-size:22px;
  }

  #gearDisplay{
    width:58px;
    height:58px;
    font-size:28px;
  }

  .status{
    top:86px;
    font-size:11px;
  }

  #steeringArea{
    left:18px;
    bottom:67px;
    width:145px;
    height:145px;
  }

  #steeringHub{
    width:62px;
    height:62px;
    font-size:11px;
  }

  .steerArrow{
    font-size:23px;
  }

  #gearSelector{
    bottom:68px;
  }

  .gear{
    width:58px;
    height:34px;
    font-size:14px;
  }

  #pedals{
    right:12px;
    bottom:67px;
    gap:8px;
  }

  .pedal{
    width:72px;
    height:155px;
    border-radius:15px;
  }

  .pedalLabel{
    font-size:10px;
  }

  #utilities{
    bottom:7px;
    gap:5px;
  }

  .utility{
    height:48px;
    border-radius:11px;
  }

  .utility .uicon{
    font-size:17px;
  }

  .utility span{
    font-size:7px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- WORLD -->
  <section id="world">

    <div class="sun"></div>

    <div class="horizon"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div class="road">
      <div class="lane"></div>
    </div>

    <!-- MIRROR -->
    <div id="mirror">
      <div class="mirror-road"></div>
    </div>

    <!-- TOP INFORMATION -->
    <div id="vehicleCard">
      <div class="vehicle-title">WAYFLO • VEHICLE 01</div>
      <div class="condition">
        <span>●</span> CONDITION <b id="condition">100%</b>
      </div>
    </div>

    <div class="topButtons">

      <button class="topBtn" id="mirrorBtn">
        <div class="icon">▱</div>
        <small>MIRROR</small>
      </button>

      <button class="topBtn" id="settingsBtn">
        <div class="icon">⚙️</div>
        <small>SETTINGS</small>
      </button>

    </div>

    <button class="exitBtn" id="exit">
      <div class="icon">↪</div>
      <small>EXIT</small>
    </button>

  </section>


  <!-- COCKPIT -->
  <section id="cockpit">

    <!-- DASHBOARD -->
    <div id="dashboard">

      <div class="gauge">
        <div class="value" id="speed">0</div>
        <div class="unit">KM/H</div>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <div class="value" id="rpm">800</div>
        <div class="unit">RPM</div>
      </div>

    </div>

    <div class="status">
      <span class="ready">● READY</span>
      &nbsp; • &nbsp;
      TEMP <span id="temp">88</span>°C
      &nbsp; • &nbsp;
      FUEL <span id="fuel">100</span>%
      &nbsp; • &nbsp;
      <span id="weather">☀ CLEAR</span>
    </div>


    <!-- STEERING -->
    <div id="steeringArea">

      <div id="steering">

        <div id="steeringRing"></div>

        <div class="steerArrow left">‹</div>
        <div class="steerArrow right">›</div>

        <div id="steeringHub">WAYFLO</div>

      </div>

    </div>


    <!-- GEAR SELECTOR -->
    <div id="gearSelector">

      <button class="gear" data-gear="P">P</button>
      <button class="gear" data-gear="R">R</button>
      <button class="gear" data-gear="N">N</button>
      <button class="gear active" data-gear="D">D</button>

    </div>


    <!-- PEDALS -->
    <div id="pedals">

      <div class="pedal brake" data-pedal="brake">

        <div class="pedalLabel">BRAKE</div>

        <div class="pedalTrack">
          <div class="pedalFill"></div>
        </div>

        <div class="pedalValue">0%</div>

      </div>


      <div class="pedal accel" data-pedal="accel">

        <div class="pedalLabel">ACCEL</div>

        <div class="pedalTrack">
          <div class="pedalFill"></div>
        </div>

        <div class="pedalValue">0%</div>

      </div>

    </div>


    <!-- UTILITY BUTTONS -->
    <div id="utilities">

      <button class="utility" id="lights">
        <div class="uicon">◉</div>
        <span>LIGHTS</span>
      </button>

      <button class="utility" id="leftIndicator">
        <div class="uicon">←</div>
        <span>LEFT</span>
      </button>

      <button class="utility" id="hazard">
        <div class="uicon">△</div>
        <span>HAZARD</span>
      </button>

      <button class="utility" id="rightIndicator">
        <div class="uicon">→</div>
        <span>RIGHT</span>
      </button>

      <button class="utility" id="wipers">
        <div class="uicon">◇</div>
        <span>WIPERS</span>
      </button>

      <button class="utility" id="map">
        <div class="uicon">□</div>
        <span>MAP</span>
      </button>

    </div>

  </section>

  <div id="message"></div>

</div>


<script>

/* =========================================================
   WAYFLO DRIVING ENGINE
   ========================================================= */

const state = {

  gear:"P",

  speed:0,

  rpm:800,

  temp:88,

  fuel:100,

  steering:0,

  accel:0,

  brake:0,

  lights:false,

  left:false,

  right:false,

  hazard:false,

  wipers:false,

  distance:0

};


/* ---------------------------------------------------------
   ELEMENTS
   --------------------------------------------------------- */

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const tempEl = document.getElementById("temp");
const fuelEl = document.getElementById("fuel");
const gearDisplay = document.getElementById("gearDisplay");
const conditionEl = document.getElementById("condition");
const road = document.querySelector(".road");
const mirror = document.getElementById("mirror");


/* ---------------------------------------------------------
   MESSAGE
   --------------------------------------------------------- */

let messageTimer;

function showMessage(text){

  const box = document.getElementById("message");

  box.textContent = text;
  box.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer = setTimeout(()=>{
    box.classList.remove("show");
  },1200);

}


/* ---------------------------------------------------------
   GEAR
   --------------------------------------------------------- */

document.querySelectorAll(".gear").forEach(button=>{

  button.addEventListener("click",()=>{

    const newGear = button.dataset.gear;

    /*
      Do not allow changing direction while moving quickly.
    */

    if(
      Math.abs(state.speed) > 2 &&
      (
        (state.gear==="D" && newGear==="R") ||
        (state.gear==="R" && newGear==="D")
      )
    ){

      showMessage("SLOW DOWN TO CHANGE DIRECTION");
      return;

    }

    state.gear = newGear;

    document.querySelectorAll(".gear")
      .forEach(g=>g.classList.remove("active"));

    button.classList.add("active");

    gearDisplay.textContent = newGear;

    showMessage("GEAR " + newGear);

  });

});


/* =========================================================
   TOUCH PEDALS
   ========================================================= */

function setupPedal(element){

  let active = false;

  function update(clientY){

    const rect = element.getBoundingClientRect();

    let value =
      (rect.bottom - clientY) /
      rect.height;

    value = Math.max(0,Math.min(1,value));

    const type = element.dataset.pedal;

    state[type] = value;

    const fill = element.querySelector(".pedalFill");
    const label = element.querySelector(".pedalValue");

    fill.style.height = (value*100)+"%";
    label.textContent = Math.round(value*100)+"%";

  }


  element.addEventListener("pointerdown",event=>{

    active=true;

    element.setPointerCapture(event.pointerId);

    update(event.clientY);

  });


  element.addEventListener("pointermove",event=>{

    if(active) update(event.clientY);

  });


  element.addEventListener("pointerup",()=>{

    active=false;

  });


  element.addEventListener("pointercancel",()=>{

    active=false;

  });

}


document
  .querySelectorAll(".pedal")
  .forEach(setupPedal);


/* =========================================================
   STEERING
   ========================================================= */

const steering = document.getElementById("steering");

let steeringPointer = null;

function updateSteering(clientX,clientY){

  const rect = steering.getBoundingClientRect();

  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  const dx = clientX-cx;
  const dy = clientY-cy;

  let angle =
    Math.atan2(dy,dx) *
    180 /
    Math.PI;

  /*
    Convert touch angle to a steering value.
  */

  let normalized = angle / 120;

  normalized =
    Math.max(-1,
      Math.min(1,normalized));

  /*
    Make left/right movement feel natural.
  */

  state.steering = normalized;

  steering.style.transform =
    "rotate(" +
    (state.steering*35) +
    "deg)";

}


steering.addEventListener("pointerdown",event=>{

  steeringPointer = event.pointerId;

  steering.setPointerCapture(event.pointerId);

  updateSteering(
    event.clientX,
    event.clientY
  );

});


steering.addEventListener("pointermove",event=>{

  if(event.pointerId===steeringPointer){

    updateSteering(
      event.clientX,
      event.clientY
    );

  }

});


function releaseSteering(){

  steeringPointer=null;

  /*
    Slowly return steering toward centre.
  */

}


steering.addEventListener(
  "pointerup",
  releaseSteering
);

steering.addEventListener(
  "pointercancel",
  releaseSteering
);

}

/* =========================================================
   DRIVING PHYSICS
   ========================================================= */

let lastTime = performance.now();


function updateDriving(dt){

  /*
    ACCELERATION
  */

  let engineForce =
    state.accel * 22;


  /*
    BRAKING
  */

  let brakeForce =
    state.brake * 38;


  /*
    FORWARD
  */

  if(state.gear==="D"){

    state.speed +=
      engineForce * dt;

    state.speed -=
      brakeForce * dt;

  }


  /*
    REVERSE
  */

  if(state.gear==="R"){

    state.speed -=
      engineForce * .65 * dt;

    state.speed +=
      brakeForce * dt;

  }


  /*
    NEUTRAL / PARK
  */

  if(
    state.gear==="N" ||
    state.gear==="P"
  ){

    state.speed *=
      Math.pow(.18,dt);

  }


  /*
    NATURAL ROLLING RESISTANCE
  */

  state.speed *=
    Math.pow(.985,dt*60);


  /*
    HARD SPEED LIMIT
  */

  state.speed =
    Math.max(-40,
      Math.min(160,state.speed));


  /*
    STOP AT ZERO
  */

  if(
    Math.abs(state.speed)<.15 &&
    state.accel<.05
  ){

    state.speed=0;

  }


  /*
    RPM
  */

  const speedAbs =
    Math.abs(state.speed);

  state.rpm =
    800 +
    state.accel*4200 +
    Math.min(speedAbs,120)*12;


  state.rpm =
    Math.min(6500,state.rpm);


  /*
    TEMPERATURE
  */

  if(state.accel>.7){

    state.temp +=
      .12*dt;

  }else{

    state.temp -=
      .035*dt;

  }

  state.temp =
    Math.max(88,
      Math.min(110,state.temp));


  /*
    FUEL
  */

  if(state.accel>.05){

    state.fuel -=
      state.accel*.004*dt;

  }

  state.fuel =
    Math.max(0,state.fuel);


  /*
    DISTANCE
  */

  state.distance +=
    Math.abs(state.speed) *
    dt /
    3600;


  /*
    ROAD MOVEMENT
  */

  const movement =
    state.speed * dt * .8;

  road.style.transform =
    "translateX(-50%) translateY(" +
    (movement*8) +
    "px)";


  /*
    STEERING EFFECT
  */

  const roadShift =
    state.steering *
    state.speed *
    dt *
    .65;

  road.style.marginLeft =
    roadShift + "px";


  /*
    RETURN STEERING TOWARD CENTRE
  */

  if(
    steeringPointer===null
  ){

    state.steering *=
      Math.pow(.04,dt);

    steering.style.transform =
      "rotate(" +
      (state.steering*35) +
      "deg)";

  }


  updateDashboard();

}


/* =========================================================
   DASHBOARD UPDATE
   ========================================================= */

function updateDashboard(){

  speedEl.textContent =
    Math.round(Math.abs(state.speed));

  rpmEl.textContent =
    Math.round(state.rpm);

  tempEl.textContent =
    Math.round(state.temp);

  fuelEl.textContent =
    Math.round(state.fuel);

  gearDisplay.textContent =
    state.gear;


  /*
    Small visual vehicle movement.
  */

  const steeringAmount =
    state.steering *
    Math.min(
      18,
      Math.abs(state.speed)/5
    );

  mirror.style.transform =
    "translateX(calc(-50% + " +
    steeringAmount +
    "px))";

}


/* =========================================================
   GAME LOOP
   ========================================================= */

function loop(now){

  let dt =
    (now-lastTime)/1000;

  lastTime=now;

  dt=Math.min(dt,.05);

  updateDriving(dt);

  requestAnimationFrame(loop);

}


requestAnimationFrame(loop);


/* =========================================================
   START
   ========================================================= */

showMessage("WAYFLO • COCKPIT READY");

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080a;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
  touch-action:none;
}

button{
  border:0;
  color:white;
  background:none;
  font:inherit;
  padding:0;
  touch-action:none;
}

/* =====================================================
   GAME
===================================================== */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#071016;
}

/* =====================================================
   WINDSHIELD / WORLD
===================================================== */

#world{
  position:absolute;
  inset:0 0 42% 0;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #5aa9d8 0%,
      #9bd4e9 55%,
      #9aaa86 56%,
      #596a50 100%
    );
}

#sun{
  position:absolute;
  width:95px;
  height:95px;
  right:12%;
  top:25%;
  border-radius:50%;
  background:#fff0a5;
  box-shadow:0 0 45px rgba(255,240,165,.55);
}

.hill{
  position:absolute;
  left:-20%;
  bottom:20%;
  width:140%;
  height:24%;
  border-radius:50% 50% 0 0;
  background:#758b92;
}

.hill.two{
  bottom:15%;
  background:#7f9475;
  transform:scaleX(1.15);
}

/* Trees */

.tree{
  position:absolute;
  bottom:12%;
  width:18px;
  height:95px;
  background:#60462f;
}

.tree:before{
  content:"";
  position:absolute;
  width:100px;
  height:100px;
  left:-40px;
  top:-65px;
  border-radius:50%;
  background:#285c39;
  box-shadow:
    35px 18px 0 #326d42,
    -25px 25px 0 #367447;
}

.t1{left:7%;transform:scale(.8)}
.t2{left:22%;transform:scale(.55)}
.t3{right:18%;transform:scale(1.05)}
.t4{right:5%;transform:scale(.72)}

/* Road */

#road{
  position:absolute;
  left:7%;
  bottom:-1%;
  width:86%;
  height:52%;
  background:#363a3c;
  clip-path:polygon(
    34% 0,
    66% 0,
    100% 100%,
    0 100%
  );
}

.roadEdge{
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:white;
}

.roadEdge.left{left:31%}
.roadEdge.right{right:31%}

.lane{
  position:absolute;
  left:50%;
  width:5px;
  height:9%;
  border-radius:4px;
  background:white;
  transform:translateX(-50%);
}

.l1{top:5%}
.l2{top:30%}
.l3{top:55%}
.l4{top:80%}

/* =====================================================
   TOP STATUS
===================================================== */

#statusCard{
  position:absolute;
  z-index:100;
  top:max(12px,env(safe-area-inset-top));
  left:16px;
  width:210px;
  padding:13px 15px;
  border-radius:18px;
  background:rgba(8,28,40,.82);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.vehicleName{
  font-size:17px;
  font-weight:800;
  letter-spacing:2px;
}

.condition{
  margin-top:7px;
  font-size:12px;
  letter-spacing:.5px;
}

.dot{
  color:#43e276;
}

/* Top buttons */

#topButtons{
  position:absolute;
  z-index:100;
  top:max(12px,env(safe-area-inset-top));
  right:12px;
  display:flex;
  gap:8px;
}

.topButton{
  width:72px;
  height:72px;
  border-radius:18px;
  background:rgba(8,28,40,.82);
  border:1px solid rgba(255,255,255,.25);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.topIcon{
  font-size:27px;
}

.topText{
  margin-top:5px;
  font-size:9px;
  letter-spacing:1px;
  font-weight:bold;
}

/* Exit */

#exitButton{
  position:absolute;
  z-index:100;
  top:105px;
  left:16px;
  width:82px;
  height:76px;
  border-radius:18px;
  background:rgba(8,28,40,.82);
  border:1px solid rgba(255,255,255,.25);
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
}

#exitButton span{
  display:block;
  font-size:25px;
  margin-bottom:5px;
}

/* =====================================================
   REAR VIEW MIRROR
===================================================== */

#mirror{
  position:absolute;
  z-index:70;
  left:21%;
  right:21%;
  top:27%;
  height:17%;
  min-height:72px;
  border:5px solid #101417;
  border-radius:26px;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #78badd 0%,
      #a1d0d0 54%,
      #72866e 55%,
      #52624f 100%
    );
  box-shadow:0 8px 20px rgba(0,0,0,.4);
}

#mirrorRoad{
  position:absolute;
  left:40%;
  bottom:0;
  width:20%;
  height:65%;
  background:#3b3d3e;
  clip-path:polygon(
    40% 0,
    60% 0,
    100% 100%,
    0 100%
  );
}

#mirrorCar{
  position:absolute;
  left:48%;
  bottom:20%;
  width:5%;
  height:11%;
  background:#171a1c;
  border-radius:3px;
}

/* =====================================================
   COCKPIT
===================================================== */

#cockpit{
  position:absolute;
  z-index:20;
  left:0;
  right:0;
  bottom:0;
  height:42%;
  min-height:300px;
  background:
    linear-gradient(
      to bottom,
      rgba(5,9,12,.88),
      rgba(2,5,7,.98)
    );
  border-top:1px solid rgba(255,255,255,.16);
}

/* =====================================================
   DASHBOARD
===================================================== */

#dashboard{
  position:absolute;
  z-index:25;
  top:10px;
  left:23%;
  right:23%;
  height:92px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.gauge{
  width:86px;
  height:86px;
  flex:none;
  border-radius:50%;
  background:#080c0f;
  border:5px solid #30383d;
  box-shadow:
    inset 0 0 18px #000,
    0 2px 8px rgba(0,0,0,.45);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.gaugeValue{
  font-size:27px;
  font-weight:800;
}

.gaugeUnit{
  font-size:8px;
  letter-spacing:1px;
  opacity:.7;
}

#gearDisplay{
  width:60px;
  height:60px;
  flex:none;
  border-radius:11px;
  background:#080c0f;
  border:4px solid #363e43;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:28px;
  font-weight:800;
}

/* Dashboard information */

#dashInfo{
  position:absolute;
  z-index:25;
  top:103px;
  left:20%;
  right:20%;
  text-align:center;
  font-size:10px;
  letter-spacing:1px;
  white-space:nowrap;
  opacity:.85;
}

.ready{
  color:#43e276;
}

/* =====================================================
   STEERING
===================================================== */

#steering{
  position:absolute;
  z-index:45;
  left:18px;
  bottom:82px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(8,12,15,.62);
  border:8px solid rgba(255,255,255,.17);
  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.06),
    0 8px 25px rgba(0,0,0,.45);
  transition:transform .08s linear;
}

#steering:before,
#steering:after{
  content:"";
  position:absolute;
  background:rgba(255,255,255,.15);
  border-radius:6px;
}

#steering:before{
  width:12px;
  height:65%;
  left:50%;
  top:18%;
  transform:translateX(-50%);
}

#steering:after{
  width:65%;
  height:12px;
  left:18%;
  top:50%;
  transform:translateY(-50%);
}

#steerCenter{
  position:absolute;
  z-index:2;
  left:25%;
  top:25%;
  width:50%;
  height:50%;
  border-radius:50%;
  background:rgba(8,13,16,.88);
  border:4px solid rgba(255,255,255,.12);
  display:flex;
  justify-content:center;
  align-items:center;
}

#steerLogo{
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  z-index:5;
  top:41%;
  font-size:25px;
  opacity:.8;
}

.steerLeft{left:5%}
.steerRight{right:5%}

/* =====================================================
   GEAR SELECTOR
===================================================== */

#gearSelector{
  position:absolute;
  z-index:45;
  left:50%;
  bottom:83px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  gap:3px;
}

.gear{
  width:55px;
  height:36px;
  border-radius:9px;
  background:rgba(9,14,17,.86);
  border:1px solid rgba(255,255,255,.18);
  font-size:14px;
  font-weight:800;
}

.gear.active{
  background:#396b7d;
  border-color:#82d8ee;
}

/* =====================================================
   PEDALS
===================================================== */

#pedals{
  position:absolute;
  z-index:45;
  right:16px;
  bottom:82px;
  height:158px;
  display:flex;
  gap:9px;
}

.pedal{
  position:relative;
  width:68px;
  height:158px;
  border-radius:18px;
  overflow:hidden;
  background:rgba(8,12,15,.46);
  border:2px solid rgba(255,255,255,.2);
}

.pedal.brake{
  border-color:rgba(225,85,85,.75);
}

.pedal.accel{
  border-color:rgba(50,190,220,.8);
}

.pedalTitle{
  position:absolute;
  top:10px;
  width:100%;
  text-align:center;
  font-size:9px;
  letter-spacing:1px;
  font-weight:bold;
  opacity:.8;
}

.pedalTrack{
  position:absolute;
  left:13px;
  right:13px;
  top:38px;
  bottom:12px;
  border-radius:12px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.08);
}

.pedalFill{
  position:absolute;
  left:4px;
  right:4px;
  bottom:4px;
  height:0%;
  border-radius:9px;
  background:rgba(255,255,255,.2);
}

.pedalValue{
  position:absolute;
  bottom:7px;
  width:100%;
  text-align:center;
  font-size:9px;
}

/* =====================================================
   BOTTOM CONTROLS
===================================================== */

#controls{
  position:absolute;
  z-index:100;
  left:12px;
  right:12px;
  bottom:9px;
  height:62px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.control{
  height:62px;
  min-width:0;
  border-radius:15px;
  background:rgba(7,12,15,.82);
  border:1px solid rgba(255,255,255,.2);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.controlIcon{
  font-size:21px;
  line-height:1;
}

.controlText{
  margin-top:5px;
  font-size:7px;
  letter-spacing:1px;
  font-weight:bold;
}

.control.on{
  background:rgba(45,100,115,.85);
  border-color:#82d8ee;
}

.control.hazardOn{
  background:rgba(110,35,35,.9);
  border-color:#ef7070;
}

/* =====================================================
   SETTINGS
===================================================== */

#settings{
  position:absolute;
  z-index:300;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(340px,88vw);
  padding:20px;
  border-radius:20px;
  background:rgba(5,9,12,.97);
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  display:none;
}

#settings.show{
  display:block;
}

#settings h2{
  margin:0 0 18px;
  font-size:20px;
}

.settingRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  font-size:13px;
}

.closeSettings{
  margin-top:18px;
  width:100%;
  height:42px;
  border-radius:10px;
  background:#315d6d;
}

/* =====================================================
   RESPONSIVE PHONE LAYOUT
===================================================== */

@media(max-width:430px){

  #statusCard{
    width:205px;
  }

  #mirror{
    left:17%;
    right:17%;
    top:27%;
  }

  #dashboard{
    left:19%;
    right:19%;
  }

  .gauge{
    width:78px;
    height:78px;
  }

  .gaugeValue{
    font-size:24px;
  }

  #gearDisplay{
    width:54px;
    height:54px;
  }

  #steering{
    width:140px;
    height:140px;
    left:12px;
  }

  #pedals{
    right:10px;
    gap:6px;
  }

  .pedal{
    width:61px;
  }

  #gearSelector{
    bottom:84px;
  }

  #controls{
    gap:4px;
  }

  .controlIcon{
    font-size:19px;
  }

  .controlText{
    font-size:6px;
  }
}

@media(max-height:700px){

  #cockpit{
    min-height:270px;
  }

  #steering{
    width:125px;
    height:125px;
    bottom:74px;
  }

  #pedals{
    height:140px;
    bottom:74px;
  }

  .pedal{
    height:140px;
  }

  #gearSelector{
    bottom:76px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- =================================================
       OUTSIDE WORLD
  ================================================== -->

  <div id="world">

    <div id="sun"></div>

    <div class="hill"></div>
    <div class="hill two"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div id="road">
      <div class="roadEdge left"></div>
      <div class="roadEdge right"></div>

      <div class="lane l1"></div>
      <div class="lane l2"></div>
      <div class="lane l3"></div>
      <div class="lane l4"></div>
    </div>

    <!-- TOP STATUS -->

    <div id="statusCard">
      <div class="vehicleName">
        WAYFLO • VEHICLE 01
      </div>

      <div class="condition">
        <span class="dot">●</span>
        CONDITION <b id="condition">100%</b>
      </div>
    </div>

    <div id="topButtons">

      <button class="topButton" id="mirrorButton">
        <div class="topIcon">▱</div>
        <div class="topText">MIRROR</div>
      </button>

      <button class="topButton" id="settingsButton">
        <div class="topIcon">⚙</div>
        <div class="topText">SETTINGS</div>
      </button>

    </div>

    <button id="exitButton">
      <span>↪</span>
      EXIT
    </button>

    <!-- REAR VIEW MIRROR -->

    <div id="mirror">

      <div id="mirrorRoad"></div>
      <div id="mirrorCar"></div>

    </div>

  </div>


  <!-- =================================================
       COCKPIT
  ================================================== -->

  <div id="cockpit">

    <!-- DASHBOARD -->

    <div id="dashboard">

      <div class="gauge">
        <div class="gaugeValue" id="speed">0</div>
        <div class="gaugeUnit">KM/H</div>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <div class="gaugeValue" id="rpm">800</div>
        <div class="gaugeUnit">RPM</div>
      </div>

    </div>

    <div id="dashInfo">
      <span class="ready">● READY</span>
      &nbsp; • &nbsp;
      TEMP <span id="temp">88</span>°C
      &nbsp; • &nbsp;
      FUEL <span id="fuel">100</span>%
      &nbsp; • &nbsp;
      <span id="weather">☀ CLEAR</span>
    </div>


    <!-- STEERING -->

    <div id="steering">

      <div class="steerArrow steerLeft">‹</div>
      <div class="steerArrow steerRight">›</div>

      <div id="steerCenter">
        <span id="steerLogo">WAYFLO</span>
      </div>

    </div>


    <!-- GEAR SELECTOR -->

    <div id="gearSelector">

      <button class="gear active" data-gear="P">P</button>
      <button class="gear" data-gear="R">R</button>
      <button class="gear" data-gear="N">N</button>
      <button class="gear" data-gear="D">D</button>

    </div>


    <!-- PEDALS -->

    <div id="pedals">

      <div class="pedal brake" id="brakePedal">

        <div class="pedalTitle">BRAKE</div>

        <div class="pedalTrack">
          <div class="pedalFill" id="brakeFill"></div>
        </div>

        <div class="pedalValue">
          <span id="brakeValue">0</span>%
        </div>

      </div>


      <div class="pedal accel" id="accelPedal">

        <div class="pedalTitle">ACCEL</div>

        <div class="pedalTrack">
          <div class="pedalFill" id="accelFill"></div>
        </div>

        <div class="pedalValue">
          <span id="accelValue">0</span>%
        </div>

      </div>

    </div>


    <!-- BOTTOM CONTROLS -->

    <div id="controls">

      <button class="control" id="lights">
        <div class="controlIcon">◉</div>
        <div class="controlText">LIGHTS</div>
      </button>

      <button class="control" id="leftIndicator">
        <div class="controlIcon">←</div>
        <div class="controlText">LEFT</div>
      </button>

      <button class="control" id="hazard">
        <div class="controlIcon">△</div>
        <div class="controlText">HAZARD</div>
      </button>

      <button class="control" id="rightIndicator">
        <div class="controlIcon">→</div>
        <div class="controlText">RIGHT</div>
      </button>

      <button class="control" id="wipers">
        <div class="controlIcon">◇</div>
        <div class="controlText">WIPERS</div>
      </button>

      <button class="control" id="map">
        <div class="controlIcon">□</div>
        <div class="controlText">MAP</div>
      </button>

    </div>

  </div>


  <!-- =================================================
       SETTINGS
  ================================================== -->

  <div id="settings">

    <h2>WAYFLO SETTINGS</h2>

    <div class="settingRow">
      <span>Automatic lights</span>
      <b>ON</b>
    </div>

    <div class="settingRow">
      <span>Automatic wipers</span>
      <b>OFF</b>
    </div>

    <div class="settingRow">
      <span>Weather</span>
      <b>CLEAR</b>
    </div>

    <div class="settingRow">
      <span>Driving mode</span>
      <b>REALISTIC</b>
    </div>

    <button class="closeSettings" id="closeSettings">
      CLOSE
    </button>

  </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let speed = 0;
let rpm = 800;
let temp = 88;
let fuel = 100;

let acceleration = 0;
let braking = 0;

let steering = 0;

let gear = "P";

let lightsOn = false;
let leftOn = false;
let rightOn = false;
let hazardsOn = false;
let wipersOn = false;


/* =====================================================
   ELEMENTS
===================================================== */

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const tempEl = document.getElementById("temp");
const fuelEl = document.getElementById("fuel");

const steeringEl = document.getElementById("steering");

const accelPedal = document.getElementById("accelPedal");
const brakePedal = document.getElementById("brakePedal");

const accelFill = document.getElementById("accelFill");
const brakeFill = document.getElementById("brakeFill");

const accelValue = document.getElementById("accelValue");
const brakeValue = document.getElementById("brakeValue");

const gearDisplay = document.getElementById("gearDisplay");

const settings = document.getElementById("settings");


/* =====================================================
   GEAR SELECTION
===================================================== */

document.querySelectorAll(".gear").forEach(button => {

  button.addEventListener("pointerdown", event => {

    event.preventDefault();

    gear = button.dataset.gear;

    document.querySelectorAll(".gear").forEach(g => {
      g.classList.remove("active");
    });

    button.classList.add("active");

    gearDisplay.textContent = gear;

    if(gear === "P" || gear === "N"){
      speed = 0;
    }

  });

});


/* =====================================================
   PEDAL CONTROL
   PUSH AND HOLD + SLIDE
===================================================== */

function pedalControl(element, callback){

  let active = false;

  function update(event){

    const rect = element.getBoundingClientRect();

    let value =
      1 -
      ((event.clientY - rect.top) / rect.height);

    value = Math.max(0,Math.min(1,value));

    callback(value);
  }

  element.addEventListener("pointerdown",event=>{

    event.preventDefault();

    active = true;

    element.setPointerCapture(event.pointerId);

    update(event);

  });

  element.addEventListener("pointermove",event=>{

    if(!active) return;

    update(event);

  });

  function release(){

    active = false;

    callback(0);

  }

  element.addEventListener("pointerup",release);
  element.addEventListener("pointercancel",release);
}


pedalControl(accelPedal,value=>{

  acceleration = value;

  accelFill.style.height =
    (value * 100) + "%";

  accelValue.textContent =
    Math.round(value * 100);

});


pedalControl(brakePedal,value=>{

  braking = value;

  brakeFill.style.height =
    (value * 100) + "%";

  brakeValue.textContent =
    Math.round(value * 100);

});


/* =====================================================
   STEERING
   DRAG LEFT / RIGHT
===================================================== */

let steeringActive = false;

steeringEl.addEventListener("pointerdown",event=>{

  event.preventDefault();

  steeringActive = true;

  steeringEl.setPointerCapture(event.pointerId);

});

steeringEl.addEventListener("pointermove",event=>{

  if(!steeringActive) return;

  const rect =
    steeringEl.getBoundingClientRect();

  const center =
    rect.left + rect.width / 2;

  steering =
    (event.clientX - center) /
    (rect.width / 2);

  steering =
    Math.max(-1,Math.min(1,steering));

  steeringEl.style.transform =
    `rotate(${steering * 18}deg)`;

});

function releaseSteering(){

  steeringActive = false;

  steering *= .65;

  steeringEl.style.transform =
    `rotate(${steering * 18}deg)`;
}

steeringEl.addEventListener(
  "pointerup",
  releaseSteering
);

steeringEl.addEventListener(
  "pointercancel",
  releaseSteering
);

}

/* =====================================================
   PHYSICS
===================================================== */

let lastTime = performance.now();

function loop(now){

  const dt =
    Math.min(
      (now - lastTime) / 1000,
      .05
    );

  lastTime = now;


  /* acceleration */

  if(
    acceleration > 0 &&
    (gear === "D" || gear === "R")
  ){

    speed +=
      acceleration *
      22 *
      dt;

  }


  /* braking */

  if(braking > 0){

    speed -=
      braking *
      45 *
      dt;

  }


  /* rolling resistance */

  if(
    acceleration === 0 &&
    braking === 0 &&
    speed > 0
  ){

    speed -=
      3 *
      dt;

  }


  /* reverse */

  if(gear === "R"){

    speed =
      Math.max(-20,speed);

  }else{

    speed =
      Math.max(0,speed);

  }


  /* forward limit */

  if(gear === "D"){

    speed =
      Math.min(160,speed);

  }


  /* parked / neutral */

  if(gear === "P" || gear === "N"){

    speed = 0;

  }


  /* RPM */

  rpm =
    800 +
    Math.abs(speed) * 28 +
    acceleration * 3200;


  if(rpm > 6500)
    rpm = 6500;


  /* engine temperature */

  if(acceleration > .5){

    temp +=
      .02 * dt * 60;

  }else{

    temp -=
      .008 * dt * 60;

  }

  temp =
    Math.max(88,Math.min(105,temp));


  /* update display */

  speedEl.textContent =
    Math.round(Math.abs(speed));

  rpmEl.textContent =
    Math.round(rpm);

  tempEl.textContent =
    Math.round(temp);

  fuelEl.textContent =
    Math.max(
      0,
      Math.round(fuel)
    );


  requestAnimationFrame(loop);

}


requestAnimationFrame(loop);

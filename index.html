<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>WAYFLO Driving Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05090b;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#071016;
}

/* =========================================================
   OUTSIDE WORLD
========================================================= */

#windshield{
  position:absolute;
  inset:0 0 48% 0;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #72b9dc 0%,
      #a5d6e5 48%,
      #899b86 49%,
      #73836e 70%,
      #566454 100%
    );
}

#horizon{
  position:absolute;
  left:-10%;
  width:120%;
  bottom:30%;
  height:22%;
  background:#84947c;
  border-radius:50% 50% 0 0;
}

#road{
  position:absolute;
  left:50%;
  bottom:-8%;
  width:70%;
  height:75%;
  transform:translateX(-50%);
  background:#303638;
  clip-path:polygon(
    44% 0,
    56% 0,
    100% 100%,
    0 100%
  );
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:#fff;
}

#road:before{
  left:28%;
}

#road:after{
  right:28%;
}

#roadMarkings{
  position:absolute;
  left:50%;
  top:0;
  width:7px;
  height:100%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      #fff 0 55px,
      transparent 55px 105px
    );
}

.tree{
  position:absolute;
  bottom:18%;
  width:95px;
  height:130px;
}

.tree:before{
  content:"";
  position:absolute;
  left:40px;
  bottom:0;
  width:16px;
  height:78px;
  background:#674b32;
}

.tree:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:95px;
  height:95px;
  border-radius:50%;
  background:#326844;
  box-shadow:
    35px 20px 0 #39734a,
    65px 10px 0 #2d603d;
}

.tree.left{
  left:2%;
}

.tree.left2{
  left:13%;
  transform:scale(.72);
}

.tree.right{
  right:2%;
  transform:scale(1.05);
}

.tree.right2{
  right:15%;
  transform:scale(.7);
}

/* =========================================================
   MIRROR
========================================================= */

#mirror{
  position:absolute;
  z-index:20;
  top:8%;
  left:50%;
  width:min(52vw,560px);
  height:105px;
  transform:translateX(-50%);
  border:7px solid #101418;
  border-radius:28px;
  background:
    linear-gradient(
      to bottom,
      #a9d4df 0 50%,
      #73826e 51% 100%
    );
  box-shadow:0 12px 25px #0008;
  overflow:hidden;
}

#mirrorRoad{
  position:absolute;
  left:50%;
  bottom:0;
  width:28%;
  height:72%;
  transform:translateX(-50%);
  background:#303638;
  clip-path:polygon(
    40% 0,
    60% 0,
    100% 100%,
    0 100%
  );
}

#mirrorLine{
  position:absolute;
  left:50%;
  top:20%;
  bottom:5%;
  width:3px;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      white 0 15px,
      transparent 15px 28px
    );
}

/* =========================================================
   TOP STATUS
========================================================= */

#vehicleStatus{
  position:absolute;
  z-index:30;
  top:22px;
  left:22px;
  width:275px;
  padding:20px 22px;
  border-radius:22px;
  background:#102a3ad9;
  border:1px solid #ffffff22;
  box-shadow:0 10px 25px #0005;
}

.vehicleTitle{
  font-size:23px;
  font-weight:800;
  letter-spacing:3px;
}

.condition{
  margin-top:10px;
  font-size:15px;
  color:#ddd;
}

.greenDot{
  color:#45e276;
}

.topButton{
  position:absolute;
  z-index:31;
  top:22px;
  width:105px;
  height:90px;
  border-radius:22px;
  background:#102a3ae8;
  border:1px solid #ffffff2c;
  box-shadow:0 8px 20px #0004;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.topButton .icon{
  font-size:30px;
}

.topButton span{
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
}

#mirrorButton{
  right:140px;
}

#settingsButton{
  right:22px;
}

#exitButton{
  position:absolute;
  z-index:31;
  top:125px;
  left:22px;
  width:105px;
  height:82px;
  border-radius:22px;
  background:#102a3ae8;
  border:1px solid #ffffff2c;
  font-weight:bold;
  letter-spacing:2px;
}

/* =========================================================
   DASHBOARD
========================================================= */

#dashboard{
  position:absolute;
  z-index:40;
  left:0;
  right:0;
  top:52%;
  bottom:0;
  background:
    linear-gradient(
      to bottom,
      #05090b 0%,
      #070c0f 100%
    );
}

#instruments{
  height:105px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.gauge{
  width:100px;
  height:100px;
  border-radius:50%;
  border:6px solid #20282c;
  background:#05080a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 0 2px #111;
}

.gaugeValue{
  font-size:30px;
  font-weight:bold;
}

.gaugeLabel{
  font-size:10px;
  color:#aaa;
  letter-spacing:1px;
}

#gearDisplay{
  width:78px;
  height:78px;
  border:5px solid #20282c;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:bold;
  background:#06090b;
}

#statusStrip{
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  font-size:15px;
  color:#cfd5d7;
}

.ready{
  color:#45df75;
}

/* =========================================================
   CONTROLS
========================================================= */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  top:145px;
}

/* steering wheel */

#steering{
  position:absolute;
  left:28px;
  bottom:88px;
  width:180px;
  height:180px;
  border-radius:50%;
  border:12px solid #30383c;
  background:#080c0fdd;
  box-shadow:
    inset 0 0 0 10px #11181c,
    0 8px 20px #0008;
  touch-action:none;
  cursor:pointer;
}

#steeringInner{
  position:absolute;
  inset:28px;
  border:8px solid #222a2e;
  border-radius:50%;
}

#steeringHub{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#10161a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  color:#ddd;
}

#steerLeft{
  left:8px;
}

#steerRight{
  right:8px;
}

/* gear selector */

#gearSelector{
  position:absolute;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  gap:5px;
}

.gearButton{
  width:72px;
  height:44px;
  border-radius:12px;
  background:#080d10;
  border:2px solid #20292d;
  font-size:17px;
  font-weight:bold;
}

.gearButton.active{
  background:#397d98;
  border-color:#73c9e8;
}

/* pedals */

#pedals{
  position:absolute;
  right:28px;
  bottom:78px;
  display:flex;
  gap:15px;
}

.pedal{
  width:105px;
  height:190px;
  border-radius:24px;
  background:#080d10cc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:15px 10px;
}

#brake{
  border:2px solid #a94e4e;
}

#accel{
  border:2px solid #2c9bbd;
}

.pedalName{
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
}

.pedalTrack{
  position:relative;
  width:48px;
  height:115px;
  border-radius:25px;
  background:#11181c;
  border:1px solid #283237;
  overflow:hidden;
}

.pedalFill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  background:#ffffff18;
}

.pedalPercent{
  font-size:12px;
  color:#aaa;
}

/* switches */

#switches{
  position:absolute;
  left:15px;
  right:15px;
  bottom:12px;
  height:64px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.switch{
  border-radius:15px;
  background:#080d10;
  border:2px solid #20292d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  cursor:pointer;
}

.switchIcon{
  font-size:20px;
}

.switchText{
  font-size:10px;
  letter-spacing:1px;
}

.switch.active{
  border-color:#67c8e6;
  background:#163c4b;
}

/* =========================================================
   RESPONSIVE PHONE
========================================================= */

@media(max-width:600px){

  #windshield{
    inset:0 0 48% 0;
  }

  #mirror{
    top:11%;
    width:54vw;
    height:78px;
    border-width:5px;
    border-radius:22px;
  }

  #vehicleStatus{
    top:14px;
    left:14px;
    width:220px;
    padding:14px;
  }

  .vehicleTitle{
    font-size:17px;
  }

  .condition{
    font-size:12px;
  }

  #mirrorButton,
  #settingsButton{
    top:14px;
    width:70px;
    height:68px;
  }

  #mirrorButton{
    right:94px;
  }

  #settingsButton{
    right:14px;
  }

  .topButton .icon{
    font-size:20px;
  }

  .topButton span{
    font-size:8px;
  }

  #exitButton{
    top:94px;
    left:14px;
    width:70px;
    height:55px;
    font-size:10px;
  }

  #dashboard{
    top:48%;
  }

  #instruments{
    height:78px;
    gap:7px;
  }

  .gauge{
    width:68px;
    height:68px;
    border-width:4px;
  }

  .gaugeValue{
    font-size:21px;
  }

  .gaugeLabel{
    font-size:8px;
  }

  #gearDisplay{
    width:55px;
    height:55px;
    font-size:24px;
  }

  #statusStrip{
    height:32px;
    font-size:10px;
    gap:7px;
  }

  #controls{
    top:110px;
  }

  #steering{
    left:12px;
    bottom:70px;
    width:130px;
    height:130px;
    border-width:8px;
  }

  #steeringInner{
    inset:21px;
    border-width:5px;
  }

  #steeringHub{
    width:52px;
    height:52px;
    font-size:9px;
  }

  .steerArrow{
    font-size:18px;
  }

  #gearSelector{
    bottom:70px;
    gap:3px;
  }

  .gearButton{
    width:48px;
    height:32px;
    border-radius:9px;
    font-size:12px;
  }

  #pedals{
    right:10px;
    bottom:70px;
    gap:6px;
  }

  .pedal{
    width:62px;
    height:145px;
    border-radius:17px;
    padding:10px 6px;
  }

  .pedalName{
    font-size:10px;
  }

  .pedalTrack{
    width:36px;
    height:92px;
  }

  .pedalPercent{
    font-size:9px;
  }

  #switches{
    left:8px;
    right:8px;
    bottom:8px;
    height:52px;
    gap:5px;
  }

  .switch{
    border-radius:10px;
  }

  .switchIcon{
    font-size:15px;
  }

  .switchText{
    font-size:7px;
  }
}

/* =========================================================
   LANDSCAPE PHONE
========================================================= */

@media(max-height:600px){

  #windshield{
    inset:0 0 43% 0;
  }

  #dashboard{
    top:43%;
  }

  #instruments{
    height:65px;
  }

  .gauge{
    width:58px;
    height:58px;
  }

  .gaugeValue{
    font-size:18px;
  }

  #gearDisplay{
    width:50px;
    height:50px;
    font-size:20px;
  }

  #statusStrip{
    height:25px;
  }

  #controls{
    top:90px;
  }

  #steering{
    width:120px;
    height:120px;
    bottom:55px;
  }

  #gearSelector{
    bottom:55px;
  }

  #pedals{
    bottom:55px;
  }

  .pedal{
    height:125px;
  }

  #switches{
    height:44px;
  }
}
</style>
</head>

<body>

<div id="game">

  <!-- OUTSIDE WORLD -->

  <div id="windshield">

    <div id="horizon"></div>

    <div class="tree left"></div>
    <div class="tree left2"></div>
    <div class="tree right"></div>
    <div class="tree right2"></div>

    <div id="road">
      <div id="roadMarkings"></div>
    </div>

    <div id="mirror">
      <div id="mirrorRoad"></div>
      <div id="mirrorLine"></div>
    </div>

    <div id="vehicleStatus">
      <div class="vehicleTitle">WAYFLO</div>
      <div class="condition">
        <span class="greenDot">●</span>
        SYSTEM READY
      </div>
    </div>

    <button class="topButton" id="mirrorButton">
      <div class="icon">◉</div>
      <span>MIRROR</span>
    </button>

    <button class="topButton" id="settingsButton">
      <div class="icon">⚙</div>
      <span>SETTINGS</span>
    </button>

    <button id="exitButton">
      EXIT
    </button>

  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <div id="instruments">

      <div class="gauge">
        <div class="gaugeValue" id="speedValue">0</div>
        <div class="gaugeLabel">KM/H</div>
      </div>

      <div class="gauge">
        <div class="gaugeValue" id="rpmValue">800</div>
        <div class="gaugeLabel">RPM</div>
      </div>

      <div id="gearDisplay">N</div>

    </div>

    <div id="statusStrip">
      <span id="driveStatus">PARKED</span>
      <span>•</span>
      <span id="steerStatus">STEER 0°</span>
      <span>•</span>
      <span class="ready">READY</span>
    </div>


    <div id="controls">

      <!-- STEERING -->

      <div id="steering">

        <div id="steeringInner"></div>

        <div class="steerArrow" id="steerLeft">‹</div>

        <div id="steeringHub">
          WAYFLO
        </div>

        <div class="steerArrow" id="steerRight">›</div>

      </div>


      <!-- GEAR SELECTOR -->

      <div id="gearSelector">

        <button class="gearButton" data-gear="R">
          R
        </button>

        <button class="gearButton active" data-gear="N">
          N
        </button>

        <button class="gearButton" data-gear="D">
          D
        </button>

      </div>


      <!-- PEDALS -->

      <div id="pedals">

        <div class="pedal" id="brake">

          <div class="pedalName">
            BRAKE
          </div>

          <div class="pedalTrack">
            <div class="pedalFill" id="brakeFill"></div>
          </div>

          <div class="pedalPercent" id="brakePercent">
            0%
          </div>

        </div>


        <div class="pedal" id="accel">

          <div class="pedalName">
            ACCEL
          </div>

          <div class="pedalTrack">
            <div class="pedalFill" id="accelFill"></div>
          </div>

          <div class="pedalPercent" id="accelPercent">
            0%
          </div>

        </div>

      </div>


      <!-- SWITCHES -->

      <div id="switches">

        <button class="switch" data-name="LIGHTS">
          <div class="switchIcon">☼</div>
          <div class="switchText">LIGHTS</div>
        </button>

        <button class="switch" data-name="HAZARD">
          <div class="switchIcon">⚠</div>
          <div class="switchText">HAZARD</div>
        </button>

        <button class="switch" data-name="PARK">
          <div class="switchIcon">P</div>
          <div class="switchText">PARK</div>
        </button>

        <button class="switch" data-name="ABS">
          <div class="switchIcon">A</div>
          <div class="switchText">ABS</div>
        </button>

        <button class="switch" data-name="TRACTION">
          <div class="switchIcon">T</div>
          <div class="switchText">TRACTION</div>
        </button>

        <button class="switch" data-name="ENGINE">
          <div class="switchIcon">⚡</div>
          <div class="switchText">ENGINE</div>
        </button>

      </div>

    </div>

  </div>

</div>


<script>
/* =========================================================
   WAYFLO SIMULATION STATE
========================================================= */

const state = {
  gear: "N",
  speed: 0,
  rpm: 800,
  steering: 0,
  throttle: 0,
  brake: 0,
  engine: true,
  mirror: true
};


/* =========================================================
   ELEMENTS
========================================================= */

const speedValue =
  document.getElementById("speedValue");

const rpmValue =
  document.getElementById("rpmValue");

const gearDisplay =
  document.getElementById("gearDisplay");

const driveStatus =
  document.getElementById("driveStatus");

const steerStatus =
  document.getElementById("steerStatus");

const steering =
  document.getElementById("steering");

const accel =
  document.getElementById("accel");

const brake =
  document.getElementById("brake");

const accelFill =
  document.getElementById("accelFill");

const brakeFill =
  document.getElementById("brakeFill");

const accelPercent =
  document.getElementById("accelPercent");

const brakePercent =
  document.getElementById("brakePercent");

const mirror =
  document.getElementById("mirror");


/* =========================================================
   GEAR CONTROL
========================================================= */

document
  .querySelectorAll(".gearButton")
  .forEach(button => {

    button.addEventListener("click", () => {

      state.gear =
        button.dataset.gear;

      document
        .querySelectorAll(".gearButton")
        .forEach(b => {
          b.classList.remove("active");
        });

      button.classList.add("active");

      gearDisplay.textContent =
        state.gear;

      updateStatus();
    });

  });


/* =========================================================
   STEERING
========================================================= */

let steeringActive = false;

function updateSteeringFromPointer(x){

  const rect =
    steering.getBoundingClientRect();

  const center =
    rect.left + rect.width / 2;

  const radius =
    rect.width / 2;

  let value =
    ((x - center) / radius) * 45;

  value =
    Math.max(-45, Math.min(45, value));

  state.steering =
    Math.round(value);

  steering.style.transform =
    "rotate(" +
    state.steering +
    "deg)";

  steerStatus.textContent =
    "STEER " +
    state.steering +
    "°";
}

steering.addEventListener(
  "pointerdown",
  event => {

    steeringActive = true;

    steering.setPointerCapture(
      event.pointerId
    );

    updateSteeringFromPointer(
      event.clientX
    );
  }
);

steering.addEventListener(
  "pointermove",
  event => {

    if(!steeringActive) return;

    updateSteeringFromPointer(
      event.clientX
    );
  }
);

function releaseSteering(){

  steeringActive = false;

  state.steering *= 0.35;

  steering.style.transform =
    "rotate(" +
    state.steering +
    "deg)";

  steerStatus.textContent =
    "STEER " +
    Math.round(state.steering) +
    "°";
}

steering.addEventListener(
  "pointerup",
  releaseSteering
);

steering.addEventListener(
  "pointercancel",
  releaseSteering
);


/* =========================================================
   PEDAL HANDLING
========================================================= */

function setPedal(
  pedal,
  fill,
  percent,
  value
){

  const v =
    Math.max(0, Math.min(100, value));

  fill.style.height =
    v + "%";

  percent.textContent =
    Math.round(v) + "%";
}

function pedalPointer(
  pedal,
  callback,
  event
){

  const rect =
    pedal.getBoundingClientRect();

  let value =
    1 -
    ((event.clientY - rect.top) /
    rect.height);

  value =
    Math.max(0, Math.min(1, value));

  callback(value * 100);
}

let accelActive = false;
let brakeActive = false;

accel.addEventListener(
  "pointerdown",
  event => {

    accelActive = true;

    accel.setPointerCapture(
      event.pointerId
    );

    pedalPointer(
      accel,
      value => {
        state.throttle = value;

        setPedal(
          accel,
          accelFill,
          accelPercent,
          value
        );
      },
      event
    );
  }
);

accel.addEventListener(
  "pointermove",
  event => {

    if(!accelActive) return;

    pedalPointer(
      accel,
      value => {
        state.throttle = value;

        setPedal(
          accel,
          accelFill,
          accelPercent,
          value
        );
      },
      event
    );
  }
);

function releaseAccel(){

  accelActive = false;
  state.throttle = 0;

  setPedal(
    accel,
    accelFill,
    accelPercent,
    0
  );
}

accel.addEventListener(
  "pointerup",
  releaseAccel
);

accel.addEventListener(
  "pointercancel",
  releaseAccel
);


brake.addEventListener(
  "pointerdown",
  event => {

    brakeActive = true;

    brake.setPointerCapture(
      event.pointerId
    );

    pedalPointer(
      brake,
      value => {
        state.brake = value;

        setPedal(
          brake,
          brakeFill,
          brakePercent,
          value
        );
      },
      event
    );
  }
);

brake.addEventListener(
  "pointermove",
  event => {

    if(!brakeActive) return;

    pedalPointer(
      brake,
      value => {
        state.brake = value;

        setPedal(
          brake,
          brakeFill,
          brakePercent,
          value
        );
      },
      event
    );
  }
);

function releaseBrake(){

  brakeActive = false;
  state.brake = 0;

  setPedal(
    brake,
    brakeFill,
    brakePercent,
    0
  );
}

brake.addEventListener(
  "pointerup",
  releaseBrake
);

brake.addEventListener(
  "pointercancel",
  releaseBrake
);


/* =========================================================
   SWITCHES
========================================================= */

document
  .querySelectorAll(".switch")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        button.classList.toggle("active");

        const name =
          button.dataset.name;

        if(name === "ENGINE"){
          state.engine =
            button.classList.contains(
              "active"
            );
        }

      }
    );

  });


/* =========================================================
   MIRROR
========================================================= */

document
  .getElementById("mirrorButton")
  .addEventListener(
    "click",
    () => {

      state.mirror =
        !state.mirror;

      mirror.style.display =
        state.mirror
          ? "block"
          : "none";
    }
  );


/* =========================================================
   SETTINGS
========================================================= */

document
  .getElementById("settingsButton")
  .addEventListener(
    "click",
    () => {

      alert(
        "WAYFLO SETTINGS\n\n" +
        "Touch the steering wheel to steer.\n" +
        "Touch and drag the pedals.\n" +
        "Select R, N or D to change gear."
      );

    }
  );


/* =========================================================
   EXIT
========================================================= */

document
  .getElementById("exitButton")
  .addEventListener(
    "click",
    () => {

      state.speed = 0;
      state.throttle = 0;
      state.brake = 100;
      state.gear = "N";

      gearDisplay.textContent = "N";

      document
        .querySelectorAll(".gearButton")
        .forEach(button => {

          button.classList.toggle(
            "active",
            button.dataset.gear === "N"
          );

        });

      updateStatus();
    }
  );


/* =========================================================
   SIMULATION
========================================================= */

let lastTime =
  performance.now();

function simulation(now){

  const delta =
    Math.min(
      0.05,
      (now - lastTime) / 1000
    );

  lastTime = now;


  if(!state.engine){

    state.speed -=
      12 * delta;

    state.rpm = 0;

  }else{

    let acceleration = 0;

    if(state.gear === "D"){

      acceleration +=
        state.throttle * 0.055;

    }

    if(state.gear === "R"){

      acceleration -=
        state.throttle * 0.035;

    }

    acceleration -=
      state.brake * 0.09;

    acceleration -=
      1.5;

    state.speed +=
      acceleration * delta * 60;

    if(
      state.speed < 0 &&
      state.gear !== "R"
    ){
      state.speed = 0;
    }

    if(
      state.speed > 0 &&
      state.gear === "R"
    ){
      state.speed = 0;
    }

    state.speed =
      Math.max(
        -35,
        Math.min(160, state.speed)
      );


    const targetRPM =
      800 +
      Math.abs(state.speed) * 42 +
      state.throttle * 25;

    state.rpm +=
      (targetRPM - state.rpm) *
      Math.min(1, delta * 5);

  }


  speedValue.textContent =
    Math.round(
      Math.abs(state.speed)
    );

  rpmValue.textContent =
    Math.round(state.rpm);

  gearDisplay.textContent =
    state.gear;

  updateStatus();

  requestAnimationFrame(
    simulation
  );
}


/* =========================================================
   STATUS
========================================================= */

function updateStatus(){

  if(!state.engine){

    driveStatus.textContent =
      "ENGINE OFF";

    return;
  }

  if(state.brake > 5){

    driveStatus.textContent =
      "BRAKING";

    return;
  }

  if(
    state.gear === "D" &&
    state.throttle > 2
  ){

    driveStatus.textContent =
      "DRIVING";

    return;
  }

  if(
    state.gear === "R" &&
    state.throttle > 2
  ){

    driveStatus.textContent =
      "REVERSING";

    return;
  }

  if(state.gear === "N"){

    driveStatus.textContent =
      "NEUTRAL";

    return;
  }

  driveStatus.textContent =
    "READY";
}


/* =========================================================
   START
========================================================= */

updateStatus();

requestAnimationFrame(
  simulation
);

</script>

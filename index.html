<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no,
      viewport-fit=cover">

<title>WAYFLO World Simulator</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      crossorigin=""/>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body,
#map {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body {
  background: #111;
}

#map {
  position: fixed;
  inset: 0;
}

/* ---------- TOP HUD ---------- */

.hud {
  position: fixed;
  z-index: 2000;
  top: max(12px, env(safe-area-inset-top));
  left: 12px;
  right: 12px;

  display: flex;
  justify-content: space-between;
  align-items: flex-start;

  pointer-events: none;
}

.panel {
  color: white;

  background:
    rgba(10, 14, 22, 0.82);

  border:
    1px solid rgba(255,255,255,0.16);

  border-radius: 16px;

  padding: 10px 13px;

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  box-shadow:
    0 6px 24px rgba(0,0,0,0.35);
}

.logo {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 1px;
}

.tagline {
  margin-top: 2px;
  font-size: 10px;
  opacity: .65;
}

.stats {
  text-align: right;
  min-width: 105px;
}

.speed {
  font-size: 25px;
  font-weight: 900;
  line-height: 1;
}

.unit {
  font-size: 10px;
  opacity: .65;
}

.distance {
  margin-top: 4px;
  font-size: 11px;
  opacity: .8;
}

/* ---------- MESSAGE ---------- */

#message {
  position: fixed;
  z-index: 2100;

  top: 92px;
  left: 50%;

  transform: translateX(-50%);

  white-space: nowrap;

  transition:
    opacity .5s,
    transform .5s;

  pointer-events: none;
}

#message.hidden {
  opacity: 0;
  transform:
    translateX(-50%)
    translateY(-10px);
}

/* ---------- BOTTOM CONTROLS ---------- */

.controls {
  position: fixed;
  z-index: 2000;

  left: 0;
  right: 0;

  bottom:
    max(18px, env(safe-area-inset-bottom));

  padding:
    0 16px;

  display: flex;
  justify-content: space-between;
  align-items: flex-end;

  pointer-events: none;
}

.control-group {
  display: flex;
  gap: 9px;
  pointer-events: auto;
}

.button {
  width: 62px;
  height: 62px;

  border-radius: 20px;

  border:
    1px solid rgba(255,255,255,.18);

  background:
    rgba(12,16,25,.88);

  color: white;

  font-size: 25px;
  font-weight: 800;

  box-shadow:
    0 8px 24px rgba(0,0,0,.45);

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  touch-action: none;
}

.button:active,
.button.active {
  transform: scale(.93);

  background:
    rgba(255,255,255,.22);
}

.small {
  width: 52px;
  height: 52px;
  border-radius: 17px;
  font-size: 20px;
}

/* ---------- JOYSTICK ---------- */

#joystick {
  position: relative;

  width: 145px;
  height: 145px;

  border-radius: 50%;

  background:
    rgba(8,12,20,.48);

  border:
    1px solid rgba(255,255,255,.15);

  box-shadow:
    inset 0 0 25px rgba(0,0,0,.25);

  pointer-events: auto;

  touch-action: none;
}

#stick {
  position: absolute;

  width: 64px;
  height: 64px;

  left: 40.5px;
  top: 40.5px;

  border-radius: 50%;

  background:
    rgba(255,255,255,.18);

  border:
    2px solid rgba(255,255,255,.55);

  box-shadow:
    0 5px 18px rgba(0,0,0,.4);

  transition:
    transform .08s;
}

/* ---------- CAR ---------- */

.car-marker {
  width: 38px;
  height: 58px;

  position: relative;

  border-radius:
    13px
    13px
    10px
    10px;

  background:
    linear-gradient(
      90deg,
      #171717,
      #ff3347 25%,
      #ff3347 75%,
      #171717
    );

  border:
    2px solid white;

  box-shadow:
    0 4px 15px rgba(0,0,0,.65);
}

.car-window {
  position: absolute;

  left: 6px;
  right: 6px;
  top: 9px;

  height: 18px;

  border-radius: 7px;

  background:
    linear-gradient(
      135deg,
      #dff7ff,
      #5e8294
    );

  border:
    1px solid rgba(255,255,255,.8);
}

.car-light {
  position: absolute;

  left: 4px;
  right: 4px;
  bottom: 7px;

  height: 6px;

  border-radius: 5px;

  background:
    rgba(255,255,255,.9);
}

/* ---------- LEAFLET ---------- */

.leaflet-control-zoom {
  display: none;
}

.leaflet-control-attribution {
  font-size: 8px !important;
}

/* ---------- NIGHT MODE ---------- */

body.night .panel {
  background:
    rgba(4,7,14,.9);
}
</style>
</head>

<body>

<div id="map"></div>

<!-- TOP HUD -->

<div class="hud">

  <div class="panel">
    <div class="logo">WAYFLO</div>

    <div class="tagline">
      WORLD SIMULATOR
    </div>
  </div>

  <div class="panel stats">

    <div>
      <span id="speed"
            class="speed">0</span>

      <span class="unit">
        KM/H
      </span>
    </div>

    <div class="distance">
      Distance:
      <span id="distance">
        0.00
      </span>
      km
    </div>

  </div>

</div>

<!-- START MESSAGE -->

<div id="message"
     class="panel">

  🌍 Your World. Your Way.

</div>

<!-- CONTROLS -->

<div class="controls">

  <div class="control-group">

    <button
      id="locationButton"
      class="button small"
      aria-label="Use my location">

      📍

    </button>

    <button
      id="resetButton"
      class="button small"
      aria-label="Reset">

      ↺

    </button>

    <button
      id="nightButton"
      class="button small"
      aria-label="Night mode">

      🌙

    </button>

  </div>

  <div id="joystick">

    <div id="stick"></div>

  </div>

  <div class="control-group">

    <button
      id="brakeButton"
      class="button"
      aria-label="Brake">

      🛑

    </button>

    <button
      id="gasButton"
      class="button"
      aria-label="Accelerate">

      🚀

    </button>

  </div>

</div>

<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  crossorigin="">
</script>

<script>

/* =========================================================
   WAYFLO WORLD SIMULATOR
   First playable prototype
   ========================================================= */

/* ---------- MAP ---------- */

const map =
  L.map("map", {
    zoomControl: false,
    attributionControl: true,
    worldCopyJump: true
  });

/*
 Brisbane is our initial starting location.
 */

const START_LAT = -27.4698;
const START_LNG = 153.0251;

map.setView(
  [START_LAT, START_LNG],
  16
);

/* ---------- MAP LAYERS ---------- */

const dayLayer =
  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution:
        '&copy; OpenStreetMap contributors'
    }
  );

const nightLayer =
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
    {
      maxZoom: 20,
      attribution:
        '&copy; OpenStreetMap &copy; CARTO'
    }
  );

dayLayer.addTo(map);

let nightMode = false;

/* ---------- CAR ---------- */

const carIcon =
  L.divIcon({
    className: "",
    html:
      '<div class="car-marker">' +
        '<div class="car-window"></div>' +
        '<div class="car-light"></div>' +
      '</div>',
    iconSize: [38, 58],
    iconAnchor: [19, 29]
  });

let position =
  L.latLng(
    START_LAT,
    START_LNG
  );

let car =
  L.marker(
    position,
    {
      icon: carIcon,
      interactive: false
    }
  ).addTo(map);

/* ---------- GAME STATE ---------- */

let heading = 0;

let speed = 0;

let distance = 0;

let accelerating = false;

let braking = false;

let steering = 0;

let lastTime =
  performance.now();

/* ---------- UI ---------- */

const speedDisplay =
  document.getElementById("speed");

const distanceDisplay =
  document.getElementById("distance");

const message =
  document.getElementById("message");

/* Hide start message */

setTimeout(() => {

  message.classList.add("hidden");

}, 4500);

/* ---------- SAVE GAME ---------- */

function saveGame() {

  localStorage.setItem(
    "wayflo-save",
    JSON.stringify({
      lat: position.lat,
      lng: position.lng,
      heading: heading,
      distance: distance
    })
  );

}

/* ---------- LOAD GAME ---------- */

function loadGame() {

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "wayflo-save"
        )
      );

    if (!saved) {
      return;
    }

    position =
      L.latLng(
        saved.lat,
        saved.lng
      );

    heading =
      saved.heading || 0;

    distance =
      saved.distance || 0;

    car.setLatLng(position);

    map.setView(
      position,
      16
    );

  } catch (error) {

    console.log(
      "No saved game found."
    );

  }

}

loadGame();

/* ---------- CAR ROTATION ---------- */

function rotateCar() {

  const element =
    car.getElement();

  if (!element) {
    return;
  }

  const body =
    element.querySelector(
      ".car-marker"
    );

  if (!body) {
    return;
  }

  body.style.transform =
    `rotate(${heading}deg)`;

}

/* ---------- DRIVE ---------- */

function drive(delta) {

  /*
   Acceleration.
  */

  if (accelerating) {

    speed +=
      34 * delta;

  } else {

    speed -=
      14 * delta;

  }

  /*
   Braking.
  */

  if (braking) {

    speed -=
      70 * delta;

  }

  /*
   Speed limits.
  */

  speed =
    Math.max(
      0,
      Math.min(
        120,
        speed
      )
    );

  /*
   Steering becomes stronger
   as the vehicle moves faster.
  */

  if (speed > 0.5) {

    heading +=
      steering *
      95 *
      delta *
      (0.35 + speed / 100);

  }

  /*
   Move the car.
  */

  if (speed > 0.1) {

    const metres =
      speed /
      3.6 *
      delta;

    const radians =
      heading *
      Math.PI /
      180;

    const latitudeChange =
      Math.cos(radians) *
      metres /
      111320;

    const longitudeChange =
      Math.sin(radians) *
      metres /
      (
        111320 *
        Math.cos(
          position.lat *
          Math.PI /
          180
        )
      );

    position =
      L.latLng(
        position.lat +
          latitudeChange,

        position.lng +
          longitudeChange
      );

    distance +=
      metres /
      1000;

    car.setLatLng(
      position
    );

    /*
     Keep the car roughly centred.
    */

    map.panTo(
      position,
      {
        animate: false
      }
    );

  }

  rotateCar();

  /*
   Update HUD.
  */

  speedDisplay.textContent =
    Math.round(speed);

  distanceDisplay.textContent =
    distance.toFixed(2);

}

/* ---------- GAME LOOP ---------- */

function gameLoop(time) {

  const delta =
    Math.min(
      0.05,
      (time - lastTime) /
      1000
    );

  lastTime =
    time;

  drive(delta);

  requestAnimationFrame(
    gameLoop
  );

}

requestAnimationFrame(
  gameLoop
);

/* ---------- GAS BUTTON ---------- */

function createHoldButton(
  element,
  setter
) {

  const button =
    document.getElementById(
      element
    );

  function start(event) {

    event.preventDefault();

    setter(true);

    button.classList.add(
      "active"
    );

  }

  function stop(event) {

    event.preventDefault();

    setter(false);

    button.classList.remove(
      "active"
    );

  }

  button.addEventListener(
    "pointerdown",
    start
  );

  button.addEventListener(
    "pointerup",
    stop
  );

  button.addEventListener(
    "pointercancel",
    stop
  );

  button.addEventListener(
    "pointerleave",
    stop
  );

}

createHoldButton(
  "gasButton",
  value => {
    accelerating = value;
  }
);

createHoldButton(
  "brakeButton",
  value => {
    braking = value;
  }
);

/* ---------- JOYSTICK ---------- */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickPointer =
  null;

function updateJoystick(
  event
) {

  const rect =
    joystick.getBoundingClientRect();

  const centreX =
    rect.left +
    rect.width / 2;

  const centreY =
    rect.top +
    rect.height / 2;

  let x =
    event.clientX -
    centreX;

  let y =
    event.clientY -
    centreY;

  const maximum =
    rect.width / 2 -
    34;

  const length =
    Math.sqrt(
      x*x + y*y
    );

  if (length > maximum) {

    x =
      x /
      length *
      maximum;

    y =
      y /
      length *
      maximum;

  }

  stick.style.transform =
    `translate(${x}px, ${y}px)`;

  steering =
    Math.max(
      -1,
      Math.min(
        1,
        x / maximum
      )
    );

}

joystick.addEventListener(
  "pointerdown",
  event => {

    event.preventDefault();

    joystickPointer =
      event.pointerId;

    joystick.setPointerCapture(
      event.pointerId
    );

    updateJoystick(
      event
    );

  }
);

joystick.addEventListener(
  "pointermove",
  event => {

    if (
      event.pointerId ===
      joystickPointer
    ) {

      updateJoystick(
        event
      );

    }

  }
);

function resetJoystick() {

  joystickPointer =
    null;

  steering =
    0;

  stick.style.transform =
    "translate(0,0)";

}

joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

/* ---------- RESET ---------- */

document
  .getElementById("resetButton")
  .addEventListener(
    "click",
    () => {

      position =
        L.latLng(
          START_LAT,
          START_LNG
        );

      heading =
        0;

      speed =
        0;

      distance =
        0;

      car.setLatLng(
        position
      );

      map.setView(
        position,
        16
      );

      saveGame();

    }
  );

/* ---------- GPS LOCATION ---------- */

document
  .getElementById("locationButton")
  .addEventListener(
    "click",
    () => {

      if (
        !navigator.geolocation
      ) {

        alert(
          "Location is not available in this browser."
        );

        return;

      }

      navigator.geolocation.getCurrentPosition(

        location => {

          position =
            L.latLng(
              location.coords.latitude,
              location.coords.longitude
            );

          speed =
            0;

          car.setLatLng(
            position
          );

          map.setView(
            position,
            17
          );

          saveGame();

        },

        () => {

          alert(
            "WAYFLO could not access your location. You can continue exploring from Brisbane."
          );

        },

        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }

      );

    }
  );

/* ---------- NIGHT MODE ---------- */

document
  .getElementById("nightButton")
  .addEventListener(
    "click",
    () => {

      nightMode =
        !nightMode;

      if (nightMode) {

        map.removeLayer(
          dayLayer
        );

        nightLayer.addTo(
          map
        );

        document.body
          .classList.add(
            "night"
          );

      } else {

        map.removeLayer(
          nightLayer
        );

        dayLayer.addTo(
          map
        );

        document.body
          .classList.remove(
            "night"
          );

      }

    }
  );

/* ---------- AUTOSAVE ---------- */

setInterval(
  saveGame,
  5000
);

/* ---------- KEYBOARD SUPPORT ---------- */

const keys = {};

window.addEventListener(
  "keydown",
  event => {

    keys[event.key] =
      true;

    if (
      event.key ===
        "ArrowUp" ||
      event.key.toLowerCase() ===
        "w"
    ) {

      accelerating =
        true;

    }

    if (
      event.key ===
        "ArrowDown" ||
      event.key.toLowerCase() ===
        "s"
    ) {

      braking =
        true;

    }

  }
);

window.addEventListener(
  "keyup",
  event => {

    keys[event.key] =
      false;

    if (
      event.key ===
        "ArrowUp" ||
      event.key.toLowerCase() ===
        "w"
    ) {

      accelerating =
        false;

    }

    if (
      event.key ===
        "ArrowDown" ||
      event.key.toLowerCase() ===
        "s"
    ) {

      braking =
        false;

    }

  }
);

setInterval(
  () => {

    if (
      keys.ArrowLeft ||
      keys.a
    ) {

      steering =
        -1;

    } else if (
      keys.ArrowRight ||
      keys.d
    ) {

      steering =
        1;

    } else if (
      joystickPointer ===
      null
    ) {

      steering =
        0;

    }

  },
  50
);

</script>

</body>
</html>

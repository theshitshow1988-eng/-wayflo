<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>WAYFLO Driving Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071016;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
}

button{
  font:inherit;
  color:inherit;
  border:0;
  outline:0;
  touch-action:none;
}

/* =========================================================
   MAIN COCKPIT
========================================================= */

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#071016;
}

/* =========================================================
   WINDSHIELD / OUTSIDE WORLD
========================================================= */

#windshield{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:57%;
  overflow:hidden;
  background:
    linear-gradient(
      to bottom,
      #72b9dc 0%,
      #9dd1e3 52%,
      #8c9d88 53%,
      #77876f 70%,
      #5b6958 100%
    );
}

/* horizon */

#horizon{
  position:absolute;
  left:-10%;
  width:120%;
  bottom:30%;
  height:18%;
  background:#84947c;
  border-radius:50% 50% 0 0;
}

/* road */

#road{
  position:absolute;
  left:50%;
  bottom:-5%;
  width:62%;
  height:70%;
  transform:translateX(-50%);
  background:#303638;
  clip-path:polygon(
    43% 0,
    57% 0,
    100% 100%,
    0 100%
  );
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  width:5px;
  height:100%;
  background:white;
}

#road:before{left:28%}
#road:after{right:28%}

/* centre road markings */

#roadMarkings{
  position:absolute;
  left:50%;
  top:0;
  width:6px;
  height:100%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      to bottom,
      white 0 55px,
      transparent 55px 105px
    );
}

/* simple scenery */

.tree{
  position:absolute;
  bottom:18%;
  width:95px;
  height:130px;
}

.tree:before{
  content:"";
  position:absolute;
  left:43px;
  bottom:0;
  width:16px;
  height:75px;
  background:#674b32;
}

.tree:after{
  content:"";
  position:absolute;
  left:0;
  top:0;
  width:95px;
  height:95px;
  border-radius:50%;
  background:#326844;
  box-shadow:
    35px 20px 0 #39734a,
    65px 10px 0 #2d603d;
}

.tree.left{left:2%}
.tree.left2{left:12%;transform:scale(.72)}
.tree.right{right:2%;transform:scale(1.05)}
.tree.right2{right:15%;transform:scale(.7)}

/* =========================================================
   REAR VIEW MIRROR
========================================================= */

#mirror{
  position:absolute;
  z-index:20;
  top:9%;
  left:50%;
  width:min(52vw,560px);
  height:105px;
  transform:translateX(-50%);
  border:7px solid #101418;
  border-radius:28px;
  background:
    linear-gradient(
      to bottom,
      #a9d4df 0 50%,
      #73826e 51% 100%
    );
  box-shadow:0 12px 25px #0008;
  overflow:hidden;
}

#mirrorRoad{
  position:absolute;
  left:50%;
  bottom:0;
  width:28%;
  height:72%;
  transform:translateX(-50%);
  background:#303638;
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
}

#mirrorLine{
  position:absolute;
  left:50%;
  top:20%;
  bottom:5%;
  width:3px;
  transform:translateX(-50%);
  background:repeating-linear-gradient(
    to bottom,
    white 0 15px,
    transparent 15px 28px
  );
}

/* =========================================================
   TOP STATUS
========================================================= */

#vehicleStatus{
  position:absolute;
  z-index:30;
  top:22px;
  left:22px;
  width:275px;
  padding:20px 22px;
  border-radius:22px;
  background:#102a3ad9;
  border:1px solid #ffffff22;
  box-shadow:0 10px 25px #0005;
}

.vehicleTitle{
  font-size:23px;
  font-weight:800;
  letter-spacing:3px;
}

.condition{
  margin-top:10px;
  font-size:15px;
  color:#ddd;
}

.greenDot{
  color:#45e276;
}

/* top buttons */

.topButton{
  position:absolute;
  z-index:31;
  top:22px;
  width:105px;
  height:90px;
  border-radius:22px;
  background:#102a3ae8;
  border:1px solid #ffffff2c;
  box-shadow:0 8px 20px #0004;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
}

.topButton .icon{
  font-size:30px;
}

.topButton span{
  font-size:13px;
  font-weight:bold;
  letter-spacing:2px;
}

#mirrorButton{right:140px}
#settingsButton{right:22px}

#exitButton{
  position:absolute;
  z-index:31;
  top:125px;
  left:22px;
  width:105px;
  height:82px;
  border-radius:22px;
  background:#102a3ae8;
  border:1px solid #ffffff2c;
  font-weight:bold;
  letter-spacing:2px;
}

/* =========================================================
   DASHBOARD
========================================================= */

#dashboard{
  position:absolute;
  z-index:40;
  left:0;
  right:0;
  top:57%;
  height:43%;
  background:
    linear-gradient(
      to bottom,
      #05090b 0%,
      #070c0f 100%
    );
}

/* instrument row */

#instruments{
  height:105px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
}

.gauge{
  width:100px;
  height:100px;
  border-radius:50%;
  border:6px solid #20282c;
  background:#05080a;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 0 0 2px #111;
}

.gaugeValue{
  font-size:30px;
  font-weight:bold;
}

.gaugeLabel{
  font-size:10px;
  color:#aaa;
  letter-spacing:1px;
}

#gearDisplay{
  width:78px;
  height:78px;
  border:5px solid #20282c;
  border-radius:15px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:34px;
  font-weight:bold;
  background:#06090b;
}

/* status strip */

#statusStrip{
  height:42px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:18px;
  font-size:15px;
  color:#cfd5d7;
}

.ready{
  color:#45df75;
}

/* =========================================================
   LOWER CONTROL AREA
========================================================= */

#controls{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  top:145px;
}

/* steering */

#steering{
  position:absolute;
  left:28px;
  bottom:88px;
  width:180px;
  height:180px;
  border-radius:50%;
  border:12px solid #30383c;
  background:#080c0fdd;
  box-shadow:
    inset 0 0 0 10px #11181c,
    0 8px 20px #0008;
  touch-action:none;
}

#steeringInner{
  position:absolute;
  inset:28px;
  border:8px solid #222a2e;
  border-radius:50%;
}

#steeringHub{
  position:absolute;
  left:50%;
  top:50%;
  width:70px;
  height:70px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#10161a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
}

.steerArrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:28px;
  color:#ddd;
}

#steerLeft{left:8px}
#steerRight{right:8px}

/* gear selector */

#gearSelector{
  position:absolute;
  left:50%;
  bottom:78px;
  transform:translateX(-50%);
  display:flex;
  flex-direction:column;
  gap:5px;
}

.gearButton{
  width:72px;
  height:44px;
  border-radius:12px;
  background:#080d10;
  border:2px solid #20292d;
  font-size:17px;
  font-weight:bold;
}

.gearButton.active{
  background:#397d98;
  border-color:#73c9e8;
}

/* pedals */

#pedals{
  position:absolute;
  right:28px;
  bottom:78px;
  display:flex;
  gap:15px;
}

.pedal{
  width:105px;
  height:190px;
  border-radius:24px;
  background:#080d10cc;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  padding:15px 10px;
}

#brake{
  border:2px solid #a94e4e;
}

#accel{
  border:2px solid #2c9bbd;
}

.pedalName{
  font-size:14px;
  font-weight:bold;
  letter-spacing:2px;
}

.pedalTrack{
  position:relative;
  width:48px;
  height:115px;
  border-radius:25px;
  background:#11181c;
  border:1px solid #283237;
  overflow:hidden;
}

.pedalFill{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:0%;
  background:#ffffff18;
}

.pedalPercent{
  font-size:12px;
  color:#aaa;
}

/* bottom switches */

#switches{
  position:absolute;
  left:15px;
  right:15px;
  bottom:12px;
  height:64px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.switch{
  border-radius:15px;
  background:#080d10;
  border:2px solid #20292d;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
}

.switchIcon{
  font-size:20px;
}

.switchText{
  font-size:10px;
  letter-spacing:1px;
}

.switch.active{
  border-color:#67c8e6;
  background:#163c4b;
}

/* =========================================================
   RESPONSIVE PORTRAIT
========================================================= */

@media(max-width:600px){

  #windshield{
    height:52%;
  }

  #mirror{
    top:12%;
    width:54vw;
    height:78px;
    border-width:5px;
    border-radius:22px;
  }

  #vehicleStatus{
    top:14px;
    left:14px;
    width:265px;
    padding:16px;
  }

  .vehicleTitle{
    font-size:21px;
  }

  #mirrorButton,
  #settingsButton{
    top:14px;
    width:82px;
    height:78px;
  }

  #mirrorButton{right:104px}
  #settingsButton{right:14px}

  .topButton .icon{
    font-size:23px;
  }

  .topButton span{
    font-size:10px;
  }

  #exitButton{
    top:105px;
    left:14px;
    width:82px;
    height:68px;
    font-size:12px;
  }

  #dashboard{
    top:52%;
    height:48%;
  }

  #instruments{
    height:88px;
    gap:10px;
  }

  .gauge{
    width:78px;
    height:78px;
    border-width:5px;
  }

  .gaugeValue{
    font-size:25px;
  }

  #gearDisplay{
    width:62px;
    height:62px;
    font-size:27px;
  }

  #statusStrip{
    font-size:12px;
    gap:8px;
  }

  #controls{
    top:125px;
  }

  #steering{
    left:18px;
    bottom:72px;
    width:145px;
    height:145px;
    border-width:9px;
  }

  #steeringInner{
    inset:23px;
    border-width:6px;
  }

  #steeringHub{
    width:58px;
    height:58px;
    font-size:11px;
  }

  .steerArrow{
    font-size:22px;
  }

  #gearSelector{
    bottom:72px;
  }

  .gearButton{
    width:58px;
    height:39px;
    font-size:15px;
  }

  #pedals{
    right:14px;
    bottom:72px;
    gap:8px;
  }

  .pedal{
    width:78px;
    height:165px;
    border-radius:20px;
  }

  .pedalTrack{
    width:40px;
    height:105px;
  }

  .pedalName{
    font-size:11px;
  }

  #switches{
    bottom:8px;
    height:58px;
    gap:6px;
  }

  .switchIcon{
    font-size:17px;
  }

  .switchText{
    font-size:8px;
  }
}

/* =========================================================
   LANDSCAPE
========================================================= */

@media(min-width:700px) and (orientation:landscape){

  #windshield{
    height:57%;
  }

  #mirror{
    top:7%;
    height:92px;
  }

  #dashboard{
    top:57%;
    height:43%;
  }

  #controls{
    top:125px;
  }

  #steering{
    left:28px;
    bottom:78px;
  }

  #gearSelector{
    bottom:70px;
  }

  #pedals{
    right:28px;
    bottom:70px;
  }

  #switches{
    bottom:8px;
  }
}

/* =========================================================
   HIDE BROWSER-LIKE TEXT SELECTION
========================================================= */

#game,
#game *{
  -webkit-user-select:none;
  user-select:none;
}

/* prevent accidental scrolling */
body{
  overscroll-behavior:none;
}
</style>
</head>

<body>

<div id="game">

  <!-- ================= WINDSHIELD ================= -->

  <section id="windshield">

    <div id="horizon"></div>

    <div class="tree left"></div>
    <div class="tree left2"></div>
    <div class="tree right"></div>
    <div class="tree right2"></div>

    <div id="road">
      <div id="roadMarkings"></div>
    </div>

    <div id="mirror">
      <div id="mirrorRoad"></div>
      <div id="mirrorLine"></div>
    </div>

  </section>

  <!-- ================= TOP UI ================= -->

  <div id="vehicleStatus">
    <div class="vehicleTitle">WAYFLO • VEHICLE 01</div>
    <div class="condition">
      <span class="greenDot">●</span>
      CONDITION <strong id="condition">100%</strong>
    </div>
  </div>

  <button class="topButton" id="mirrorButton">
    <div class="icon">▱</div>
    <span>MIRROR</span>
  </button>

  <button class="topButton" id="settingsButton">
    <div class="icon">⚙</div>
    <span>SETTINGS</span>
  </button>

  <button id="exitButton">↪<br>EXIT</button>

  <!-- ================= DASHBOARD ================= -->

  <section id="dashboard">

    <div id="instruments">

      <div class="gauge">
        <div class="gaugeValue" id="speed">0</div>
        <div class="gaugeLabel">KM/H</div>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <div class="gaugeValue" id="rpm">800</div>
        <div class="gaugeLabel">RPM</div>
      </div>

    </div>

    <div id="statusStrip">
      <span class="ready">● READY</span>
      <span>•</span>
      <span>TEMP <strong id="temp">88</strong>°C</span>
      <span>•</span>
      <span>FUEL <strong id="fuel">100</strong>%</span>
      <span>•</span>
      <span>☀️ CLEAR</span>
    </div>

    <!-- ================= CONTROLS ================= -->

    <div id="controls">

      <!-- STEERING -->

      <div id="steering">
        <div id="steeringInner"></div>
        <div class="steerArrow" id="steerLeft">‹</div>
        <div class="steerArrow" id="steerRight">›</div>
        <div id="steeringHub">WAYFLO</div>
      </div>

      <!-- GEAR SELECTOR -->

      <div id="gearSelector">

        <button class="gearButton active" data-gear="P">P</button>
        <button class="gearButton" data-gear="R">R</button>
        <button class="gearButton" data-gear="N">N</button>
        <button class="gearButton" data-gear="D">D</button>

      </div>

      <!-- PEDALS -->

      <div id="pedals">

        <div class="pedal" id="brake">
          <div class="pedalName">BRAKE</div>
          <div class="pedalTrack">
            <div class="pedalFill" id="brakeFill"></div>
          </div>
          <div class="pedalPercent" id="brakePercent">0%</div>
        </div>

        <div class="pedal" id="accel">
          <div class="pedalName">ACCEL</div>
          <div class="pedalTrack">
            <div class="pedalFill" id="accelFill"></div>
          </div>
          <div class="pedalPercent" id="accelPercent">0%</div>
        </div>

      </div>

      <!-- BOTTOM SWITCHES -->

      <div id="switches">

        <button class="switch" data-switch="lights">
          <div class="switchIcon">◉</div>
          <div class="switchText">LIGHTS</div>
        </button>

        <button class="switch" data-switch="left">
          <div class="switchIcon">←</div>
          <div class="switchText">LEFT</div>
        </button>

        <button class="switch" data-switch="hazard">
          <div class="switchIcon">△</div>
          <div class="switchText">HAZARD</div>
        </button>

        <button class="switch" data-switch="right">
          <div class="switchIcon">→</div>
          <div class="switchText">RIGHT</div>
        </button>

        <button class="switch" data-switch="wipers">
          <div class="switchIcon">◇</div>
          <div class="switchText">WIPERS</div>
        </button>

        <button class="switch" data-switch="map">
          <div class="switchIcon">□</div>
          <div class="switchText">MAP</div>
        </button>

      </div>

    </div>
  </section>

</div>

<script>

/* =========================================================
   WAYFLO DRIVING SYSTEM
========================================================= */

let gear = "P";
let speed = 0;
let rpm = 800;
let temp = 88;
let fuel = 100;

let acceleration = 0;
let braking = 0;
let steering = 0;

let lastTime = performance.now();

/* =========================================================
   ELEMENTS
========================================================= */

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const tempEl = document.getElementById("temp");
const fuelEl = document.getElementById("fuel");
const gearDisplay = document.getElementById("gearDisplay");

const brakeFill = document.getElementById("brakeFill");
const accelFill = document.getElementById("accelFill");

const brakePercent = document.getElementById("brakePercent");
const accelPercent = document.getElementById("accelPercent");

const steeringEl = document.getElementById("steering");

/* =========================================================
   GEAR SELECTOR
========================================================= */

document.querySelectorAll(".gearButton").forEach(button => {

  button.addEventListener("click", () => {

    gear = button.dataset.gear;

    document.querySelectorAll(".gearButton")
      .forEach(b => b.classList.remove("active"));

    button.classList.add("active");

    gearDisplay.textContent = gear;

    if(gear === "P" || gear === "N"){
      speed = 0;
    }

  });

});

/* =========================================================
   PEDAL SLIDER
========================================================= */

function makePedal(element, fill, percent, callback){

  let active = false;

  function update(clientY){

    const rect = element.getBoundingClientRect();

    let value =
      (rect.bottom - clientY) / rect.height;

    value = Math.max(0,Math.min(1,value));

    callback(value);

    fill.style.height = (value * 100) + "%";
    percent.textContent =
      Math.round(value * 100) + "%";
  }

  element.addEventListener("pointerdown",e=>{
    active=true;
    element.setPointerCapture(e.pointerId);
    update(e.clientY);
  });

  element.addEventListener("pointermove",e=>{
    if(active) update(e.clientY);
  });

  element.addEventListener("pointerup",()=>{
    active=false;
  });

  element.addEventListener("pointercancel",()=>{
    active=false;
  });
}

makePedal(
  document.getElementById("accel"),
  accelFill,
  accelPercent,
  value => acceleration=value
);

makePedal(
  document.getElementById("brake"),
  brakeFill,
  brakePercent,
  value => braking=value
);

/* =========================================================
   STEERING
========================================================= */

let steeringActive=false;

steeringEl.addEventListener("pointerdown",e=>{
  steeringActive=true;
  steeringEl.setPointerCapture(e.pointerId);
  updateSteering(e.clientX);
});

steeringEl.addEventListener("pointermove",e=>{
  if(steeringActive) updateSteering(e.clientX);
});

steeringEl.addEventListener("pointerup",()=>{
  steeringActive=false;
  steering=0;
  steeringEl.style.transform="rotate(0deg)";
});

function updateSteering(x){

  const rect=steeringEl.getBoundingClientRect();

  const centre=rect.left+rect.width/2;

  steering=(x-centre)/(rect.width/2);

  steering=Math.max(-1,Math.min(1,steering));

  steeringEl.style.transform=
    "rotate("+(steering*70)+"deg)";
}

/* =========================================================
   LIGHTS / SWITCHES
========================================================= */

document.querySelectorAll(".switch").forEach(button=>{

  button.addEventListener("click",()=>{

    const type=button.dataset.switch;

    if(type==="hazard"){

      document
        .querySelectorAll('[data-switch="left"],[data-switch="right"]')
        .forEach(b=>b.classList.remove("active"));

    }

    if(type==="left"){

      document
        .querySelector('[data-switch="right"]')
        .classList.remove("active");

    }

    if(type==="right"){

      document
        .querySelector('[data-switch="left"]')
        .classList.remove("active");

    }

    button.classList.toggle("active");

  });

});

/* =========================================================
   DRIVING PHYSICS
========================================================= */

function updateDriving(dt){

  const forward =
    gear==="D";

  const reverse =
    gear==="R";

  if(forward || reverse){

    const accelerationForce =
      acceleration * 32;

    const brakingForce =
      braking * 55;

    speed +=
      accelerationForce * dt;

    speed -=
      brakingForce * dt;

    if(acceleration===0){
      speed -= 5 * dt;
    }

    speed=Math.max(0,Math.min(140,speed));

  }else{

    speed=0;

  }

  if(reverse){
    speed=Math.min(speed,25);
  }

  rpm =
    800 +
    acceleration * 4200 +
    speed * 15;

  if(braking>.1){
    rpm-=braking*300;
  }

  rpm=Math.max(800,Math.min(6500,rpm));

  if(acceleration>.7 && temp<105){
    temp+=.012*dt*60;
  }else if(temp>88){
    temp-=.004*dt*60;
  }

  temp=Math.max(88,Math.min(105,temp));

  fuel-=
    acceleration * .0007 * dt * 60;

  fuel=Math.max(0,fuel);

  speedEl.textContent=Math.round(speed);
  rpmEl.textContent=Math.round(rpm);
  tempEl.textContent=Math.round(temp);
  fuelEl.textContent=Math.round(fuel);

}

/* =========================================================
   ANIMATION LOOP
========================================================= */

function loop(now){

  let dt=(now-lastTime)/1000;

  lastTime=now;

  dt=Math.min(dt,.05);

  updateDriving(dt);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   MIRROR BUTTON
========================================================= */

document.getElementById("mirrorButton")
  .addEventListener("click",()=>{

    const mirror=document.getElementById("mirror");

    mirror.style.opacity =
      mirror.style.opacity==="0.35" ? "1" : "0.35";

  });

/* =========================================================
   START
========================================================= */

console.log("WAYFLO cockpit ready");

</script>

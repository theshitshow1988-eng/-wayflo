<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>WAYFLO World Simulator</title>

<style>
*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#05080b;
  font-family:Arial,Helvetica,sans-serif;
  color:white;
  touch-action:none;
}

button{
  font:inherit;
  color:white;
  border:0;
  outline:0;
  touch-action:none;
}

#game{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:#111;
}

/* ---------------- WINDSCREEN ---------------- */

#world{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:67%;
  overflow:hidden;
  background:
    linear-gradient(#69b7e5 0%,#a9d9ee 53%,#788e78 54%,#465143 100%);
}

#sun{
  position:absolute;
  width:18vw;
  height:18vw;
  max-width:110px;
  max-height:110px;
  border-radius:50%;
  background:#fff0a5;
  right:17%;
  top:15%;
  box-shadow:0 0 35px rgba(255,235,150,.45);
}

.hill{
  position:absolute;
  left:-20%;
  width:140%;
  height:24%;
  bottom:23%;
  background:#718b91;
  border-radius:50% 50% 0 0;
}

.hill.back{
  bottom:19%;
  background:#879b75;
  transform:scaleX(1.15);
}

.tree{
  position:absolute;
  bottom:18%;
  width:18px;
  height:95px;
  background:#654a32;
}

.tree:before{
  content:"";
  position:absolute;
  width:90px;
  height:90px;
  left:-36px;
  top:-55px;
  border-radius:50%;
  background:#285b38;
  box-shadow:
    32px 18px 0 #316c40,
    -22px 20px 0 #347247;
}

.t1{left:8%;transform:scale(.85)}
.t2{left:25%;transform:scale(.6)}
.t3{right:17%;transform:scale(1.05)}
.t4{right:5%;transform:scale(.72)}

#road{
  position:absolute;
  left:12%;
  width:76%;
  height:48%;
  bottom:-1%;
  background:#34383a;
  clip-path:polygon(34% 0,66% 0,100% 100%,0 100%);
}

#road:before,
#road:after{
  content:"";
  position:absolute;
  top:0;
  height:100%;
  width:4px;
  background:#f4f4f0;
}

#road:before{left:31%}
#road:after{right:31%}

.lane{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:5px;
  height:10%;
  background:white;
  border-radius:4px;
}

.l1{top:6%}
.l2{top:28%}
.l3{top:51%}
.l4{top:75%}

/* ---------------- TOP UI ---------------- */

#topbar{
  position:absolute;
  z-index:20;
  top:3%;
  left:4%;
  right:4%;
  height:10%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.info{
  background:rgba(8,17,24,.78);
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  padding:10px 15px;
  min-width:48%;
  box-shadow:0 8px 20px rgba(0,0,0,.22);
}

.info strong{
  display:block;
  font-size:clamp(15px,4vw,23px);
  letter-spacing:2px;
}

.info small{
  display:block;
  margin-top:5px;
  opacity:.8;
  font-size:clamp(11px,3vw,16px);
}

.topBtns{
  display:flex;
  gap:8px;
}

.topBtn{
  width:66px;
  height:66px;
  border-radius:17px;
  background:rgba(8,17,24,.78);
  border:1px solid rgba(255,255,255,.25);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.topBtn span{
  font-size:9px;
  letter-spacing:1px;
  margin-top:4px;
}

#exit{
  position:absolute;
  z-index:21;
  left:4%;
  top:14%;
  width:76px;
  height:66px;
  border-radius:17px;
  background:rgba(8,17,24,.75);
  border:1px solid rgba(255,255,255,.22);
  font-size:12px;
  font-weight:bold;
}

/* ---------------- MIRROR ---------------- */

#mirror{
  position:absolute;
  z-index:15;
  top:15%;
  left:18%;
  width:64%;
  height:12%;
  min-height:62px;
  border:6px solid #111;
  border-radius:28px;
  overflow:hidden;
  background:linear-gradient(#72b7df,#718d75);
  box-shadow:0 5px 15px rgba(0,0,0,.4);
}

#mirrorRoad{
  position:absolute;
  left:42%;
  bottom:0;
  width:16%;
  height:65%;
  background:#34383a;
  clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);
}

#mirrorCar{
  position:absolute;
  left:48%;
  bottom:19%;
  width:4%;
  height:10%;
  background:#333;
  border-radius:3px;
}

/* ---------------- COCKPIT ---------------- */

#cockpit{
  position:absolute;
  z-index:30;
  bottom:0;
  left:0;
  width:100%;
  height:36%;
  background:
    linear-gradient(rgba(5,8,11,.93),rgba(3,5,7,.98));
  border-top:2px solid rgba(255,255,255,.12);
  box-shadow:0 -15px 30px rgba(0,0,0,.3);
}

/* dashboard */

#dashboard{
  position:absolute;
  left:22%;
  right:22%;
  top:4%;
  height:30%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.gauge{
  width:74px;
  height:74px;
  border-radius:50%;
  border:5px solid #343b40;
  background:#080b0e;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  box-shadow:inset 0 0 15px #000;
}

.gauge b{
  font-size:22px;
}

.gauge small{
  font-size:8px;
  opacity:.7;
}

#gearDisplay{
  width:58px;
  height:58px;
  border:3px solid #343b40;
  border-radius:10px;
  background:#090c0f;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

#status{
  position:absolute;
  left:4%;
  right:4%;
  top:34%;
  text-align:center;
  font-size:10px;
  letter-spacing:1px;
  opacity:.8;
}

/* steering */

#steering{
  position:absolute;
  left:3%;
  bottom:18%;
  width:30vw;
  height:30vw;
  max-width:190px;
  max-height:190px;
  border:10px solid rgba(255,255,255,.18);
  border-radius:50%;
  background:rgba(10,15,19,.42);
  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.08),
    0 5px 20px rgba(0,0,0,.4);
}

#steerInner{
  position:absolute;
  inset:22%;
  border-radius:50%;
  border:5px solid rgba(255,255,255,.16);
  display:flex;
  align-items:center;
  justify-content:center;
}

#steerLogo{
  font-size:11px;
  font-weight:bold;
  letter-spacing:2px;
  opacity:.8;
}

.steerArrow{
  position:absolute;
  top:42%;
  font-size:30px;
  opacity:.7;
}

.leftArrow{left:5%}
.rightArrow{right:5%}

/* gear */

#gears{
  position:absolute;
  left:48%;
  bottom:23%;
  transform:translateX(-50%);
  width:54px;
  display:flex;
  flex-direction:column;
  gap:3px;
}

.gear{
  width:54px;
  height:38px;
  border-radius:9px;
  background:rgba(20,25,29,.82);
  border:1px solid rgba(255,255,255,.14);
  font-weight:bold;
  font-size:15px;
}

.gear.active{
  background:#365e70;
  border-color:#76c9e5;
}

/* pedals */

#pedals{
  position:absolute;
  right:4%;
  bottom:17%;
  height:66%;
  display:flex;
  gap:10px;
}

.pedal{
  position:relative;
  width:65px;
  height:100%;
  border-radius:20px;
  background:rgba(8,12,15,.55);
  border:2px solid rgba(255,255,255,.2);
  overflow:hidden;
}

.pedal.brake{border-color:rgba(220,90,90,.65)}
.pedal.accel{border-color:rgba(70,190,220,.65)}

.pedalFill{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:0%;
  background:rgba(255,255,255,.13);
}

.pedalLabel{
  position:absolute;
  top:8px;
  left:0;
  width:100%;
  text-align:center;
  font-size:9px;
  letter-spacing:1px;
  opacity:.75;
}

/* bottom controls */

#controls{
  position:absolute;
  z-index:40;
  left:3%;
  right:3%;
  bottom:2%;
  height:14%;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
}

.control{
  border-radius:13px;
  background:rgba(10,15,19,.72);
  border:1px solid rgba(255,255,255,.18);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.control span{
  margin-top:3px;
  font-size:7px;
  letter-spacing:1px;
  opacity:.8;
}

.control.on{
  background:rgba(60,110,125,.7);
  border-color:#8bd9ed;
}

/* message */

#message{
  position:absolute;
  z-index:100;
  top:30%;
  left:50%;
  transform:translateX(-50%);
  padding:10px 18px;
  border-radius:20px;
  background:rgba(0,0,0,.72);
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#message.show{opacity:1}

/* mobile adjustments */

@media(max-width:380px){
  .topBtn{width:58px;height:58px}
  #exit{width:68px;height:58px}
  .gauge{width:62px;height:62px}
  #steering{width:27vw;height:27vw}
  .pedal{width:58px}
}

@media(min-width:600px){
  #cockpit{height:38%}
}
</style>
</head>

<body>
<div id="game">

  <div id="world">
    <div id="sun"></div>
    <div class="hill"></div>
    <div class="hill back"></div>

    <div class="tree t1"></div>
    <div class="tree t2"></div>
    <div class="tree t3"></div>
    <div class="tree t4"></div>

    <div id="road">
      <div class="lane l1"></div>
      <div class="lane l2"></div>
      <div class="lane l3"></div>
      <div class="lane l4"></div>
    </div>

    <div id="mirror">
      <div id="mirrorRoad"></div>
      <div id="mirrorCar"></div>
    </div>
  </div>

  <div id="topbar">
    <div class="info">
      <strong>WAYFLO • CAR 01</strong>
      <small>● CONDITION <b id="condition">100</b>%</small>
    </div>

    <div class="topBtns">
      <button class="topBtn" id="mirrorBtn">◉<span>MIRROR</span></button>
      <button class="topBtn" id="settingsBtn">⚙<span>SETTINGS</span></button>
    </div>
  </div>

  <button id="exit">↪<br>EXIT</button>

  <div id="cockpit">

    <div id="dashboard">
      <div class="gauge">
        <b id="speed">0</b>
        <small>KM/H</small>
      </div>

      <div id="gearDisplay">P</div>

      <div class="gauge">
        <b id="rpm">800</b>
        <small>RPM</small>
      </div>
    </div>

    <div id="status">
      <span>● READY</span>
      &nbsp; • &nbsp;
      TEMP <span id="temp">88</span>°C
      &nbsp; • &nbsp;
      FUEL <span id="fuel">100</span>%
      &nbsp; • &nbsp;
      <span id="weather">☀ CLEAR</span>
    </div>

    <div id="steering">
      <div id="steerInner">
        <span id="steerLogo">WAYFLO</span>
      </div>
      <span class="steerArrow leftArrow">‹</span>
      <span class="steerArrow rightArrow">›</span>
    </div>

    <div id="gears">
      <button class="gear active" data-gear="P">P</button>
      <button class="gear" data-gear="R">R</button>
      <button class="gear" data-gear="N">N</button>
      <button class="gear" data-gear="D">D</button>
    </div>

    <div id="pedals">
      <div class="pedal brake" id="brake">
        <div class="pedalFill"></div>
        <div class="pedalLabel">BRAKE</div>
      </div>

      <div class="pedal accel" id="accel">
        <div class="pedalFill"></div>
        <div class="pedalLabel">ACCEL</div>
      </div>
    </div>

  </div>

  <div id="controls">
    <button class="control" id="lights">💡<span>LIGHTS</span></button>
    <button class="control" id="left">←<span>LEFT</span></button>
    <button class="control" id="hazard">⚠<span>HAZARD</span></button>
    <button class="control" id="right">→<span>RIGHT</span></button>
    <button class="control" id="wipers">♢<span>WIPERS</span></button>
    <button class="control" id="map">🗺<span>MAP</span></button>
  </div>

  <div id="message"></div>
</div>

<script>
/* =========================
   WAYFLO CORE DRIVING MODEL
   ========================= */

let speed = 0;
let rpm = 800;
let gear = "P";
let accel = 0;
let brake = 0;
let steering = 0;
let fuel = 100;
let temp = 88;
let distance = 0;

const speedEl = document.getElementById("speed");
const rpmEl = document.getElementById("rpm");
const gearEl = document.getElementById("gearDisplay");
const fuelEl = document.getElementById("fuel");
const tempEl = document.getElementById("temp");
const conditionEl = document.getElementById("condition");
const steerEl = document.getElementById("steering");
const mirrorEl = document.getElementById("mirror");

function message(text){
  const m=document.getElementById("message");
  m.textContent=text;
  m.classList.add("show");
  clearTimeout(window.msgTimer);
  window.msgTimer=setTimeout(()=>m.classList.remove("show"),1300);
}

/* ---------------- GEAR ---------------- */

document.querySelectorAll(".gear").forEach(btn=>{
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();

    const newGear=btn.dataset.gear;

    if(Math.abs(speed)>2 && newGear==="P"){
      message("STOP BEFORE SELECTING PARK");
      return;
    }

    gear=newGear;

    document.querySelectorAll(".gear").forEach(x=>{
      x.classList.toggle("active",x===btn);
    });

    gearEl.textContent=gear;
    message("GEAR • "+gear);
  });
});

/* ---------------- PEDAL SLIDERS ---------------- */

function pedalControl(el,type){

  const fill=el.querySelector(".pedalFill");
  let active=false;

  function update(e){
    const r=el.getBoundingClientRect();
    let value=1-(e.clientY-r.top)/r.height;
    value=Math.max(0,Math.min(1,value));

    if(type==="accel") accel=value;
    else brake=value;

    fill.style.height=(value*100)+"%";
  }

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    active=true;
    el.setPointerCapture(e.pointerId);
    update(e);
  });

  el.addEventListener("pointermove",e=>{
    if(active) update(e);
  });

  el.addEventListener("pointerup",()=>{
    active=false;
    if(type==="accel") accel=0;
    else brake=0;
    fill.style.height="0%";
  });

  el.addEventListener("pointercancel",()=>{
    active=false;
    if(type==="accel") accel=0;
    else brake=0;
    fill.style.height="0%";
  });
}

pedalControl(document.getElementById("accel"),"accel");
pedalControl(document.getElementById("brake"),"brake");

/* ---------------- STEERING ---------------- */

let steeringActive=false;
let steerStartX=0;
let steerStartValue=0;

steerEl.addEventListener("pointerdown",e=>{
  e.preventDefault();
  steeringActive=true;
  steerStartX=e.clientX;
  steerStartValue=steering;
  steerEl.setPointerCapture(e.pointerId);
});

steerEl.addEventListener("pointermove",e=>{
  if(!steeringActive)return;

  const delta=(e.clientX-steerStartX)/100;
  steering=Math.max(-1,Math.min(1,steerStartValue+delta));

  const rotation=steering*70;
  steerEl.style.transform="rotate("+rotation+"deg)";
});

steerEl.addEventListener("pointerup",()=>{
  steeringActive=false;
  steering*=0.35;
});

steerEl.addEventListener("pointercancel",()=>{
  steeringActive=false;
  steering=0;
});

/* ---------------- LIGHTS / INDICATORS ---------------- */

function toggleButton(id,label){
  document.getElementById(id).addEventListener("pointerdown",e=>{
    e.preventDefault();
    e.currentTarget.classList.toggle("on");
    message(label);
  });
}

toggleButton("lights","LIGHTS");
toggleButton("hazard","HAZARD");
toggleButton("wipers","WIPERS");

document.getElementById("left").addEventListener("pointerdown",()=>{
  document.getElementById("left").classList.toggle("on");
  document.getElementById("right").classList.remove("on");
  message("LEFT INDICATOR");
});

document.getElementById("right").addEventListener("pointerdown",()=>{
  document.getElementById("right").classList.toggle("on");
  document.getElementById("left").classList.remove("on");
  message("RIGHT INDICATOR");
});

document.getElementById("map").addEventListener("pointerdown",()=>{
  message("MAP SYSTEM — COMING SOON");
});

document.getElementById("settingsBtn").addEventListener("pointerdown",()=>{
  message("SETTINGS — COMING SOON");
});

document.getElementById("mirrorBtn").addEventListener("pointerdown",()=>{
  mirrorEl.style.display=
    mirrorEl.style.display==="none" ? "block" : "none";
});

document.getElementById("exit").addEventListener("pointerdown",()=>{
  message("EXIT VEHICLE — COMING SOON");
});

/* ---------------- DRIVING PHYSICS ---------------- */

let last=performance.now();

function loop(now){

  const dt=Math.min(.05,(now-last)/1000);
  last=now;

  let targetAccel=0;

  if(gear==="D") targetAccel=accel;
  if(gear==="R") targetAccel=-accel;

  if(gear==="P" || gear==="N"){
    targetAccel=0;
  }

  /* acceleration */
  speed += targetAccel*28*dt;

  /* natural rolling resistance */
  if(accel===0){
    speed *= Math.pow(.992,dt*60);
  }

  /* braking */
  speed -= brake*55*dt;

  /* prevent impossible values */
  if(gear==="D") speed=Math.max(0,speed);
  if(gear==="R") speed=Math.min(0,speed);

  speed=Math.max(-18,Math.min(180,speed));

  /* engine RPM */
  const absSpeed=Math.abs(speed);

  if(gear==="P" || gear==="N"){
    rpm=800+accel*2500;
  }else{
    rpm=800+absSpeed*55+accel*2300;
  }

  rpm=Math.max(700,Math.min(6500,rpm));

  /* steering visual movement */
  if(!steeringActive){
    steering*=Math.pow(.90,dt*60);
    steerEl.style.transform="rotate("+(steering*70)+"deg)";
  }

  /* road animation */
  const lanes=document.querySelectorAll(".lane");
  const roadMotion=Math.abs(speed)*1.8;

  lanes.forEach((lane,i)=>{
    let y=parseFloat(lane.dataset.y||[6,28,51,75][i]);
    y+=roadMotion*dt;

    if(y>100)y=-12;

    lane.dataset.y=y;
    lane.style.top=y+"%";
  });

  /* mirror car */
  const mirrorCar=document.getElementById("mirrorCar");
  mirrorCar.style.transform=
    "translateX("+(-steering*20)+"px)";

  /* dashboard */
  speedEl.textContent=Math.round(Math.abs(speed));
  rpmEl.textContent=Math.round(rpm);
  gearEl.textContent=gear;
  fuelEl.textContent=Math.round(fuel);

  if(accel>0 && Math.abs(speed)>0){
    fuel-=accel*.002*dt*60;
  }

  fuel=Math.max(0,fuel);

  if(temp<105 && accel>.7){
    temp+=.015*dt*60;
  }else if(temp>88){
    temp-=.005*dt*60;
  }

  tempEl.textContent=Math.round(temp);

  distance+=Math.abs(speed)*dt/3600;

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

message("WAYFLO • COCKPIT READY");
</script>
</body>
</html>
